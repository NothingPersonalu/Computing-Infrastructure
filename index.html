is memory: how it changes (Q1, Q5), how many bits you need to number the memory (Q2), and how to build circuits with one kind of gate (Q3, Q4).<\/div>\n  <nav class=\"tabs\" role=\"tablist\" aria-label=\"Tutorial questions\" id=\"tabs\"><\/nav>\n  <div class=\"card\"><h2 id=\"qTitle\"><\/h2><div class=\"intro\"><div class=\"life\"><b>In real life<\/b><div id=\"qLife\"><\/div><\/div><div class=\"note\"><b>The method<\/b><ol id=\"qHow\" style=\"margin:4px 0 0;padding-left:22px\"><\/ol><\/div><\/div><figure id=\"qFigW\" style=\"margin:0\"><div id=\"qFig\"><\/div><figcaption class=\"figcap\" id=\"qFigCap\"><\/figcaption><\/figure><p class=\"think\" id=\"qThink\"><\/p><\/div>\n\n  <section id=\"d1\" class=\"wrap\" style=\"gap:16px\" hidden>\n  <div class=\"card\"><div class=\"stn\"><span class=\"sn\">1<\/span><h2>Meet the JK lamp<\/h2><\/div>\n    <p class=\"muted\">J asks \u201cswitch ON\u201d, K asks \u201cswitch OFF\u201d. The flip-flop obeys only at the tick. Do the 4 missions.<\/p>\n    <div class=\"ffrow\">\n      <div class=\"dev\"><span class=\"muted\">J (ON)<\/span><button class=\"tog big\" id=\"jB\" aria-pressed=\"false\">J = 0<\/button><\/div>\n      <div class=\"dev\"><span class=\"muted\">K (OFF)<\/span><button class=\"tog big\" id=\"kB\" aria-pressed=\"false\">K = 0<\/button><\/div>\n      <div class=\"dev\"><span class=\"muted\">Clock<\/span><button class=\"btn\" id=\"clk\">Tick \u2191<\/button><\/div>\n      <div class=\"dev\"><span class=\"muted\">Output<\/span><div class=\"lamp\" id=\"qLed\">0<\/div><b>Q<\/b><\/div>\n    <\/div>\n    <ol class=\"missions\" id=\"j1Mis\"><\/ol>\n    <div class=\"actbox\" id=\"jkAct\"><\/div>\n    <div class=\"scroll\"><div class=\"wave\" id=\"j1W\"><\/div><\/div>\n    <div class=\"row\"><button class=\"btn ghost sm\" id=\"jkReset\">Start again<\/button><\/div>\n  <\/div>\n  <div class=\"card\"><div class=\"stn\"><span class=\"sn\">2<\/span><h2>Prove it: fill the truth table by experiment<\/h2><\/div>\n    <p class=\"muted\">Every tick you make in station 1 writes one row here. Try all 8 situations (J, K and the lamp before the tick).<\/p>\n    <div class=\"scroll\"><table class=\"t\" id=\"j2T\"><\/table><\/div>\n    <p class=\"fb\" id=\"j2Fb\"><\/p>\n  <\/div>\n  <div class=\"card\"><div class=\"stn\"><span class=\"sn\">3<\/span><h2>Predict before the tick<\/h2><\/div>\n    <p class=\"muted\">Read J, K and the lamp. What will Q be after the tick?<\/p>\n    <div id=\"j3Q\" class=\"pq\"><\/div>\n    <p class=\"fb\" id=\"j3Fb\"><\/p>\n  <\/div>\n<\/section>\n<section id=\"d2\" class=\"wrap\" style=\"gap:16px\" hidden>\n  <div class=\"card\"><div class=\"stn\"><span class=\"sn\">1<\/span><h2>Lockers and bits<\/h2><\/div>\n    <p class=\"muted\">Each locker needs its own binary number (its address). Add or remove a bit and watch the lockers.<\/p>\n    <div class=\"row\" style=\"justify-content:center\"><button class=\"btn ghost\" id=\"l1M\">\u2212 1 bit<\/button><div class=\"big\" id=\"l1N\"><\/div><button class=\"btn\" id=\"l1P\">+ 1 bit<\/button><\/div>\n    <div class=\"lockers\" id=\"l1G\"><\/div>\n    <ol class=\"missions\" id=\"l1Mis\"><\/ol>\n    <div class=\"actbox\" id=\"l1Act\"><\/div>\n  <\/div>\n  <div class=\"card\"><div class=\"stn\"><span class=\"sn\">2<\/span><h2>The working, step by step<\/h2><\/div>\n    <p class=\"muted\">Type a memory size (not the tutorial one) and read the steps you will write on your paper.<\/p>\n    <div class=\"row\"><label for=\"msz\" class=\"muted\">Memory size<\/label><input type=\"text\" id=\"msz\" class=\"mono-in\" value=\"2K\" style=\"width:7em\"><span class=\"chips\" id=\"mszEx\"><\/span><\/div>\n    <div class=\"actbox\" id=\"mAct\"><\/div>\n    <div class=\"scroll\"><table class=\"t\" id=\"mLad\"><\/table><\/div>\n  <\/div>\n  <div class=\"card\"><div class=\"stn\"><span class=\"sn\">3<\/span><h2>Your turn<\/h2><\/div>\n    <div id=\"l3Q\" class=\"pq\"><\/div>\n    <p class=\"fb\" id=\"l3Fb\"><\/p>\n  <\/div>\n<\/section>\n<section id=\"d3\" class=\"wrap\" style=\"gap:16px\" hidden>\n  <div class=\"card\"><div class=\"stn\"><span class=\"sn\">1<\/span><h2>Meet the NAND gate<\/h2><\/div>\n    <p class=\"muted\">NAND = NOT AND. Flip A and B and find the only input that switches the lamp off.<\/p>\n    <div class=\"ffrow\">\n      <div class=\"dev\"><span class=\"muted\">A<\/span><button class=\"tog big\" id=\"n1A\" aria-pressed=\"false\">A = 0<\/button><\/div>\n      <div class=\"dev\"><span class=\"muted\">B<\/span><button class=\"tog big\" id=\"n1B\" aria-pressed=\"false\">B = 0<\/button><\/div>\n      <div class=\"dev\"><span class=\"muted\">A NAND B<\/span><div class=\"lamp\" id=\"n1Q\">1<\/div><\/div>\n    <\/div>\n    <div class=\"scroll\"><table class=\"t\" id=\"n1T\"><\/table><\/div>\n    <div class=\"actbox\" id=\"n1Act\"><\/div>\n  <\/div>\n  <div class=\"card\"><div class=\"stn\"><span class=\"sn\">2<\/span><h2>Wire it yourself<\/h2><\/div>\n    <p class=\"muted\">Use only one kind of gate. Choose what goes into each gate. The last gate is the output. Make your column match the target column.<\/p>\n    <div class=\"row\"><span class=\"muted\">Only<\/span><div class=\"chips\" id=\"b2U\" role=\"group\" aria-label=\"Universal gate\"><\/div><span class=\"muted\">build<\/span><div class=\"chips\" id=\"b2T\" role=\"group\" aria-label=\"Target gate\"><\/div><\/div>\n    <div class=\"row\"><span class=\"muted\">Gates:<\/span><div class=\"chips\" id=\"b2N\" role=\"group\" aria-label=\"Number of gates\"><\/div><\/div>\n    <div id=\"b2G\" class=\"wires\"><\/div>\n    <div class=\"scroll\"><table class=\"t\" id=\"b2Tab\"><\/table><\/div>\n    <div class=\"actbox\" id=\"b2Act\"><\/div>\n  <\/div>\n  <div class=\"card\"><div class=\"stn\"><span class=\"sn\">3<\/span><h2>Stuck? Compare with one solution<\/h2><\/div>\n    <details><summary><b>Show one solution<\/b> (try station 2 first)<\/summary>\n    <div class=\"row\" style=\"margin-top:8px\"><span class=\"muted\">Only<\/span><div class=\"chips\" role=\"group\" aria-label=\"Universal gate\"><button data-ug=\"NAND\" aria-pressed=\"true\">NAND<\/button><button data-ug=\"NOR\" aria-pressed=\"false\">NOR<\/button><\/div><span class=\"muted\">build<\/span><div class=\"chips\" role=\"group\" aria-label=\"Target\"><button data-tg=\"NOT\" aria-pressed=\"true\">NOT<\/button><button data-tg=\"AND\" aria-pressed=\"false\">AND<\/button><button data-tg=\"OR\" aria-pressed=\"false\">OR<\/button><\/div><\/div>\n    <div class=\"actbox\" id=\"uAct\"><\/div><div class=\"scroll\"><table class=\"t\" id=\"uT\"><\/table><\/div><\/details>\n  <\/div>\n<\/section>\n<section id=\"d4\" class=\"wrap\" style=\"gap:16px\" hidden>\n  <div class=\"card\"><p style=\"margin:0\">Practice function (same shape as the tutorial, other letters): <b class=\"term\">F = ABD + BC'D + A'BD<\/b><\/p><p class=\"muted\" style=\"margin:6px 0 0\">Do the 4 steps in order, exactly as on your exam paper. Then do the tutorial function the same way.<\/p><\/div>\n  <div class=\"card\"><div class=\"stn\"><span class=\"sn\">1<\/span><h2>i) Truth table: find the rows where F = 1<\/h2><\/div>\n    <div class=\"actbox\" id=\"g1Act\"><\/div>\n    <div class=\"tf\"><span class=\"muted\">Pick a term:<\/span><div class=\"chips\" id=\"g1Terms\" role=\"group\" aria-label=\"Terms of F\"><\/div><\/div>\n    <div id=\"g1Slot\" class=\"slots\"><\/div>\n    <div class=\"scroll\" style=\"max-height:460px\"><table class=\"t\" id=\"g1T\"><\/table><\/div>\n    <div class=\"row\"><button class=\"btn\" id=\"g1C\">Check my table<\/button><p class=\"fb\" id=\"g1Fb\" style=\"margin:0\"><\/p><\/div>\n  <\/div>\n  <div class=\"card\"><div class=\"stn\"><span class=\"sn\">2<\/span><h2>ii-a) Put the 1s in the K-map<\/h2><\/div>\n    <div class=\"actbox\" id=\"g2Act\"><\/div>\n    <div class=\"scroll\"><table class=\"kmap\" id=\"g2K\"><\/table><\/div>\n    <div class=\"row\"><button class=\"btn\" id=\"g2C\">Check my K-map<\/button><p class=\"fb\" id=\"g2Fb\" style=\"margin:0\"><\/p><\/div>\n  <\/div>\n  <div class=\"card\"><div class=\"stn\"><span class=\"sn\">3<\/span><h2>ii-b) Group them: which letters stay?<\/h2><\/div>\n    <div class=\"actbox\" id=\"g3Act\"><\/div>\n    <div class=\"scroll\"><table class=\"t\" id=\"g3T\"><\/table><\/div>\n    <div class=\"row\"><button class=\"btn\" id=\"g3C\">Check<\/button><p class=\"fb\" id=\"g3Fb\" style=\"margin:0\"><\/p><\/div>\n  <\/div>\n  <div class=\"card\"><div class=\"stn\"><span class=\"sn\">4<\/span><h2>iii) NAND gates only, step by step<\/h2><\/div>\n    <p class=\"muted\" style=\"margin:0\">We found F = BD. Now build it with NAND gates only. Press <b>Next step<\/b> and watch the table: green = same as F, red = wrong.<\/p>\n    <div class=\"row\"><button class=\"btn ghost\" id=\"g4P\">\u25c0 Back<\/button><button class=\"btn\" id=\"g4N\">Next step \u25b6<\/button><span class=\"muted\" id=\"g4S\"><\/span><\/div>\n    <div id=\"g4Svg\"><\/div>\n    <div class=\"scroll\"><table class=\"t\" id=\"g4T\"><\/table><\/div>\n    <div class=\"actbox\" id=\"g4Act\"><\/div>\n    <div id=\"g4Q\" hidden><p style=\"margin:0\"><b>Check yourself: how many NAND gates for F = BD?<\/b><\/p>\n    <div class=\"chips\" id=\"g4O\" role=\"group\" aria-label=\"Number of NAND gates\"><\/div>\n    <p class=\"fb\" id=\"g4Fb\"><\/p><\/div>\n    <details><summary><b>Why simplify first?<\/b> The same F without the K-map<\/summary>\n    <div class=\"actbox\" style=\"margin-top:8px\"><b>F = ABD + BC'D + A'BD with NAND only<\/b><ol><li>Make the barred letters: C' = NAND(C, C) and A' = NAND(A, A) \u2192 2 gates.<\/li><li>Level 1, one NAND per term: NAND(A, B, D), NAND(B, C', D), NAND(A', B, D) \u2192 3 gates (each with 3 inputs).<\/li><li>Level 2, one NAND joins the 3 terms \u2192 1 gate.<\/li><li>Total: <b>6 gates<\/b>, against <b>2<\/b> after the K-map. Same lamp, same answer, one third of the gates.<\/li><\/ol><\/div><\/details>\n  <\/div>\n  <div class=\"card\"><div class=\"stn\"><span class=\"sn\">5<\/span><h2>Lab: any function, step by step<\/h2><\/div>\n    <p class=\"muted\">Type a function (not the tutorial one), press <b>Start<\/b>, then <b>Next step<\/b>. You will see how it becomes a truth table, then a K-map, then a short answer and NAND gates.<\/p>\n    <div class=\"row\"><label for=\"fx\" class=\"muted\">F =<\/label><input type=\"text\" id=\"fx\" class=\"mono-in\" style=\"width:min(100%,22em)\" value=\"AB'D + ABD + A'BCD\"><button class=\"btn\" id=\"fGo\">Start<\/button><span class=\"muted\" style=\"font-size:.9rem\">Write NOT as ' (A' = \u0100)<\/span><\/div>\n    <div class=\"chips\" id=\"fEx\" role=\"group\" aria-label=\"Examples\"><\/div>\n    <p class=\"fb no\" id=\"fErr\"><\/p>\n    <div class=\"row\"><button class=\"btn ghost\" id=\"lbP\">\u25c0 Back<\/button><button class=\"btn\" id=\"lbN\">Next step \u25b6<\/button><span class=\"muted\" id=\"lbS\"><\/span><\/div>\n    <div class=\"steptrack\" id=\"lbTrack\"><\/div>\n    <div class=\"actbox\" id=\"lbAct\"><\/div>\n    <div id=\"lbSlot\" class=\"slots\"><\/div>\n    <div class=\"grid2\"><div><h3>i) Truth table<\/h3><div class=\"scroll\" style=\"max-height:460px\"><table class=\"t\" id=\"fTT\"><\/table><\/div><\/div>\n    <div><h3>ii) K-map<\/h3><div class=\"scroll\"><table class=\"kmap\" id=\"fKM\"><\/table><\/div><div class=\"groups\" id=\"fG\"><\/div><p class=\"term\" id=\"fR\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n  <section id=\"d5\" class=\"wrap\" style=\"gap:16px\" hidden>\n  <div class=\"card\">\n    <div class=\"stn\"><span class=\"sn\">1<\/span><h2>A flip-flop is a 1-bit memory<\/h2><\/div>\n    <p class=\"muted\">D is what you want to store. The camera button is the clock tick. Q is what the flip-flop remembers. Do the 3 missions in order.<\/p>\n    <div class=\"ffrow\">\n      <div class=\"dev\"><span class=\"muted\">Input<\/span><button class=\"tog big\" id=\"m1D\" aria-pressed=\"false\">D = 0<\/button><\/div>\n      <div class=\"dev\"><span class=\"muted\">Clock<\/span><button class=\"btn\" id=\"m1C\">\ud83d\udcf8 Tick \u2191<\/button><\/div>\n      <div class=\"dev\"><span class=\"muted\">Output<\/span><div class=\"lamp\" id=\"m1Q\">0<\/div><b>Q<\/b><\/div>\n    <\/div>\n    <ol class=\"missions\" id=\"m1Mis\"><\/ol>\n    <div class=\"actbox\" id=\"m1Act\"><\/div>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"stn\"><span class=\"sn\">2<\/span><h2>Latch vs flip-flop, step by step<\/h2><\/div>\n    <p class=\"muted\">Press <b>Next step<\/b> to move time forward. Change <b>D<\/b> whenever you like, even in the middle of a step. Watch who reacts.<\/p>\n    <div class=\"row\"><button class=\"btn\" id=\"r2N\">Next step \u25b6<\/button><button class=\"tog\" id=\"r2D\" aria-pressed=\"false\">D = 0<\/button><button class=\"btn ghost sm\" id=\"r2P\">Auto play<\/button><button class=\"btn ghost sm\" id=\"r2R\">Restart<\/button><span class=\"muted\" id=\"r2T\"><\/span><\/div>\n    <div class=\"duo\">\n      <div class=\"dev2\" id=\"r2LatC\"><div class=\"dh\"><span id=\"r2Door\"><\/span><div><b>D latch<\/b><div class=\"muted sm\">the door<\/div><\/div><\/div><div class=\"lamp\" id=\"r2L\">0<\/div><div class=\"dst\" id=\"r2Ls\"><\/div><\/div>\n      <div class=\"dev2\" id=\"r2FfC\"><div class=\"dh\"><span id=\"r2Cam\"><\/span><div><b>D flip-flop<\/b><div class=\"muted sm\">the camera<\/div><\/div><\/div><div class=\"lamp\" id=\"r2F\">0<\/div><div class=\"dst\" id=\"r2Fs\"><\/div><\/div>\n    <\/div>\n    <div class=\"actbox\" id=\"r2Act\"><\/div>\n    <div class=\"scroll\"><div class=\"wave\" id=\"r2W\"><\/div><\/div>\n    <p class=\"muted sm\" style=\"margin:0\">Columns = time steps. Shaded column = now. Clock high = the door is open; the camera clicks only where the clock goes 0 \u2192 1.<\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"stn\"><span class=\"sn\">3<\/span><h2>Build the difference table<\/h2><\/div>\n    <p class=\"muted\">For each sentence, choose who it describes. You will get the reason after each click. This is the table you write on your exam paper.<\/p>\n    <div id=\"s3\" class=\"sort\"><\/div>\n    <p class=\"fb\" id=\"s3Fb\"><\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"stn\"><span class=\"sn\">4<\/span><h2>Where flip-flops work: try 3 of them<\/h2><\/div>\n    <div class=\"chips\" id=\"a4T\" role=\"group\" aria-label=\"Applications\"><\/div>\n    <div id=\"a4Box\" class=\"a4\"><\/div>\n    <div class=\"actbox\" id=\"a4Act\"><\/div>\n    <h3 style=\"margin:6px 0 0\">More places with flip-flops<\/h3>\n    <div class=\"laws\" id=\"apps\"><\/div>\n  <\/div>\n<\/section>\n\n  <div class=\"card\"><h2>\u270d On your exam paper<\/h2><p class=\"muted\">A frame for your answer. Fill it with your own words and the tutorial's values.<\/p><ol class=\"frame\" id=\"frame\"><\/ol><\/div>\n  <footer>The examples on this page are not the tutorial answers: use them to understand the method, then answer the tutorial yourself.<\/footer>\n<\/div><script>\nconst PFX='ff-';\n// ---------- logic core ----------\nconst GRAY2=[0,1,3,2];\nfunction cubesOf(n){const out=[];const rec=(p)=>{if(p.length===n){out.push(p);return}for(const c of '01-')rec(p+c)};rec('');return out}\nfunction cubeMins(c){let m=[0];for(const ch of c){m=m.flatMap(x=>ch==='-'?[x*2,x*2+1]:[x*2+(+ch)])}return m}\nfunction contains(big,small){for(let i=0;i<big.length;i++)if(big[i]!=='-'&&big[i]!==small[i])return false;return true}\nfunction solveSOP(n,ones){const S=new Set(ones);if(!ones.length)return [];\n  const imps=cubesOf(n).filter(c=>cubeMins(c).every(m=>S.has(m)));\n  const primes=imps.filter(c=>!imps.some(d=>d!==c&&contains(d,c)));\n  const lits=c=>[...c].filter(x=>x!=='-').length;\n  // essential first, then brute force the rest\n  const ess=[];for(const m of ones){const cov=primes.filter(p=>cubeMins(p).includes(m));if(cov.length===1&&!ess.includes(cov[0]))ess.push(cov[0])}\n  const covered=new Set(ess.flatMap(cubeMins));const left=ones.filter(m=>!covered.has(m));\n  const rest=primes.filter(p=>!ess.includes(p));let best=null;\n  if(!left.length)best=[];else{for(let mask=1;mask<(1<<rest.length);mask++){const pick=rest.filter((_,i)=>mask>>i&1);const cv=new Set(pick.flatMap(cubeMins));if(!left.every(m=>cv.has(m)))continue;\n    const cost=[pick.length,pick.reduce((a,c)=>a+lits(c),0)];if(!best||cost[0]<best.cost[0]||(cost[0]===best.cost[0]&&cost[1]<best.cost[1]))best={pick,cost}}best=best.pick}\n  return [...ess,...best].sort((a,b)=>lits(a)-lits(b)||(a<b?-1:1))}\nfunction termHTML(c,V){if(!c.includes('0')&&!c.includes('1'))return '1';return [...c].map((ch,i)=>ch==='-'?'':ch==='1'?V[i]:`<span class=\"nb\">${V[i]}<\/span>`).join('')}\nfunction sopHTML(cubes,V){return cubes.length?cubes.map(c=>termHTML(c,V)).join(' + '):'0'}\n// ---------- expression parser: + OR, juxtaposition or * or . AND, ' or ~ or ! NOT ----------\nfunction parseExpr(src){let s=src.replace(/\\s+/g,'').replace(/[\u00b7\u2022\u00d7]/g,'*').replace(/[\u2019`]/g,\"'\"),i=0;\n  const peek=()=>s[i];const vars=new Set();\n  function expr(){let t=[term()];while(peek()==='+'){i++;t.push(term())}return t.length===1?t[0]:{op:'or',k:t}}\n  function term(){let f=[factor()];while(i<s.length&&(peek()==='*'||peek()==='.'||/[A-Za-z(~!01]/.test(peek()))){if(peek()==='*'||peek()==='.')i++;f.push(factor())}return f.length===1?f[0]:{op:'and',k:f}}\n  function factor(){let neg=0;while(peek()==='~'||peek()==='!'){neg++;i++}let a=atom();while(peek()===\"'\"){a={op:'not',k:[a]};i++}while(neg--)a={op:'not',k:[a]};return a}\n  function atom(){const c=peek();if(c==='('){i++;const e=expr();if(peek()!==')')throw Error('missing )');i++;return e}\n    if(c==='0'||c==='1'){i++;return {op:'c',v:+c}}if(c&&/[A-Za-z]/.test(c)){i++;vars.add(c.toUpperCase());return {op:'v',n:c.toUpperCase()}}throw Error(c?`unexpected \u201c${c}\u201d`:'expression ends too early')}\n  if(!s)throw Error('empty');const e=expr();if(i<s.length)throw Error(`unexpected \u201c${s[i]}\u201d`);return {e,vars:[...vars].sort()}}\nfunction evalE(e,env){switch(e.op){case 'c':return e.v;case 'v':return env[e.n]?1:0;case 'not':return 1-evalE(e.k[0],env);case 'and':return e.k.every(x=>evalE(x,env))?1:0;case 'or':return e.k.some(x=>evalE(x,env))?1:0}}\nfunction sameFn(a,b,extraVars=[]){const V=[...new Set([...a.vars,...b.vars,...extraVars])].sort();for(let m=0;m<(1<<V.length);m++){const env={};V.forEach((v,j)=>env[v]=(m>>(V.length-1-j))&1);if(evalE(a.e,env)!==evalE(b.e,env))return {ok:false,env}}return {ok:true}}\n//={solveSOP,cubeMins,parseExpr,sameFn,evalE,sopHTML};\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\nconst esc=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;');\nconst store={get(k,d){try{const v=localStorage.getItem(PFX+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(PFX+k,JSON.stringify(v))}catch(e){}}};\nconst nbar=x=>`<span class=\"nb\">${x}<\/span>`;\nfunction setupTabs(QS){$('#tabs').innerHTML=QS.map((q,i)=>`<button role=\"tab\" data-tab=\"${i}\" aria-selected=\"false\"><b>${q.tab}<\/b><span>${q.sub}<\/span><\/button>`).join('');\n  $$('[data-tab]').forEach(b=>b.onclick=()=>showQ(+b.dataset.tab));\n  window.showQ=i=>{i=Math.min(Math.max(0,i|0),QS.length-1);const q=QS[i];$$('[data-tab]').forEach(b=>b.setAttribute('aria-selected',+b.dataset.tab===i));\n    QS.forEach(x=>{const el=$('#'+x.show);if(el)el.hidden=true});$('#'+q.show).hidden=false;\n    $('#qTitle').textContent=`${q.tab} \u00b7 ${q.title}`;$('#qLife').innerHTML=q.life;$('#qHow').innerHTML=q.how.map(x=>`<li>${x}<\/li>`).join('');$('#qThink').textContent=q.think;$('#qFig').innerHTML=q.fig||'';$('#qFigCap').textContent=q.cap||'';$('#qFigW').hidden=!q.fig;\n    $('#frame').innerHTML=q.frame.map(x=>`<li>${x}<\/li>`).join('');if(q.onShow)q.onShow();store.set('q',i)};\n  showQ(store.get('q',0))}\n// expression evaluator for A..Z single letters, + - * / \u00d7 \u00f7 ^ \u00b2 ( )\nfunction evalArith(expr,vars){let s=expr.replace(/\u00d7/g,'*').replace(/\u00f7/g,'/').replace(/[\u2212\u2013]/g,'-').replace(/\u00b2/g,'^2').replace(/\\s+/g,'');\n  if(!/^[A-Za-z0-9.+\\-*/^()]+$/.test(s))throw Error('use letters, numbers, + \u2212 \u00d7 \u00f7 ^ and brackets');\n  s=s.replace(/\\^/g,'**').replace(/([0-9)])([A-Za-z(])/g,'$1*$2').replace(/([A-Za-z])(?=[A-Za-z(])/g,'$1*');\n  const names=[...new Set(s.match(/[A-Za-z]+/g)||[])];for(const n of names)if(!(n in vars))throw Error(`no value for ${n}`);\n  return Function(...names,'return ('+s+')')(...names.map(n=>vars[n]))}\n// ---------- machine UI ----------\nconst KNAMES={0:'0-address (stack)',1:'1-address (accumulator)',2:'2-address',3:'3-address'};\nconst KHELP={0:'PUSH M \u00b7 POP M \u00b7 ADD \u00b7 SUB \u00b7 MUL \u00b7 DIV (they use the two values on top: SUB = second \u2212 top)',1:'LOAD M \u00b7 STORE M \u00b7 ADD M \u00b7 SUB M \u00b7 MUL M \u00b7 DIV M (AC \u2190 AC op M)',2:'MOV X, Y \u00b7 ADD X, Y (X \u2190 X + Y) \u00b7 SUB \u00b7 MUL \u00b7 DIV',3:'MOV X, Y \u00b7 ADD X, Y, Z (X \u2190 Y + Z) \u00b7 SUB \u00b7 MUL \u00b7 DIV'};\nfunction mountMachine(root,cfg){const id=root.id;let kind=cfg.kinds[0];const progs={...cfg.programs};let mem={...cfg.mem};let res=null,k=-1;\n  root.innerHTML=`<div class=\"row\"><span class=\"muted\">Machine<\/span><div class=\"chips\" role=\"group\" aria-label=\"Machine type\">${cfg.kinds.map(x=>`<button data-mk=\"${x}\" aria-pressed=\"${x===kind}\">${KNAMES[x]}<\/button>`).join('')}<\/div><\/div>\n  <p class=\"muted mhelp\" style=\"font-size:.92rem\"><\/p>\n  <div class=\"grid2\"><div style=\"display:flex;flex-direction:column;gap:8px;min-width:0\"><label class=\"muted\" for=\"${id}-src\">Program (one instruction per line, ; for comments)<\/label><textarea id=\"${id}-src\" rows=\"12\" class=\"mono-in\" style=\"width:100%;resize:vertical\"><\/textarea>\n   <div class=\"row\"><span class=\"muted\">Values:<\/span><span class=\"row mvals\"><\/span><\/div>\n   <div class=\"row\"><label class=\"muted\" for=\"${id}-ex\">Check ${cfg.target} =<\/label><input type=\"text\" id=\"${id}-ex\" class=\"mono-in\" style=\"width:min(100%,16em)\" value=\"${esc(cfg.expr)}\"><\/div>\n   <div class=\"row\"><button class=\"btn mrun\">Run all<\/button><button class=\"btn ghost mstep\">Step \u25b6<\/button><button class=\"btn ghost mreset\">Reset<\/button><button class=\"btn ghost sm mload\">Load the example<\/button><\/div><\/div>\n   <div style=\"display:flex;flex-direction:column;gap:8px;min-width:0\"><div class=\"mstate\"><\/div><div class=\"actbox mact\"><\/div><\/div><\/div>\n  <div class=\"scroll\"><table class=\"t mtrace\"><\/table><\/div>`;\n  const q=s=>root.querySelector(s);const src=q('textarea');\n  function vals(){q('.mvals').innerHTML=Object.entries(mem).filter(([n])=>cfg.inputs.includes(n)).map(([n,v])=>`<label class=\"row\" style=\"gap:4px\">${n}<input type=\"number\" data-mv=\"${n}\" value=\"${v}\" class=\"mono-in\" style=\"width:4.5em\"><\/label>`).join('');\n    root.querySelectorAll('[data-mv]').forEach(i=>i.oninput=()=>{mem[i.dataset.mv]=Number(i.value);reset()})}\n  function setKind(x){progs[kind]=src.value;kind=x;root.querySelectorAll('[data-mk]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.mk===x));q('.mhelp').textContent='Instructions: '+KHELP[x];src.value=progs[x]||'';reset()}\n  function reset(){res=null;k=-1;draw()}\n  function compute(){res=runProg(kind,src.value,mem)}\n  function draw(){const tr=res?res.trace.slice(0,k+1):[];const last=tr[tr.length-1];\n    q('.mstate').innerHTML=kind===0?`<b>Stack<\/b> (top first)<div class=\"stackv\">${last&&last.stack.length?[...last.stack].reverse().map((v,i)=>`<span class=\"${i===0?'top':''}\">${fmt(v)}<\/span>`).join(''):'<span class=\"muted\" style=\"border:0\">empty<\/span>'}<\/div>`:kind===1?`<b>Accumulator AC<\/b><div class=\"big\">${last?fmt(last.ac):'\u2014'}<\/div>`:`<b>Memory<\/b><div class=\"big\" style=\"font-size:1rem\">${last?Object.entries(last.mem).filter(([n])=>!cfg.inputs.includes(n)).map(([n,v])=>`${n} = ${fmt(v)}`).join(' \u00b7 ')||'\u2014':'\u2014'}<\/div>`;\n    q('.mtrace').innerHTML=tr.length?'<tr><th>#<\/th><th>Instruction<\/th><th>What happens<\/th><\/tr>'+tr.map((t,i)=>`<tr class=\"${i===tr.length-1?'top':''}\"><td>${i+1}<\/td><td style=\"text-align:left\">${esc(t.p.raw)}<\/td><td style=\"text-align:left;font-family:var(--body)\">${t.err?`<b style=\"color:var(--bad)\">Error: ${esc(t.err)}<\/b>`:esc(t.msg)}<\/td><\/tr>`).join(''):'';\n    let a='';if(!res)a='<b>Ready<\/b><ol><li>Write your program (or load the example), then press Step or Run all.<\/li><\/ol>';\n    else{const done=k>=res.trace.length-1;const X=res.mem[cfg.target];let want=null,werr='';try{want=evalArith(q('#'+id+'-ex').value,mem)}catch(e){werr=e.message}\n      a=`<b>${done?'Finished':'Running'}<\/b><ol><li>${tr.length} of ${res.count} instruction${res.count===1?'':'s'} done.<\/li>`;\n      if(res.err&&done)a+=`<li style=\"color:var(--bad)\">Stopped at line ${res.err.line}: ${esc(res.err.msg)}<\/li>`;\n      else if(done){a+=`<li>${cfg.target} = <b>${fmt(X)}<\/b>. ${werr?`(${esc(werr)})`:`The formula gives <b>${fmt(want)}<\/b>: ${X!==undefined&&Math.abs(X-want)<1e-9?'<b style=\"color:var(--ok)\">correct \u2713<\/b>':'<b style=\"color:var(--bad)\">not the same \u2717<\/b>'}`}<\/li><li>Instructions used: <b>${res.count}<\/b>.<\/li>`}\n      a+='<\/ol>'}\n    q('.mact').innerHTML=a}\n  root.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>setKind(+b.dataset.mk));\n  q('.mrun').onclick=()=>{compute();k=res.trace.length-1;draw()};q('.mstep').onclick=()=>{if(!res)compute();if(k<res.trace.length-1)k++;draw()};q('.mreset').onclick=reset;\n  q('.mload').onclick=()=>{src.value=cfg.programs[kind]||'';reset()};src.oninput=reset;q('#'+id+'-ex').oninput=draw;\n  vals();q('.mhelp').textContent='Instructions: '+KHELP[kind];src.value=progs[kind]||'';reset();\n  return {setKinds(){}};}\n\n// ---------- Q1 JK (stations) ----------\nlet j1={J:0,K:0,Q:0,stage:0,streak:0,touched:true,hist:[],found:{}};\nconst J1M=['Switch the lamp ON (Q = 1).','Switch it OFF again (Q = 0).','Make a tick that changes nothing.','Make the lamp change at 2 ticks in a row, without touching J or K between them.'];\nconst misHTML=(L,st)=>L.map((t,i)=>`<li class=\"${i<st?'done':i===st?'cur':'wait'}\"><span class=\"ck\">${i<st?'\u2713':i+1}<\/span><span>${t}<\/span><\/li>`).join('');\nconst effTxt=(J,K)=>J===0&&K===0?'no button asks anything: Q <b>holds<\/b> its value':J===0&&K===1?'K asks OFF: Q <b>resets<\/b> to 0':J===1&&K===0?'J asks ON: Q is <b>set<\/b> to 1':'both ask at the same time: Q <b>flips to the opposite<\/b>';\nfunction jkDraw(msg){const s=j1;$('#jB').textContent='J = '+s.J;$('#jB').setAttribute('aria-pressed',s.J===1);$('#kB').textContent='K = '+s.K;$('#kB').setAttribute('aria-pressed',s.K===1);$('#qLed').textContent=s.Q;$('#qLed').classList.toggle('on',s.Q===1);\n  $('#j1Mis').innerHTML=misHTML(J1M,s.stage);if(msg)$('#jkAct').innerHTML='<b>Actions<\/b>'+msg;\n  const H=s.hist;$('#j1W').style.gridTemplateColumns=`70px repeat(${Math.max(H.length,1)},28px)`;\n  $('#j1W').innerHTML=H.length?['tick','J','K','Q after'].map((n,r)=>`<div class=\"lbl\">${n}<\/div>`+H.map((h,i)=>r===0?`<div class=\"c h\">${h.n}<\/div>`:`<div class=\"c ${h[['','J','K','Q'][r]]?'h':'l'}\">${h[['','J','K','Q'][r]]}<\/div>`).join('')).join(''):'';\n  const rows=[];for(let k=0;k<8;k++){const J=k>>2&1,K=k>>1&1,q=k&1,f=s.found[''+J+K+q];rows.push(`<tr class=\"${f!==undefined?'top':''}\"><td>${J}<\/td><td>${K}<\/td><td>${q}<\/td><td><b>${f!==undefined?f:'?'}<\/b><\/td><\/tr>`)}\n  $('#j2T').innerHTML='<tr><th>J<\/th><th>K<\/th><th>Q(t) before<\/th><th>Q(t+1) after<\/th><\/tr>'+rows.join('');\n  const nf=Object.keys(s.found).length;$('#j2Fb').className='fb'+(nf===8?' ok':'');$('#j2Fb').textContent=nf===8?'All 8 rows found by experiment. Now look at the two rows with J = 1 and K = 1: compare Q(t+1) with Q(t). That is your answer to Q1.':`${nf} / 8 rows found. Missing rows show \u201c?\u201d: set J, K and the lamp, then tick.`}\n$('#jB').onclick=()=>{j1.J^=1;j1.touched=true;jkDraw(`<ol><li>J = ${j1.J}, K = ${j1.K}. The lamp does not move yet: no tick.<\/li><li>At the next tick: ${effTxt(j1.J,j1.K)}.<\/li><\/ol>`)};\n$('#kB').onclick=()=>{j1.K^=1;j1.touched=true;jkDraw(`<ol><li>J = ${j1.J}, K = ${j1.K}. The lamp does not move yet: no tick.<\/li><li>At the next tick: ${effTxt(j1.J,j1.K)}.<\/li><\/ol>`)};\n$('#clk').onclick=()=>{const s=j1,b=s.Q;s.Q=s.J&&s.K?1-s.Q:s.J?1:s.K?0:s.Q;s.found[''+s.J+s.K+b]=s.Q;\n  const changed=s.Q!==b;s.streak=changed?(s.touched?1:s.streak+1):0;s.touched=false;\n  s.hist.push({n:s.hist.length?s.hist[s.hist.length-1].n+1:1,J:s.J,K:s.K,Q:s.Q});if(s.hist.length>12)s.hist.shift();\n  const st0=s.stage;if(s.stage===0&&s.Q===1)s.stage=1;else if(s.stage===1&&s.Q===0)s.stage=2;else if(s.stage===2&&!changed)s.stage=3;else if(s.stage===3&&s.streak>=2)s.stage=4;\n  let m=`<ol><li>Tick \u2191 with J = ${s.J}, K = ${s.K}: ${effTxt(s.J,s.K)}.<\/li><li>Q was ${b}, now Q = <b>${s.Q}<\/b>${changed?'':' (no change)'}.<\/li>`;\n  if(s.stage>st0)m+=`<li><b>Mission ${st0+1} done \u2713<\/b>${s.stage===4?' All missions done: you found the toggle. Which J and K did you use for mission 4?':''}<\/li>`;\n  jkDraw(m+'<\/ol>')};\n$('#jkReset').onclick=()=>{j1={J:0,K:0,Q:0,stage:0,streak:0,touched:true,hist:[],found:{}};jkDraw('<ol><li>Lamp off, J = 0, K = 0.<\/li><li>Mission 1: which button asks ON? Set it, then tick.<\/li><\/ol>')};$('#jkReset').onclick();\nlet j3={n:0,ok:0,q:null};\nfunction j3New(){j3.q={J:Math.random()<.5?1:0,K:Math.random()<.5?1:0,Q:Math.random()<.5?1:0};j3Draw()}\nfunction j3Draw(res){const q=j3.q;$('#j3Q').innerHTML=`<div class=\"qrow\"><span class=\"pill ${q.J?'on':''}\">J = ${q.J}<\/span><span class=\"pill ${q.K?'on':''}\">K = ${q.K}<\/span><span class=\"pill ${q.Q?'on':''}\">Q now = ${q.Q}<\/span><span>\u2192 Q after the tick?<\/span><\/div><div class=\"row\">${res?`<button class=\"btn\" id=\"j3N\">${j3.n>=5?'New set of 5':'Next question'}<\/button>`:'<button class=\"btn\" data-p=\"0\">0<\/button><button class=\"btn\" data-p=\"1\">1<\/button>'}<\/div>`;\n  $$('[data-p]').forEach(b=>b.onclick=()=>{const a=q.J&&q.K?1-q.Q:q.J?1:q.K?0:q.Q;const g=+b.dataset.p;j3.n++;if(g===a)j3.ok++;\n    $('#j3Fb').className='fb '+(g===a?'ok':'no');$('#j3Fb').innerHTML=(g===a?'\u2713 Yes. ':'\u2717 Not this time. ')+`J = ${q.J}, K = ${q.K}: ${effTxt(q.J,q.K)}, so Q becomes ${a}. Score: ${j3.ok} / ${j3.n}.`;j3Draw(true)});\n  const nb=$('#j3N');if(nb)nb.onclick=()=>{if(j3.n>=5){j3.n=0;j3.ok=0}$('#j3Fb').textContent='';j3New()}}\nj3New();\n// ---------- Q2 (stations) ----------\nlet l1={n:1,stage:0};const L1M=['Make 8 lockers.','Make 32 lockers.','How many bits do you need for 64 lockers? Show it.'];\nfunction l1Draw(msg,grew){const n=l1.n,N=2**n;$('#l1N').textContent=`${n} bit${n>1?'s':''} \u2192 ${N} lockers`;\n  $('#l1G').innerHTML=[...Array(N).keys()].map(i=>`<div class=\"${grew&&i>=N/2?'new':''}\">${i.toString(2).padStart(n,'0')}<\/div>`).join('');\n  $('#l1Mis').innerHTML=misHTML(L1M,l1.stage);$('#l1M').disabled=n<=1;$('#l1P').disabled=n>=6;if(msg)$('#l1Act').innerHTML='<b>Actions<\/b>'+msg}\nfunction l1Chk(){const s0=l1.stage,N=2**l1.n;if(l1.stage===0&&N===8)l1.stage=1;else if(l1.stage===1&&N===32)l1.stage=2;else if(l1.stage===2&&N===64)l1.stage=3;\n  return l1.stage>s0?`<li><b>Mission ${s0+1} done \u2713<\/b>${l1.stage===3?' 64 = 2\u2076, so 6 bits. For the tutorial, write the size as a power of 2 the same way.':''}<\/li>`:''}\n$('#l1P').onclick=()=>{const o=2**l1.n;l1.n++;l1Draw(`<ol><li>You added 1 bit: now ${l1.n} bits.<\/li><li>The old numbers get a 0 in front, and the same numbers with a 1 in front are <b>new lockers<\/b> (highlighted).<\/li><li>${o} \u00d7 2 = <b>${2**l1.n}<\/b> lockers = 2<sup>${l1.n}<\/sup>.<\/li>${l1Chk()}<\/ol>`,true)};\n$('#l1M').onclick=()=>{l1.n--;l1Draw(`<ol><li>You removed 1 bit: the lockers are cut in half, ${2**(l1.n+1)} \u2192 <b>${2**l1.n}<\/b>.<\/li>${l1Chk()}<\/ol>`)};\nl1Draw('<ol><li>With 1 bit you can write only 0 and 1: 2 lockers.<\/li><li> ,'ii) K-map','ii) Groups','iii) NAND'].map((t,i)=>`<span class=\"${i<part(cur.k)?'done':i===part(cur.k)?'cur':''}\">${t}<\/span>`).join('');\n  // truth table\n  $('#fTT').innerHTML=`<tr><th>#<\/th>${V.map(v=>`<th>${v}<\/th>`).join('')}<th>F<\/th><\/tr>`+[...Array(L.N).keys()].map(m=>`<tr class=\"${X.hit.has(m)?'hit':''}\"><td class=\"muted\">${m}<\/td>${[...bitsOf(m,n)].map(b=>`<td>${b}<\/td>`).join('')}<td class=\"${X.F[m]===1?'ok':''}\"><b>${X.F[m]===null?'':X.F[m]}<\/b><\/td><\/tr>`).join('');\n  // k-map\n  if(!X.kOn){$('#fKM').innerHTML='<tr><td class=\"muted\" style=\"padding:12px\">The K-map comes after the truth table.<\/td><\/tr>'}\n  else{const rows=n===3?2:4,rh=n===3?['0','1']:GRAY2.map(x=>bitsOf(x,2)),ch=GRAY2.map(x=>bitsOf(x,2));const shown=L.sol.slice(0,X.groups);\n    let h=`<tr><th class=\"corner\">${n===3?'A \\\\ BC':'AB \\\\ CD'}<\/th>${ch.map(x=>`<th>${x}<\/th>`).join('')}<\/tr>`;\n    for(let r=0;r<rows;r++){h+=`<tr><th>${rh[r]}<\/th>`;for(let c=0;c<4;c++){const m=lbKcell(L,r,c);const gs=shown.map((cb,i)=>cubeMins(cb).includes(m)?i:-1).filter(i=>i>=0);const v=X.K[m];\n      h+=`<td><div class=\"kc v${v?1:0}\" style=\"display:grid;place-items:center;${X.khit.has(m)?'outline:3px solid var(--accent);outline-offset:1px;':''}${gs.length?`background:color-mix(in srgb,var(--g${gs[gs.length-1]+1}) 25%,var(--panel));border-color:var(--g${gs[gs.length-1]+1});border-width:3px`:''}\"><small>${m}<\/small>${v}<\/div><\/td>`}h+='<\/tr>'}\n    $('#fKM').innerHTML=h}\n  $('#fG').innerHTML=L.sol.slice(0,X.groups).map((c,i)=>`<div class=\"grp\" style=\"cursor:default\"><span class=\"sq\" style=\"background:var(--g${i+1})\"><\/span><span class=\"term\">${termHTML(c,V)}<\/span><\/div>`).join('');\n  $('#fR').innerHTML=['result','nand'].includes(cur.k)?'F = '+sopHTML(L.sol,V):'';\n  // narration\n  let m='',slot='';const lit=(v,val)=>val?v:nbar(v);\n  if(cur.k==='vars')m=`<b>Step 1 \u00b7 Count the letters<\/b><ol><li>F uses the letters ${[...new Set((L.terms||[]).flatMap(t=>Object.keys(t.fx)))].sort().join(', ')||V.join(', ')}. We use <b>${n} inputs: ${V.join(', ')}<\/b>.<\/li><li>${n} inputs \u2192 2<sup>${n}<\/sup> = <b>${L.N} rows<\/b>. Write them from ${'0'.repeat(n)} to ${'1'.repeat(n)}.<\/li><li>Trick: the last column alternates 0 1 0 1, the one before changes every 2 rows, then every 4${n===4?', then every 8':''}.<\/li><li>The F column is still empty. Next: read the terms one by one.<\/li><\/ol>`;\n  if(cur.k==='term'){const t=cur.t,miss=V.filter(v=>!(v in t.fx));\n    slot=`<div class=\"slotrow\">${V.map(v=>v in t.fx?`<div class=\"slot fix\"><div class=\"l\">${v}<\/div><div class=\"v\">${t.fx[v]}<\/div><div class=\"w\">${t.fx[v]?'plain \u2192 1':'bar \u2192 0'}<\/div><\/div>`:`<div class=\"slot free\"><div class=\"l\">${v}<\/div><div class=\"v\">0/1<\/div><div class=\"w\">missing \u2192 both<\/div><\/div>`).join('')}<\/div>`;\n    const again=cur.rows.filter(r=>L.S.slice(0,L.st).some(s=>s.k==='term'&&s.rows.includes(r)));\n    m=`<b>Term ${cur.i+1} of ${L.terms.length}: ${t.txt}<\/b><ol><li>Read each letter: plain = 1, with ' = 0.<\/li>${miss.length?`<li>${miss.join(', ')} ${miss.length>1?'are':'is'} missing, so ${miss.length>1?'they take':'it takes'} 0 and 1 \u2192 2<sup>${miss.length}<\/sup> = <b>${cur.rows.length} rows<\/b>.<\/li>`:'<li>No letter is missing \u2192 exactly <b>1 row<\/b>.<\/li>'}<li>Rows: ${cur.rows.map(r=>`${bitsOf(r,n)} = <b>${r}<\/b>`).join(', ')||'none (the term asks for a letter to be 0 and 1 at the same time)'}. Put F = 1 there.<\/li>${again.length?`<li>Row ${again.join(', ')} already had F = 1 from another term: it stays 1 (1 OR 1 = 1).<\/li>`:''}<\/ol>`}\n  if(cur.k==='rowcheck')m=`<b>Fill F row by row<\/b><ol><li>This function has brackets, so test each row: put the values of the row in F and calculate.<\/li><li>F = 1 on rows ${L.ones.join(', ')||'none'}.<\/li><\/ol>`;\n  if(cur.k==='zeros')m=`<b>Finish the truth table<\/b><ol><li>Every row not found by a term gets <b>F = 0<\/b>.<\/li><li>F = 1 on <b>${L.ones.length}<\/b> row${L.ones.length===1?'':'s'}: ${L.ones.join(', ')||'none'}.<\/li><li>Part i) is done. Next: the K-map.<\/li><\/ol>`;\n  if(cur.k==='kgrid')m=`<b>Draw the K-map<\/b><ol><li>${n===4?'Rows = AB, columns = CD':'Rows = A, columns = BC'}.<\/li><li>Order <b>00, 01, 11, 10<\/b> (not 10 then 11): between two neighbour cells only <b>one<\/b> bit changes. That is what lets us group them.<\/li><li>The small number in each cell is its row number in the truth table. Start with all 0.<\/li><\/ol>`;\n  if(cur.k==='place'){const b=bitsOf(cur.m,n);m=`<b>Put the 1s: row ${cur.m} (${cur.i+1} of ${L.ones.length})<\/b><ol><li>Row ${cur.m} = ${b}.<\/li><li>Cut it in two: ${n===4?`AB = <b>${b.slice(0,2)}<\/b> \u2192 K-map row, CD = <b>${b.slice(2)}<\/b> \u2192 column`:`A = <b>${b[0]}<\/b> \u2192 K-map row, BC = <b>${b.slice(1)}<\/b> \u2192 column`}.<\/li><li>Put a 1 in that cell (outlined).<\/li><\/ol>`}\n  if(cur.k==='placeall')m=`<b>Put the 1s<\/b><ol><li>Each row with F = 1 goes to the cell with the same small number: rows ${L.ones.join(', ')||'none'}.<\/li><\/ol>`;\n  if(cur.k==='group'){const c=cur.c,ms=cubeMins(c);\n    slot=`<div class=\"scroll\"><table class=\"t\" style=\"margin:0 auto\"><tr><th>row<\/th>${V.map(v=>`<th>${v}<\/th>`).join('')}<\/tr>${ms.map(r=>`<tr><td class=\"muted\">${r}<\/td>${[...bitsOf(r,n)].map(b=>`<td>${b}<\/td>`).join('')}<\/tr>`).join('')}<tr><th>result<\/th>${[...c].map((x,j)=>`<td class=\"${x==='-'?'bad':'ok'}\"><b>${x==='-'?'drop':x==='1'?V[j]:V[j]+\"'\"}<\/b><\/td>`).join('')}<\/tr><\/table><\/div>`;\n    m=`<b>Group ${cur.i+1} of ${L.sol.length}: ${ms.length} cell${ms.length>1?'s':''}<\/b><ol><li>Circle a group of 1s that touch (sizes 1, 2, 4, 8). Rows and columns wrap around the edges.<\/li><li>Group cells: ${ms.join(', ')}. Write their rows under each other (below).<\/li><li>${[...c].map((x,j)=>x==='-'?`${V[j]} changes \u2192 <b>drop<\/b>`:`${V[j]} is always ${x} \u2192 <b>${x==='1'?V[j]:V[j]+\"'\"}<\/b>`).join('; ')}.<\/li><li>This group = <b>${termHTML(c,V)}<\/b>.<\/li><\/ol>`}\n  if(cur.k==='result')m=L.sol.length?`<b>The short answer<\/b><ol><li>Join the groups with +.<\/li><li>F = <b>${sopHTML(L.sol,V)}<\/b>.<\/li><li>Check: every 1 of the K-map is inside at least one group, and no 0 is.<\/li><\/ol>`:`<b>F is always 0<\/b><ol><li>No row gives 1.<\/li><\/ol>`;\n  if(cur.k==='nand'){const lits=c=>[...c].map((x,j)=>x==='-'?null:x==='1'?V[j]:V[j]+\"'\").filter(Boolean);const inv=[...new Set(L.sol.flatMap(c=>[...c].map((x,j)=>x==='0'?V[j]:null).filter(Boolean)))];\n    const lines=[];let g=0;inv.forEach(v=>{g++;lines.push(`G${g} = NAND(${v}, ${v}) = ${v}'`)});\n    const tg=[];L.sol.forEach(c=>{const l=lits(c);g++;tg.push('G'+g);lines.push(`G${g} = NAND(${(l.length>1?l:[l[0],l[0]]).join(', ')})`)});\n    if(L.sol.length===1&&lits(L.sol[0]).length===1){lines.length=0;g=0;lines.push(`F = ${lits(L.sol[0])[0]}: no gate needed (or NAND twice on a barred letter).`)}\n    else{g++;lines.push(`F  = NAND(${tg.length>1?tg.join(', '):tg[0]+', '+tg[0]})`)}\n    m=`<b>iii) NAND gates only<\/b><ol><li>Make each barred letter with a NAND whose two inputs are the same wire.<\/li><li>Level 1: one NAND per term. Level 2: one NAND joins the terms${L.sol.length===1?' (here only one term, so it gets the same wire twice and works as a NOT)':''}.<\/li><\/ol><pre class=\"snip\" style=\"margin:6px 0\">${lines.join('\\n')}\\nTotal: ${g} NAND gate${g>1?'s':''}<\/pre>`}\n  $('#lbAct').innerHTML=m;$('#lbSlot').innerHTML=slot;\n  const hr=$('#fTT tr.hit'),box=$('#fTT').parentElement;if(hr&&box){box.scrollTop=Math.max(0,hr.offsetTop-60)}}\n$('#lbN').onclick=()=>{if(LB&&LB.st<LB.S.length-1){LB.st++;lbDraw()}};$('#lbP').onclick=()=>{if(LB&&LB.st>0){LB.st--;lbDraw()}};\n$('#fGo').onclick=lbStart;$('#fx').onkeydown=e=>{if(e.key==='Enter')lbStart()};lbStart();\n// ---------- Q4 guided ----------\nconst G4V=['A','B','C','D'],G4ONES=[5,7,13,15];let g1=Array(16).fill(0),g2=Array(16).fill(0),g3={A:null,B:null,C:null,D:null};\nconst G4T=[['ABD',{A:1,B:1,D:1}],[\"BC'D\",{B:1,C:0,D:1}],[\"A'BD\",{A:0,B:1,D:1}]];let g1T=null,g1Seen=new Set();\n$('#g1Act').innerHTML=`<b>How to find the rows, term by term<\/b><ol><li>F is 1 when <b>at least one term<\/b> is 1 (+ means OR).<\/li><li>A term is 1 only when <b>all its letters<\/b> are true: a plain letter must be <b>1<\/b>, a letter with ' (a bar) must be <b>0<\/b>.<\/li><li>F has 4 letters A B C D. If a letter is <b>missing<\/b> from the term, it can be 0 <b>or<\/b> 1: the term covers <b>2 rows<\/b>.<\/li><li>Pick each term below, then click the F cell of its rows to make them 1. All other rows stay 0.<\/li><\/ol>`;\n$('#g1Terms').innerHTML=G4T.map(([t],i)=>`<button data-g1t=\"${i}\" aria-pressed=\"false\">${t}<\/button>`).join('');\n$$('[data-g1t]').forEach(b=>b.onclick=()=>{g1T=+b.dataset.g1t;g1Seen.add(g1T);$$('[data-g1t]').forEach(x=>x.setAttribute('aria-pressed',x===b));g1Slot();g1Draw()});\nfunction g1Rows(i){const fx=G4T[i][1];return [...Array(16).keys()].filter(m=>G4V.every((v,j)=>!(v in fx)||((m>>(3-j))&1)===fx[v]))}\nfunction g1Slot(){if(g1T===null){$('#g1Slot').innerHTML='';return}const [t,fx]=G4T[g1T];const miss=G4V.filter(v=>!(v in fx));const R=g1Rows(g1T);\n  const slots=G4V.map(v=>v in fx?`<div class=\"slot fix\"><div class=\"l\">${v}<\/div><div class=\"v\">${fx[v]}<\/div><div class=\"w\">${fx[v]?'plain \u2192 1':'bar \u2192 0'}<\/div><\/div>`:`<div class=\"slot free\"><div class=\"l\">${v}<\/div><div class=\"v\">0/1<\/div><div class=\"w\">missing \u2192 both<\/div><\/div>`).join('');\n  const others=R.map(m=>[...Array(G4T.length).keys()].filter(k=>k!==g1T&&g1Rows(k).includes(m)&&g1Seen.has(k))).flat();\n  $('#g1Slot').innerHTML=`<p style=\"margin:0\"><b>Term ${t}<\/b>: read it letter by letter.<\/p><div class=\"slotrow\">${slots}<\/div><p style=\"margin:0;text-align:center\">${miss.join(', ')} is missing, so it takes 0 and 1 \u2192 <b>${R.length} rows<\/b>:<\/p><div class=\"rowsout\">${R.map(m=>`<div class=\"ro\">${m.toString(2).padStart(4,'0')}<small>row ${m}<\/small><\/div>`).join('')}<\/div><p class=\"muted\" style=\"margin:0;text-align:center\">They are outlined in the table: click their F cell to make it 1.${others.length?' Some of these rows are already covered by another term: that is fine, F is still 1 (1 OR 1 = 1).':''}<\/p>`}\nfunction g1Draw(bad){const hit=new Set(g1T===null?[]:g1Rows(g1T));$('#g1T').innerHTML='<tr><th>#<\/th><th>A<\/th><th>B<\/th><th>C<\/th><th>D<\/th><th>F<\/th><\/tr>'+[...Array(16).keys()].map(m=>`<tr class=\"${bad&&bad.has(m)?'rowbad':''} ${hit.has(m)?'hit':''}\"><td class=\"muted rnum\" data-rt=\"${m}\" role=\"button\" tabindex=\"0\" title=\"Test this row\">${m}<\/td>${[...m.toString(2).padStart(4,'0')].map(b=>`<td>${b}<\/td>`).join('')}<td class=\"fcell ${g1[m]?'ok':''}\" data-g1=\"${m}\" role=\"button\" tabindex=\"0\">${g1[m]}<\/td><\/tr>`).join('');\n  $$('[data-g1]').forEach(c=>{const t=()=>{g1[+c.dataset.g1]^=1;g1Draw()};c.onclick=t;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}}});\n  $$('[data-rt]').forEach(c=>{const t=()=>g1Test(+c.dataset.rt);c.onclick=t;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}}})}\nfunction g1Test(m){const val={};G4V.forEach((v,j)=>val[v]=(m>>(3-j))&1);const res=G4T.map(([t,fx])=>{const parts=Object.keys(fx).map(v=>`${v}${fx[v]?'':\"'\"}=${fx[v]?val[v]:1-val[v]}`);const r=Object.keys(fx).every(v=>val[v]===fx[v])?1:0;return `<li><b>${t}<\/b>: ${parts.join(' \u00b7 ')} \u2192 <b>${r}<\/b><\/li>`});\n  const F=G4T.some(([t,fx])=>Object.keys(fx).every(v=>val[v]===fx[v]))?1:0;\n  $('#g1Fb').className='fb';$('#g1Fb').innerHTML=`<span style=\"font-weight:400\">Row ${m}: A=${val.A} B=${val.B} C=${val.C} D=${val.D}. A letter with ' takes the opposite value.<\/span><ol style=\"margin:4px 0;font-weight:400\">${res.join('')}<\/ol>F = ${G4T.map(([t,fx])=>Object.keys(fx).every(v=>val[v]===fx[v])?1:0).join(' + ')} = <b>${F}<\/b>`}\n$('#g1C').onclick=()=>{const bad=new Set([...Array(16).keys()].filter(m=>g1[m]!==(G4ONES.includes(m)?1:0)));g1Draw(bad);\n  $('#g1Fb').className='fb '+(bad.size?'no':'ok');$('#g1Fb').textContent=bad.size?`${bad.size} row(s) wrong (in red). Click a row number to test that row term by term.`:'\u2713 Correct: 3 terms \u00d7 2 rows = 6, but rows 5 and 13 are counted twice, so F = 1 on 4 different rows. Go to step 2.'};g1Draw();\n$('#g2Act').innerHTML='<b>How<\/b><ol><li>Rows of the K-map = AB, columns = CD, in the order 00, 01, 11, 10 (only one bit changes each time).<\/li><li>The small number in each cell is its row number from the truth table.<\/li><li>Click the cells whose number has F = 1.<\/li><\/ol>';\nconst G2O=[0,1,3,2];\nfunction g2Draw(bad){let h='<tr><th class=\"corner\">AB \\\\ CD<\/th>'+G2O.map(x=>`<th>${x.toString(2).padStart(2,'0')}<\/th>`).join('')+'<\/tr>';\n  for(const r of G2O){h+=`<tr><th>${r.toString(2).padStart(2,'0')}<\/th>`;for(const c of G2O){const m=r*4+c;h+=`<td><button class=\"kcell v${g2[m]} ${bad&&bad.has(m)?'bad':''}\" data-g2=\"${m}\" aria-label=\"cell ${m}\"><small>${m}<\/small>${g2[m]}<\/button><\/td>`}h+='<\/tr>'}\n  $('#g2K').innerHTML=h;$$('[data-g2]').forEach(c=>c.onclick=()=>{g2[+c.dataset.g2]^=1;g2Draw()})}\n$('#g2C').onclick=()=>{const bad=new Set([...Array(16).keys()].filter(m=>g2[m]!==(G4ONES.includes(m)?1:0)));g2Draw(bad);\n  $('#g2Fb').className='fb '+(bad.size?'no':'ok');$('#g2Fb').textContent=bad.size?`${bad.size} cell(s) wrong (red border).`:'\u2713 Correct. The four 1s touch each other: they make one group of 4. Go to step 3.'};g2Draw();\n$('#g3Act').innerHTML='<b>How<\/b><ol><li>Write the rows of your group one under the other (below).<\/li><li>For each letter: if its column has 0 <b>and<\/b> 1, the letter changes \u2192 <b>drop<\/b> it. If it never changes \u2192 <b>keep<\/b> it.<\/li><li>Click each letter until it says keep or drop.<\/li><\/ol>';\nfunction g3Draw(){$('#g3T').innerHTML='<tr><th>row<\/th>'+G4V.map(v=>`<th>${v}<\/th>`).join('')+'<\/tr>'+G4ONES.map(m=>`<t \n ['Its output can change at any time while the enable / clock is 1.','l','That is the open door: a latch is level-triggered.'],\n ['Its output can change only at the clock edge (0 \u2192 1).','f','That is the camera click: a flip-flop is edge-triggered.'],\n ['It is level-triggered.','l','It reacts to the level (1) of the enable, not to the moment it changes.'],\n ['It is edge-triggered.','f','It reacts only at the moment the clock rises (or falls).'],\n ['It is simpler and needs fewer gates.','l','A flip-flop is often built from two latches, so the latch is the smaller one.'],\n ['It is the safe choice for CPU registers and counters that follow one clock.','f','Everything changes at the same tick, so signals cannot race through.'],\n ['It has an input that controls when it may change (enable or clock).','b','Both have one: the latch has an enable (level), the flip-flop a clock (edge).']];\nconst S3N={l:'Latch',f:'Flip-flop',b:'Both'};let s3=S3.map(()=>null);\nfunction s3Draw(){$('#s3').innerHTML=S3.map(([t,a,w],i)=>{const g=s3[i];const st=g==null?'':g===a?'ok':'bad';\n  return `<div class=\"srt ${st}\"><div>${t}<\/div><div class=\"opts3\">${['l','f','b'].map(k=>`<button data-s3=\"${i}\" data-k=\"${k}\" class=\"${g===k?'pick':''}\">${S3N[k]}<\/button>`).join('')}<\/div>${g!=null?`<p class=\"why\">${g===a?'\u2713 ':'\u2717 Not quite. '}${g===a?w:'Think again: door (latch) or camera (flip-flop)?'}<\/p>`:''}<\/div>`}).join('');\n  $$('[data-s3]').forEach(b=>b.onclick=()=>{s3[+b.dataset.s3]=b.dataset.k;s3Draw()});\n  const ok=s3.filter((g,i)=>g===S3[i][1]).length;$('#s3Fb').className='fb'+(ok===S3.length?' ok':'');$('#s3Fb').textContent=ok===S3.length?'All 8 correct. Copy the Latch and Flip-flop sentences into a two-column table on your paper.':`${ok} / ${S3.length} correct.`}\ns3Draw();\n// station 4\nconst A4={reg:'Register',cnt:'Counter',shf:'Shift register'};let a4='reg',reg={d:[1,0,1,1],q:[0,0,0,0]},cnt={n:0,h:[]},shf={in:1,q:[0,0,0,0]};\nconst bits=a=>a.join('')  CLK = 1 (shaded),<\/text><text x=\\\"102\\\" y=\\\"257\\\" class=\\\"sm\\\" text-anchor=\\\"middle\\\">every change of D gets in<\/text><rect x=\\\"205\\\" y=\\\"206\\\" width=\\\"185\\\" height=\\\"62\\\" rx=\\\"10\\\" class=\\\"acs\\\"/><text x=\\\"297\\\" y=\\\"226\\\" class=\\\"b\\\" text-anchor=\\\"middle\\\">Flip-flop = camera<\/text><text x=\\\"297\\\" y=\\\"242\\\" class=\\\"sm\\\" text-anchor=\\\"middle\\\">copies D only at the click<\/text><text x=\\\"297\\\" y=\\\"257\\\" class=\\\"sm\\\" text-anchor=\\\"middle\\\">(the \u2191 edge, dashed lines)<\/text><\/svg>\"};\nsetupTabs([\n {tab:'Q1',fig:FIGS.t5q1,cap:\"J and K are requests; the clock tick is the only moment the flip-flop obeys them.\",sub:'JK toggle',title:'The toggle of the JK flip-flop',show:'d1',life:\"A desk lamp with two buttons: ON (J) and OFF (K). The lamp does not react the moment you touch a button: it only looks at the buttons at each <b>tick<\/b> of the clock, then keeps its state until the next tick. A push-button lamp that flips at every press is a <b>toggle<\/b>.\",how:['J = set request, K = reset request, the clock pulse = the moment the flip-flop looks.','Try the 4 combinations of J and K and press the clock each time.','Write J, K, Q(t) and Q(t+1) in a table.'],think:'Do the 3 stations: the 4 missions, then all 8 rows of the table by experiment, then 5 predictions. Which rows of the table prove the toggle?',frame:['Explain J, K and the clock in one or two sentences.','Truth table with J, K, Q(t), Q(t+1).','Point to the lines that show the toggle and explain them.','Optional: the characteristic equation.']},\n {tab:'Q2',fig:FIGS.t5q2,cap:\"Count the lockers for 1, 2 and 3 bits. Which power of 2 gives the size in the tutorial?\",sub:'Address bits',title:'How many bits to number every memory location?',show:'d2',life:\"Lockers in a corridor, each numbered in binary. With 1 digit you can number 2 lockers, with 2 digits 4, with 3 digits 8: every extra digit doubles the lockers. Memory locations are the lockers, the digits are the <b>address bits<\/b>.\",how:['Convert the size: 1K = 1024 = 2\u00b9\u2070.','n bits give 2\u207f different addresses.','Find n so that 2\u207f equals the number of locations.'],think:'Do the 3 locker missions, read the steps in station 2, then practise in station 3. Then do 4K on paper with the same steps.',frame:['Write the size as a number of locations.','Write it as a power of 2.','Conclude: n address bits, with the first and last address.']},\n {tab:'Q3',fig:FIGS.t5q3,cap:\"NAND = NOT AND. Join its two inputs and it becomes a NOT.\",sub:'Universal gates',title:'One gate to build them all',show:'d3',life:'With only one kind of LEGO brick you can still build a house, a car and a boat. Some gates are like that brick.',how:['Pick NAND or NOR.','Build NOT first: connect both inputs together.','Use NOT + the gate itself to build AND and OR (De Morgan).'],think:'Find what switches NAND off, then build NOT, AND and OR yourself with NAND only. Which other gate can do the same job?',frame:['Name the universal gates.','Explain what \u201cuniversal\u201d means.','Show NOT, AND, OR built from one of them (expression or drawing).','One reason it is useful in chip making.']},\n {tab:'Q4',fig:FIGS.t5q4,cap:\"This example group is not the tutorial one: do the same with your own rows.\",sub:'Table, K-map, NAND',title:'From a function to a NAND circuit',show:'d4',life:\"A shop sign lights up for a few combinations of switches. The long rule written by the owner can be made much shorter. The shortcut: in a group of rows where F = 1, <b>a letter that changes does not matter<\/b>, so it disappears.\",how:['Truth table: one line per input combination, F = 1 when one term is true.','K-map: copy the 1s, circle the biggest groups, read each group.','NAND: each product term becomes one NAND, then a last NAND joins them.'],think:'Do the 4 steps on the practice function. Then do the tutorial function on paper the same way, and check it in the lab at the end.',frame:['i) Truth table with all input combinations.','ii) K-map with the groups circled and the simplified F.','iii) NAND-only circuit and the number of gates.']},\n {tab:'Q5',fig:FIGS.t5q5,cap:\"Same clock, same input D, two different outputs.\",sub:'Latch vs flip-flop',title:'Latch, flip-flop and where they live',show:'d5',life:\"A <b>latch<\/b> is an open door: while the clock says \u201copen\u201d, everything that comes in passes through. A <b>flip-flop<\/b> is a camera: it takes one photo of the input at the click (the clock edge) and keeps it until the next click.\",how:['Define a flip-flop: stores 1 bit, changes only on the clock edge.','Compare with a latch: changes whenever enable is active (level).','List where flip-flops are used.'],think:'Do the 4 stations in order: (1) store a bit, (2) race the latch against the flip-flop, (3) build the difference table, (4) try the applications. Then write your answer with the frame below.',frame:['Definition of a flip-flop.','Latch vs flip-flop table (trigger, clock, when the output changes).','List of applications with one example each.']}]);\n\n<\/script>\n<\/body><\/html>"}, {"fname": "4.Flip-Flops in Your Computer_2.html", "title": "4. Flip-Flops in Your Computer", "desc": "Tutorial 5 in practice \u00b7 RAM bits, Caps Lock, CPU cache & NAND gate count", "html": "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Flip-Flops in Your Computer<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#EEF2EC; --panel:#FFFFFF; --ink:#1D2B2A; --muted:#566664; --line:#C9D3CC; --soft:#E2E9E3;\n  --blue:#2F6FDB; --green:#2E8B57; --red:#C0392B; --amber:#B87410; --purple:#7B5EA7; --term:#14161C; --termtx:#D7F5DE;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#131A19; --panel:#1C2524; --ink:#E5EDE9; --muted:#9DAEA9; --line:#334240; --soft:#243130;\n    --blue:#6C9BF0; --green:#4FB57D; --red:#E86A5C; --amber:#E2A23C; --purple:#A98BD6; --term:#0B0C10;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#131A19; --panel:#1C2524; --ink:#E5EDE9; --muted:#9DAEA9; --line:#334240; --soft:#243130;\n  --blue:#6C9BF0; --green:#4FB57D; --red:#E86A5C; --amber:#E2A23C; --purple:#A98BD6; --term:#0B0C10;\n}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 \"Atkinson Hyperlegible\",system-ui,-apple-system,\"Segoe UI\",sans-serif}\nh1,h2,h3{font-family:\"Bricolage Grotesque\",\"Segoe UI\",system-ui,sans-serif;line-height:1.12;margin:0}\n.n,code,kbd{font-family:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace}\n.wrap{max-width:1120px;margin:0 auto;padding:28px 16px 60px}\nheader{margin-bottom:16px}\nh1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;letter-spacing:-.02em}\nheader p{margin:6px 0 0;color:var(--muted);max-width:62ch}\nnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;padding:10px 0;margin-bottom:14px;border-bottom:2px solid var(--line)}\nnav button{font:inherit;text-align:left;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);border-radius:10px;color:var(--ink);padding:7px 10px;cursor:pointer;line-height:1.2}\nnav button:hover{border-color:var(--ink)}\nnav button b{font-size:.98rem} nav button span{font-size:.8rem;color:var(--muted)}\nnav button[aria-selected=\"true\"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}\nnav button[aria-selected=\"true\"] span{color:var(--panel)}\nbutton:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}\n.pager{display:flex;justify-content:space-between;gap:10px;margin:0 0 14px}\n.st[hidden]{display:none!important}\n.st{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:22px}\n@media (max-width:860px){.st{grid-template-columns:1fr}}\n.left h2{font-size:1.6rem;font-weight:800;margin-bottom:8px}\n.where{color:var(--muted);margin:0 0 12px}\n.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);margin:0 6px 10px 0}\n.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}\n.box h3{font-size:1rem;margin-bottom:6px}\n.os{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}\n.os button{font:inherit;font-size:.85rem;font-weight:700;padding:3px 10px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}\n.os button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}\n.box ol{margin:0;padding-left:20px} .box li{margin:4px 0}\nkbd{font-size:.85rem;background:var(--soft);border:1px solid var(--line);border-bottom-width:3px;border-radius:5px;padding:0 6px}\ncode{font-size:.9rem;background:var(--soft);padding:1px 5px;border-radius:4px}\n.term{background:var(--term);color:var(--termtx);border-radius:10px;padding:10px 12px;font:500 .9rem \"JetBrains Mono\",monospace;white-space:pre-wrap;overflow-x:auto;position:relative;margin-top:8px}\n.term .c{color:#8C93A6}\n.copy{position:absolute;top:6px;right:6px;font:700 .75rem \"Atkinson Hyperlegible\",sans-serif;padding:2px 8px;border-radius:6px;border:1px solid #444;background:#2A2D36;color:#fff;cursor:pointer}\n.think{background:var(--panel);border-left:4px solid var(--ink);padding:10px 14px;border-radius:0 8px 8px 0}\n.try{background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:16px;min-width:0}\n.try h3{font-size:1.05rem;margin-bottom:10px}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}\ninput[type=text],input[type=number],select{font:inherit;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}\n.btn{font:inherit;font-weight:700;font-size:.92rem;padding:7px 12px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer}\n.btn.ghost{background:transparent;color:var(--ink)}\n.btn:disabled{opacity:.5;cursor:wait}\ntable.t{border-collapse:collapse;font-size:.95rem;width:100%}\ntable.t td,table.t th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}\ntable.t th{font-size:.78rem;color:var(--muted)}\n.big{font:700 1.35rem \"JetBrains Mono\",monospace;word-break:break-all}\n.bits{font:700 1.05rem \"JetBrains Mono\",monospace;word-break:break-all}\n.bits .pg{color:var(--blue)} .bits .off{color:var(--amber)}\n.bars{display:grid;gap:6px;margin-top:8px}\n.bar{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;font-size:.9rem}\n.trk{height:18px;background:var(--soft);border-radius:9px;overflow:hidden}\n.trk i{display:block;height:100%;border-radius:9px;transition:width .6s}\n.note{font-size:.88rem;color:var(--muted)}\n.chart{display:flex;align-items:flex-end;gap:4px;height:160px;border-bottom:2px solid var(--ink);border-left:2px solid var(--ink);padding:0 4px;margin:8px 0 4px}\n.chart div{flex:1;border-radius:4px 4px 0 0;min-height:2px;position:relative}\n.chart div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--muted)}\nfooter{margin-top:40px;color:var(--muted);font-size:.9rem}\n.bitrow{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}\n.bitrow span{width:34px;height:40px;display:inline-flex;align-items:center;justify-content:center;font:700 1.1rem \"JetBrains Mono\",monospace;border:2px solid var(--line);border-radius:6px;background:var(--soft)}\n.bitrow span.one{background:var(--blue);border-color:var(--blue);color:#fff}\ntable.t{border-collapse:collapse;margin:6px 0}table.t th,table.t td{border:1px solid var(--line);padding:4px 10px;text-align:center;font-family:\"JetBrains Mono\",monospace}\n.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin:8px 0}\n.cells div{border:2px solid var(--line);border-radius:8px;padding:4px 8px;font-family:\"JetBrains Mono\",monospace;background:var(--soft)}\n.cells div small{display:block;font-size:.7rem;opacity:.75}\n.cells div.hl{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 25%,transparent)}\n.cells div.hl2{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 18%,transparent)}\n.stackv{display:flex;flex-direction:column;gap:4px;margin:8px 0}\n.stackv span{border:2px solid var(--line);border-radius:8px;padding:4px 12px;font:700 1.05rem \"JetBrains Mono\",monospace;background:var(--soft)}\n.stackv span:first-child{border-color:var(--amber)}\n.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:320px}\n.keys button{padding:10px 0;font:700 1.05rem \"JetBrains Mono\",monospace;border:2px solid var(--line);border-radius:8px;background:var(--soft);color:inherit;cursor:pointer}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header><h1>Flip-Flops in Your Computer<\/h1><p>CCA102 / CST131, Tutorial 5 in practice. Address bits, toggles, flip-flops and NAND gates are inside your laptop and phone. In each station, try it on your computer, then use the tool on the right.<\/p><\/header>\n<nav role=\"tablist\" aria-label=\"Stations\" id=\"nav\"><\/nav>\n<div class=\"pager\" id=\"pager\"><\/div>\n<section class=\"st\" data-t=\"1 \u00b7 Your RAM\" data-s=\"How many address bits?\"><div class=\"left\"><h2>How many address bits does your RAM need?<\/h2><p class=\"where\">Every byte of your memory has an address. The bigger the memory, the more bits the address needs: n bits give 2\u207f addresses.<\/p><span class=\"tag\">Q2 \u00b7 address bits<\/span><div class=\"box\"><h3>Do it on your computer<\/h3><div class=\"os\" data-os=\"ram\"><button class=\"on\" data-v=\"w\">Windows<\/button><button data-v=\"a\">Android<\/button><\/div><div data-for=\"ram\" data-v=\"w\"><ol><li><kbd>Ctrl<\/kbd> <kbd>Shift<\/kbd> <kbd>Esc<\/kbd> \u2192 <b>Performance<\/b> \u2192 <b>Memory<\/b>: read the total (e.g. 16.0 GB).<\/li><li>Type it in the tool.<\/li><\/ol><\/div><div data-for=\"ram\" data-v=\"a\" hidden><ol><li><b>Settings \u2192 About phone<\/b> (or Device care): read the RAM, e.g. 8 GB.<\/li><\/ol><\/div><\/div><p class=\"think\"><strong>Think:<\/strong> your RAM is not always an exact power of 2 (e.g. 12 GB). How many bits do you need then?<\/p><\/div><div class=\"try\"><h3>Address bits for your memory<\/h3><div class=\"row\"><label>RAM <input type=\"number\" id=\"rG\" value=\"16\" min=\"1\" style=\"width:5em\"><\/label><select id=\"rU\"><option value=\"30\">GB<\/option><option value=\"20\">MB<\/option><option value=\"10\">KB<\/option><\/select><\/div><div id=\"rOut\"><\/div><\/div><\/section><section class=\"st\" hidden data-t=\"2 \u00b7 Caps Lock\" data-s=\"A toggle you use every day\"><div class=\"left\"><h2>Caps Lock is a toggle flip-flop<\/h2><p class=\"where\">Press Caps Lock: on. Press again: off. The key remembers its state between presses, exactly like a JK flip-flop with J = K = 1 (or a T flip-flop).<\/p><span class=\"tag\">Q1 \u00b7 toggle<\/span><span class=\"tag\">Q5 \u00b7 flip-flop<\/span><div class=\"box\"><h3>Do it on your computer<\/h3><ol><li>Look at the Caps Lock light on your keyboard (or the on-screen indicator).<\/li><li>Press Caps Lock several times. Each press flips the light.<\/li><li>Click in the box on the right and press Caps Lock: the page reads its real state.<\/li><\/ol><\/div><p class=\"think\"><strong>Think:<\/strong> between two presses, who remembers that Caps Lock is on? Draw the truth table of a toggle with Q(t) and Q(t+1).<\/p><\/div><div class=\"try\"><h3>Read your real Caps Lock<\/h3><input type=\"text\" id=\"capsIn\" placeholder=\"click here, then press Caps Lock\" style=\"width:100%\"><p class=\"big\" id=\"capsOut\">press a key\u2026<\/p><h3 style=\"margin-top:12px\">4 toggles in a row = a counter<\/h3><div class=\"bitrow\" id=\"cnt\"><\/div><div class=\"row\"><button class=\"btn\" id=\"cClk\">Clock pulse<\/button><button class=\"btn ghost\" id=\"cRst\">Reset<\/button><\/div><p class=\"note\" id=\"cOut\"><\/p><\/div><\/section><section class=\"st\" hidden data-t=\"3 \u00b7 Your cache\" data-s=\"Millions of flip-flops\"><div class=\"left\"><h2>Your CPU cache is made of flip-flop-like cells<\/h2><p class=\"where\">The fastest memory in your computer (L1, L2, L3 cache) is SRAM: each bit is stored by a small circuit that works like a flip-flop. Registers too.<\/p><span class=\"tag\">Q5 \u00b7 applications<\/span><div class=\"box\"><h3>Do it on your computer<\/h3><div class=\"os\" data-os=\"ca\"><button class=\"on\" data-v=\"w\">Windows<\/button><button data-v=\"l\">Linux<\/button><\/div><div data-for=\"ca\" data-v=\"w\"><ol><li>Task Manager \u2192 <b>Performance<\/b> \u2192 <b>CPU<\/b>: read <b>L1 cache<\/b>, <b>L2 cache<\/b>, <b>L3 cache<\/b>.<\/li><\/ol><\/div><div data-for=\"ca\" data-v=\"l\" hidden><div class=\"term\"><button class=\"copy\">Copy<\/button>lscpu | grep -i cache<\/div><\/div><\/div><p class=\"think\"><strong>Think:<\/strong> why is cache made of flip-flops while your 16 GB of RAM is not?<\/p><\/div><div class=\"try\"><h3>How many bit cells?<\/h3><div class=\"row\"><label>L1 <input type=\"number\" id=\"c1\" value=\"320\" style=\"width:6em\"> KB<\/label><label>L2 <input type=\"number\" id=\"c2\" value=\"5\" style=\"width:5em\"> MB<\/label><label>L3 <input type=\"number\" id=\"c3\" value=\"12\" style=\"width:5em\"> MB<\/label><\/div><div id=\"caOut\"><\/div><\/div><\/section><section class=\"st\" hidden data-t=\"4 \u00b7 Build it\" data-s=\"NAND only, in a simulator\"><div class=\"left\"><h2>Build a NAND-only circuit<\/h2><p class=\"where\">A free simulator lets you draw gates, click inputs and watch the output, like in the lab. Build your tutorial circuit with NAND gates only and test every line of its truth table.<\/p><span class=\"tag\">Q3 \u00b7 universal gates<\/span><span class=\"tag\">Q4 \u00b7 NAND realisation<\/span><div class=\"box\"><h3>Do it on your computer<\/h3><ol><li>Open <a href=\"https://circuitverse.org/simulator\" target=\"_blank\" rel=\"noopener\">circuitverse.org/simulator<\/a>.<\/li><li>Gates \u2192 <b>NAND<\/b>. Inputs \u2192 <b>Input<\/b> (A, B\u2026). Output \u2192 <b>Output<\/b>.<\/li><li>Build NOT, AND and OR from NAND, then your simplified F. Click the inputs to test.<\/li><\/ol><\/div><p class=\"think\"><strong>Think:<\/strong> how many NAND gates does your simplified function need, compared to the original one?<\/p><\/div><div class=\"try\"><h3>Count the NAND gates<\/h3><p class=\"note\" style=\"margin-top:0\">Type a sum of products (NOT as ').<\/p><div class=\"row\"><input type=\"text\" id=\"nE\" value=\"AB'D + ABD + A'BCD\" style=\"width:16em\"><button class=\"btn\" id=\"nGo\">Simplify and count<\/button><\/div><div id=\"nOut\"><\/div><\/div><\/section><footer>Practical companion for Tutorial 5. The examples here are not the tutorial answers.<\/footer>\n<\/div>\n<script>\nconst $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];\nconst ST=$$('.st');\n$('#nav').innerHTML=ST.map((s,i)=>`<button role=\"tab\" aria-selected=\"${i===0}\" data-i=\"${i}\"><b>${s.dataset.t}<\/b><span>${s.dataset.s}<\/span><\/button>`).join('');\nfunction show(i,scroll){ ST.forEach((s,k)=>s.hidden=k!==i); $$('[data-i]').forEach(b=>b.setAttribute('aria-selected',+b.dataset.i===i));\n  $('#pager').innerHTML=(i>0?`<button class=\"btn ghost\" id=\"pv\">Previous: ${ST[i-1].dataset.t}<\/button>`:'<span><\/span>')+(i<ST.length-1?`<button class=\"btn\" id=\"nx\">Next: ${ST[i+1].dataset.t}<\/button>`:'');\n  if(i>0) $('#pv').onclick=()=>show(i-1,true); if(i<ST.length-1) $('#nx').onclick=()=>show(i+1,true);\n  if(scroll){const top=$('#pager').getBoundingClientRect().top+scrollY-$('nav').offsetHeight-10; if(scrollY>top) scrollTo({top});} }\n$$('[data-i]').forEach(b=>b.onclick=()=>show(+b.dataset.i,true)); show(0,false);\n$$('[data-os]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); $$(`[data-for=\"${g.dataset.os}\"]`).forEach(o=>o.hidden=o.dataset.v!==b.dataset.v); }));\n$$('.copy').forEach(b=>b.onclick=()=>{ const t=b.parentElement.innerText.replace(/^Copy\\n?/,'').split('\\n').filter(l=>!l.trim().startsWith('#')).join('\\n').trim(); navigator.clipboard?.writeText(t).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200);}).catch(()=>{}); });\n\n// ---------- logic core ----------\nconst GRAY2=[0,1,3,2];\nfunction cubesOf(n){const out=[];const rec=(p)=>{if(p.length===n){out.push(p);return}for(const c of '01-')rec(p+c)};rec('');return out}\nfunction cubeMins(c){let m=[0];for(const ch of c){m=m.flatMap(x=>ch==='-'?[x*2,x*2+1]:[x*2+(+ch)])}return m}\nfunction contains(big,small){for(let i=0;i<big.length;i++)if(big[i]!=='-'&&big[i]!==small[i])return false;return true}\nfunction solveSOP(n,ones){const S=new Set(ones);if(!ones.length)return [];\n  const imps=cubesOf(n).filter(c=>cubeMins(c).every(m=>S.has(m)));\n  const primes=imps.filter(c=>!imps.some(d=>d!==c&&contains(d,c)));\n  const lits=c=>[...c].filter(x=>x!=='-').length;\n  // essential first, then brute force the rest\n  const ess=[];for(const m of ones){const cov=primes.filter(p=>cubeMins(p).includes(m));if(cov.length===1&&!ess.includes(cov[0]))ess.push(cov[0])}\n  const covered=new Set(ess.flatMap(cubeMins));const left=ones.filter(m=>!covered.has(m));\n  const rest=primes.filter(p=>!ess.includes(p));let best=null;\n  if(!left.length)best=[];else{for(let mask=1;mask<(1<<rest.length);mask++){const pick=rest.filter((_,i)=>mask>>i&1);const cv=new Set(pick.flatMap(cubeMins));if(!left.every(m=>cv.has(m)))continue;\n    const cost=[pick.length,pick.reduce((a,c)=>a+lits(c),0)];if(!best||cost[0]<best.cost[0]||(cost[0]===best.cost[0]&&cost[1]<best.cost[1]))best={pick,cost}}best=best.pick}\n  return [...ess,...best].sort((a,b)=>lits(a)-lits(b)||(a<b?-1:1))}\nfunction termHTML(c,V){if(!c.includes('0')&&!c.includes('1'))return '1';return [...c].map((ch,i)=>ch==='-'?'':ch==='1'?V[i]:`<span class=\"nb\">${V[i]}<\/span>`).join('')}\nfunction sopHTML(cubes,V){return cubes.length?cubes.map(c=>termHTML(c,V)).join(' + '):'0'}\n// ---------- expression parser: + OR, juxtaposition or * or . AND, ' or ~ or ! NOT ----------\nfunction parseExpr(src){let s=src.replace(/\\s+/g,'').replace(/[\u00b7\u2022\u00d7]/g,'*').replace(/[\u2019`]/g,\"'\"),i=0;\n  const peek=()=>s[i];const vars=new Set();\n  function expr(){let t=[term()];while(peek()==='+'){i++;t.push(term())}return t.length===1?t[0]:{op:'or',k:t}}\n  function term(){let f=[factor()];while(i<s.length&&(peek()==='*'||peek()==='.'||/[A-Za-z(~!01]/.test(peek()))){if(peek()==='*'||peek()==='.')i++;f.push(factor())}return f.length===1?f[0]:{op:'and',k:f}}\n  function factor(){let neg=0;while(peek()==='~'||peek()==='!'){neg++;i++}let a=atom();while(peek()===\"'\"){a={op:'not',k:[a]};i++}while(neg--)a={op:'not',k:[a]};return a}\n  function atom(){const c=peek();if(c==='('){i++;const e=expr();if(peek()!==')')throw Error('missing )');i++;return e}\n    if(c==='0'||c==='1'){i++;return {op:'c',v:+c}}if(c&&/[A-Za-z]/.test(c)){i++;vars.add(c.toUpperCase());return {op:'v',n:c.toUpperCase()}}throw Error(c?`unexpected \u201c${c}\u201d`:'expression ends too early')}\n  if(!s)throw Error('empty');const e=expr();if(i<s.length)throw Error(`unexpected \u201c${s[i]}\u201d`);return {e,vars:[...vars].sort()}}\nfunction evalE(e,env){switch(e.op){case 'c':return e.v;case 'v':return env[e.n]?1:0;case 'not':return 1-evalE(e.k[0],env);case 'and':return e.k.every(x=>evalE(x,env))?1:0;case 'or':return e.k.some(x=>evalE(x,env))?1:0}}\nfunction sameFn(a,b,extraVars=[]){const V=[...new Set([...a.vars,...b.vars,...extraVars])].sort();for(let m=0;m<(1<<V.length);m++){const env={};V.forEach((v,j)=>env[v]=(m>>(V.length-1-j))&1);if(evalE(a.e,env)!==evalE(b.e,env))return {ok:false,env}}return {ok:true}}\n\n\nfunction rDraw(){const g=+$('#rG').value||1,u=+$('#rU').value;const bytes=g*2**u;const b=Math.ceil(Math.log2(bytes));\n $('#rOut').innerHTML=`<p>${g} ${({30:'GB',20:'MB',10:'KB'})[u]} = ${g} \u00d7 2<sup>${u}<\/sup> = ${bytes.toLocaleString()} bytes<\/p><p class=\"big\">${b} address bits<\/p><p class=\"note\">2<sup>${b}<\/sup> = ${(2**b).toLocaleString()} \u2265 ${bytes.toLocaleString()}.${2**b===bytes?' Exactly a power of 2.':' Not a power of 2: round up.'} A 64-bit processor uses up to 48 bits for addresses today: 2\u2074\u2078 = 256 TB.<\/p>`}\n['#rG','#rU'].forEach(s=>$(s).oninput=rDraw);rDraw();\n$('#capsIn').onkeyup=$('#capsIn').onkeydown=e=>{const on=e.getModifierState&&e.getModifierState('CapsLock');$('#capsOut').textContent='Caps Lock = '+(on?'1 (on)':'0 (off)')};\nlet C=[0,0,0,0],n=0;function cDraw(){$('#cnt').innerHTML=C.map(b=>`<span class=\"${b?'one':''}\">${b}<\/span>`).join('');$('#cOut').innerHTML=`After ${n} pulses: ${C.join('')}\u2082 = ${parseInt(C.join(''),2)}. The last flip-flop toggles every pulse, the next one every 2 pulses, then every 4, every 8: each stage halves the frequency.`}\n$('#cClk').onclick=()=>{n++;for(let i=3;i>=0;i--){C[i]^=1;if(C[i]===1)break}cDraw()};$('#cRst').onclick=()=>{C=[0,0,0,0];n=0;cDraw()};cDraw();\nfunction caDraw(){const b=(+$('#c1').value*1024+(+$('#c2').value+ +$('#c3').value)*1048576)*8;$('#caOut').innerHTML=`<p>Total cache = ${(b/8/1048576).toFixed(2)} MB = <b>${b.toLocaleString()}<\/b> bits.<\/p><p class=\"note\">That is about ${(b/1e6).toFixed(0)} million bit cells, each one built from about 6 transistors (SRAM). Fast, but big and expensive: that is why your main RAM uses a cheaper cell (DRAM, 1 transistor + 1 capacitor).<\/p>`}\n['#c1','#c2','#c3'].forEach(s=>$(s).oninput=caDraw);caDraw();\nfunction nCount(){let p;try{p=parseExpr($('#nE').value)}catch(e){$('#nOut').innerHTML=`<p style=\"color:var(--red)\">${e.message}<\/p>`;return}const V=p.vars,n=V.length;if(n>4){$('#nOut').innerHTML='<p>Use at most 4 letters.<\/p>';return}\n const ones=[];for(let m=0;m<(1<<n);m++){const env={};V.forEach((v,j)=>env[v]=(m>>(n-1-j))&1);if(evalE(p.e,env))ones.push(m)}const sol=solveSOP(n,ones);\n const cnt=c=>{const inv=new Set();c.forEach(t=>[...t].forEach((x,j)=>{if(x==='0')inv.add(j)}));const terms=c.map(t=>[...t].filter(x=>x!=='-').length);if(c.length===1)return inv.size+(terms[0]>1?2:0);return inv.size+terms.length+1};\n const orig=p.e.op==='or'?p.e.k:[p.e];const txt=c=>c.map(t=>[...t].map((x,j)=>x==='-'?'':x==='1'?V[j]:V[j]+\"'\").join('')||'1').join(' + ');\n $('#nOut').innerHTML=`<p>Simplified: <b>F = ${txt(sol)}<\/b><\/p><div class=\"bars\"><div class=\"bar\"><span>NAND gates (simplified)<\/span><div class=\"trk\"><i style=\"width:${Math.min(100,cnt(sol)*10)}%;background:var(--green)\"><\/i><\/div><b>${cnt(sol)}<\/b><\/div><\/div><p class=\"note\">Counted as NAND\u2013NAND: one NAND per product term, one NAND to join them, plus one NAND per inverted input. Build it in CircuitVerse and check the truth table.<\/p>`}\n$('#nGo').onclick=nCount;nCount();\n\n<\/script>\n<\/body>\n<\/html>\n<\/body><\/html>"}];

const selectEl = document.getElementById('topicSelect');
const pillsEl = document.getElementById('topicPills');
const frameEl = document.getElementById('topicFrame');
const prevBtn = document.getElementById('prevTopic');
const nextBtn = document.getElementById('nextTopic');

let currentIndex = 0;

// Populate dropdown & quick-switch pills
TOPICS.forEach((t, idx) => {
  const opt = document.createElement('option');
  opt.value = idx;
  opt.textContent = `${t.title} — ${t.desc}`;
  selectEl.appendChild(opt);

  const pill = document.createElement('button');
  pill.className = 'pill';
  pill.type = 'button';
  pill.setAttribute('role', 'tab');
  pill.setAttribute('aria-selected', idx === 0 ? 'true' : 'false');
  pill.dataset.idx = idx;
  pill.textContent = t.title;
  pill.title = t.desc;
  pill.onclick = () => selectTopic(idx);
  pillsEl.appendChild(pill);
});

function selectTopic(idx) {
  idx = Math.max(0, Math.min(TOPICS.length - 1, Number(idx)));
  currentIndex = idx;
  selectEl.value = String(idx);

  [...pillsEl.children].forEach((btn, i) => {
    const active = i === idx;
    btn.setAttribute('aria-selected', active ? 'true' : 'false');
    if (active) btn.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  });

  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === TOPICS.length - 1;

  // Render exact original HTML unmodified inside isolated srcdoc viewport
  frameEl.srcdoc = TOPICS[idx].html;

  try {
    localStorage.setItem('cca102-hub-topic', String(idx));
  } catch (e) {}
}

selectEl.addEventListener('change', (e) => selectTopic(e.target.value));
prevBtn.addEventListener('click', () => selectTopic(currentIndex - 1));
nextBtn.addEventListener('click', () => selectTopic(currentIndex + 1));

// Restore last viewed topic if available
let initial = 0;
try {
  const saved = localStorage.getItem('cca102-hub-topic');
  if (saved !== null && TOPICS[Number(saved)]) initial = Number(saved);
} catch (e) {}

selectTopic(initial);
</script>
