join('')}<td><button class=\"cellbtn${st[i]!==undefined?' set':''}\" data-tt=\"${i}\" aria-label=\"output for line ${i+1}\">${st[i]??'?'}<\/button><\/td><\/tr>`).join('');\n  $$('[data-tt]').forEach(b=>b.onclick=()=>{const i=+b.dataset.tt;st[i]=st[i]===0?1:0;$('#ttFb').textContent='';drawTT()});\n  $('#ttFb').textContent='';$('#mystery').hidden=true;$('#myFb').textContent='';$('#myPick').value=''}\n$('#ttCheck').onclick=()=>{const st=ttState[G.id]||{};const R=rowsOf(G);let ok=0;\n  R.forEach((r,i)=>{const want=G.one?G.f(r[0]):G.f(r[0],r[1]);const b=$(`[data-tt=\"${i}\"]`);const g=st[i]===want;b.classList.toggle('right',g);b.classList.toggle('wrong',!g);if(g)ok++});\n  const all=ok===R.length;$('#ttFb').className='fb '+(all?'ok':'no');$('#ttFb').textContent=all?'All correct.':`${ok} of ${R.length} correct. Test the red lines on the bench.`;\n  if(all&&G.mystery)$('#mystery').hidden=false};\n$('#myCheck').onclick=()=>{const v=$('#myPick').value;if(!v)return;const ok=v===G.mystery;$('#myFb').className='fb '+(ok?'ok':'no');\n  $('#myFb').textContent=ok?`Yes. Its table is exactly the ${G.mystery} table. This is De Morgan's law (see the laws in Q2).`:'Not this one. Compare your table with the tables of the normal gates.'};\n\n// ---------- station 2: tidy lesson ----------\nconst LAWS=[\n ['Commutative','A + B = B + A<br>A \u00b7 B = B \u00b7 A','The order does not matter.','Tea with milk is the same drink as milk with tea.'],\n ['Associative','(A + B) + C = A + (B + C)','The brackets can move when all the signs are the same.','Adding three prices: the order you add them in does not change the total.'],\n ['Idempotent','A + A = A<br>A \u00b7 A = A','Saying the same thing twice adds nothing.','\u201cThe door is open, the door is open\u201d does not make it more open.'],\n ['Identity','A + 0 = A<br>A \u00b7 1 = A','0 in an OR and 1 in an AND change nothing.','Asking \u201ckey turned AND true?\u201d is the same as asking \u201ckey turned?\u201d.'],\n ['Null','A + 1 = 1<br>A \u00b7 0 = 0','1 wins an OR, 0 wins an AND.','If the power is cut (0), no AND with it can be 1.'],\n ['Complement',`A + ${nb('A')} = 1<br>A \u00b7 ${nb('A')} = 0`,'A thing and its opposite.','\u201cIt is raining OR it is not raining\u201d is always true.'],\n ['Absorption','A + A \u00b7 B = A<br>A \u00b7 (A + B) = A','The bigger term swallows the smaller one.','\u201cStudents enter free\u201d already covers \u201cstudents with a hat enter free\u201d.'],\n ['Distributive','A \u00b7 (B + C) = A\u00b7B + A\u00b7C<br>A + B\u00b7C = (A + B)(A + C)','Take out a common letter, or multiply in.','\u201cTea with (sugar or milk)\u201d = \u201ctea with sugar\u201d or \u201ctea with milk\u201d.'],\n ['Combining',`A\u00b7B + A\u00b7${nb('B')} = A`,'Two terms that differ in one letter: that letter disappears.','The base of every K-map group.'],\n ['De Morgan',`${nb('A \u00b7 B')} = ${nb('A')} + ${nb('B')}<br>${nb('A + B')} = ${nb('A')} \u00b7 ${nb('B')}`,'Break the long bar, and flip the sign.','\u201cNot (rich and famous)\u201d = \u201cnot rich, or not famous\u201d.']];\n$('#laws').innerHTML=LAWS.map(([n,f,d,l])=>`<div class=\"law\"><h3>${n}<\/h3><div class=\"f\">${f}<\/div><p>${d}<\/p><small>${l}<\/small><\/div>`).join('');\nconst shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nconst L=(s)=>s.split(' ').map(x=>({v:x.replace(\"'\",''),n:x.includes(\"'\")}));\nconst isRaw=l=>!Array.isArray(l);\nconst keyOf=l=>isRaw(l)?'raw:'+l.txt:l.slice().sort((a,b)=>a.v<b.v?-1:1).map(x=>(x.n?'~':'')+x.v).join(',');\nconst sortL=l=>isRaw(l)?l:l.slice().sort((a,b)=>a.v<b.v?-1:1);\nconst litH=l=>l.n?nb(l.v):l.v;\nfunction itemH(type,l){if(isRaw(l))return l.raw;return type==='pos'?`(${l.map(litH).join(' + ')})`:l.map(litH).join('')}\nfunction twinInfo(M){const cnt={},idx={};let ti=0;M.items.forEach(l=>{const k=keyOf(l);cnt[k]=(cnt[k]||0)+1});Object.keys(cnt).forEach(k=>{if(cnt[k]>1)idx[k]=(ti++%2)+1});return {cnt,idx}}\nfunction exprH(M,stage){const {idx}=twinInfo(M),seen={};\n  const parts=M.items.map(l=>{const k=keyOf(l);const first=!seen[k];seen[k]=1;const s=stage>=1?sortL(l):l;const cls=['br'];\n    if(stage===1&&!isRaw(l)&&s.map(x=>x.v).join()!==l.map(x=>x.v).join())cls.push('sorted');if(stage>=2&&idx[k])cls.push('t'+idx[k]);if(stage>=3&&!first)cls.push('gone');\n    return `<span class=\"${cls.join(' ')}\">${itemH(M.type,s)}<\/span>`});\n  let h=parts.join(M.type==='pos'?'':' + ');if(stage>=3)h+=`<br>= ${finalH(M)}`;return h}\nfunction finalItems(M){const seen={};return M.items.filter(l=>{const k=keyOf(l);if(seen[k])return false;return seen[k]=1}).map(sortL)}\nfunction finalH(M){return finalItems(M).map(l=>itemH(M.type,l)).join(M.type==='pos'?'':' + ')}\nfunction exprTxt(M,items){return (items||M.items).map(l=>isRaw(l)?l.txt:M.type==='pos'?'('+l.map(x=>x.v+(x.n?\"'\":'')).join('+')+')':l.map(x=>x.v+(x.n?\"'\":'')).join('')).join(M.type==='pos'?'':'+')}\nconst say=(M,l)=>isRaw(l)?l.read:l.map(x=>(x.n?'not ':'')+(M.legend?M.legend[x.v]:x.v)).join(M.type==='pos'?' OR ':' AND ');\nconst TEX=[\n {name:'Real life \u00b7 school gate',type:'pos',items:[L('G C'),L('D E'),L('C G')],legend:{C:'has a card',G:'guard opens',D:'daytime',E:'event today'},\n  story:`<b>Real life<\/b>The school gate opens only if two rules are both OK. Rule 1: the student has a card (C) OR the guard opens (G). Rule 2: it is daytime (D) OR there is an event (E). The security company typed rule 1 twice, in a different order. Every extra rule costs extra gates in the chip.`,\n  end:'The gate behaves exactly the same with one rule less: cheaper chip, same safety.'},\n {name:'Tutorial Q2a',type:'pos',items:[L(\"A' D\"),L(\"D A'\"),L(\"B E A'\"),L(\"A' E B\"),L('A B C')],story:`<b>Tutorial Q2a<\/b>Five brackets joined by AND. Same 3 moves as the school gate. Watch the bars: <span class=\"mono\">${nb('A')}<\/span> moves together with its bar.`},\n {name:'Tutorial Q2b',type:'pos',items:[L('X Y'),L('Y Z'),L('Y X')],story:'<b>Tutorial Q2b<\/b>Three brackets. One of them is a twin in disguise.',end:'Bonus for fast students: with the distributive law, (X + Y)(Y + Z) = Y + XZ.'},\n {name:'Tutorial Q2c',type:'pos',items:[L('A B C'),L('D E F'),L('X Y'),L('C A B')],story:'<b>Tutorial Q2c<\/b>Four brackets. Sorting makes the twins obvious.'},\n {name:'Tutorial Q2d',type:'sop',items:[L('A B C'),L(\"A' B' C'\"),L(\"B' C'\"),{raw:'A(B + C)',read:'A AND (B OR C)',txt:'A(B+C)'},L('C B A'),L(\"C' B'\")],\n  story:`<b>Tutorial Q2d<\/b>This one is a sum (OR) of terms. Inside a term the letters are joined by AND, and the commutative law works the same way: CBA = ABC. The term A(B + C) has a bracket inside, so we leave it as it is.`,\n  end:`Bonus for fast students: with absorption it shrinks all the way to A + ${nb('B')}${nb('C')}.`}];\nlet TM=TEX[0],tS=0;\n$('#tEx').innerHTML=TEX.map((e,i)=>`<button data-tex=\"${i}\" aria-pressed=\"${i===0}\">${e.name}<\/button>`).join('');\n$$('[data-tex]').forEach(b=>b.onclick=()=>{TM=TEX[+b.dataset.tex];tS=0;$$('[data-tex]').forEach(x=>x.setAttribute('aria-pressed',x===b));drawT()});\nfunction tSteps(M){const pos=M.type==='pos',W=pos?'bracket':'term';const nv=new Set(M.items.flatMap(l=>isRaw(l)?['A','B','C']:l.map(x=>x.v))).size;const {cnt}=twinInfo(M);\n  const read=M.items.map((l,i)=>`${W} ${i+1}: <span class=\"mono\">${itemH(M.type,l)}<\/span> \u2192 \u201c${esc(say(M,l))}\u201d`);\n  const s1=M.items.map((l,i)=>{if(isRaw(l))return `${W} ${i+1}: <span class=\"mono\">${l.raw}<\/span> has a bracket inside \u2192 leave it`;const s=sortL(l);const same=s.map(x=>x.v).join()===l.map(x=>x.v).join();\n    return `${W} ${i+1}: <span class=\"mono\">${itemH(M.type,l)}<\/span> \u2192 <span class=\"mono\">${itemH(M.type,s)}<\/span> ${same?'<span class=\"muted\">(already in order)<\/span>':'<b style=\"color:var(--accent)\">re-ordered<\/b>'}`});\n  const groups={};M.items.forEach((l,i)=>{const k=keyOf(l);(groups[k]=groups[k]||[]).push(i+1)});\n  const s2=Object.entries(groups).map(([k,pos_])=>{const l=sortL(M.items[pos_[0]-1]);return pos_.length>1?`<span class=\"mono\">${itemH(M.type,l)}<\/span> appears <b>${pos_.length} times<\/b> (${W}s ${pos_.join(' and ')}) \u2192 twins`:`<span class=\"mono\">${itemH(M.type,l)}<\/span> appears once (${W} ${pos_[0]})`});\n  const seen={};const s3=M.items.map((l,i)=>{const k=keyOf(l);const f=!seen[k];seen[k]=1;return f?`Keep ${W} ${i+1}: <span class=\"mono\">${itemH(M.type,sortL(l))}<\/span>`:`Cross out ${W} ${i+1}: it is a copy`});\n  return [\n ['Read it first',`${pos?'Each bracket is an OR, and the brackets are joined by AND.':'Each term is an AND of letters, and the terms are joined by OR.'} Read each ${W} aloud.`,read],\n ['Move 1 \u00b7 Commutative law: sort the letters',`The order does not matter: ${pos?'\u201ccard or guard\u201d is the same as \u201cguard or card\u201d.':'\u201cbread and milk\u201d is the same as \u201cmilk and bread\u201d.'} So write the letters of every ${W} in A, B, C order. A bar moves with its letter. The <b style=\"color:var(--accent)\">blue<\/b> ones changed.`,s1],\n ['Move 2 \u00b7 Find the twins',`Twins have exactly the same letters with the same bars. Same colour = twins.`,s2],\n ['Move 3 \u00b7 Idempotent law: keep only one',pos?'X \u00b7 X = X. \u201cIs the door open AND is the door open?\u201d is just \u201cIs the door open?\u201d. Keep the first one, cross out the copies.':'X + X = X. \u201cI am hungry OR I am hungry\u201d is just \u201cI am hungry\u201d. Keep the first one, cross out the copies.',s3],\n ['Finished',`Answer: <b class=\"mono\">${finalH(M)}<\/b>. ${M.end||''}`,[`${M.items.length} ${W}s became ${finalItems(M).length}.`,`The page tried all ${1<<nv} combinations of 0 and 1: the long and the short versions always give the same output.`]]]}\nfunction drawT(){refreshPaper('pp2',paper2);const S=tSteps(TM);$('#tStory').innerHTML=TM.story+(TM.legend?`<div class=\"legend2\" style=\"margin-top:6px\">${Object.entries(TM.legend).map(([k,v])=>`<span><b>${k}< very combination.'};\n// compare\n$('#cmp').onclick=()=>{let a,b;try{a=parseExpr($('#ex1').value)}catch(e){return msg('Expression 1: '+e.message)}try{b=parseExpr($('#ex2').value)}catch(e){return msg('Expression 2: '+e.message)}\n  const V=[...new Set([...a.vars,...b.vars])].sort();if(V.length>5)return msg('Use at most 5 different letters.');let same=true;let rows='';\n  for(let m=0;m<(1<<V.length);m++){const env={};V.forEach((v,j)=>env[v]=(m>>(V.length-1-j))&1);const x=evalE(a.e,env),y=evalE(b.e,env);if(x!==y)same=false;\n    rows+=`<tr>${V.map(v=>`<td class=\"b${env[v]}\">${env[v]}<\/td>`).join('')}<td class=\"b${x}${x!==y?' diff':''}\">${x}<\/td><td class=\"b${y}${x!==y?' diff':''}\">${y}<\/td><\/tr>`}\n  $('#cmpT').innerHTML=`<tr>${V.map(v=>`<th>${v}<\/th>`).join('')}<th>1<\/th><th>2<\/th><\/tr>`+rows;\n  $('#cmpFb').className='fb '+(same?'ok':'no');$('#cmpFb').textContent=same?`The same: equal on all ${1<<V.length} lines.`:'Different: look at the red lines.';\n  function msg(t){$('#cmpFb').className='fb no';$('#cmpFb').textContent=t;$('#cmpT').innerHTML=''}};\n\n\n// ---------- station 3: K-map lesson (animated) ----------\nconst LEX=[\n {name:'Real life \u00b7 canteen break',n:3,ones:[2,4,6],legend:{A:'I am hungry',B:'a friend asks me to come',C:'my next class starts in 5 minutes'},\n  story:'Between two classes, should you walk to the canteen? Three questions with yes (1) or no (0): A = I am hungry, B = a friend asks me to come, C = my next class starts in 5 minutes. The truth table writes your decision for every case (Out = 1 means: go to the canteen).',\n  end:`Read it as a sentence: go to the canteen when your class is NOT starting in 5 minutes AND (you are hungry OR a friend asks you). The long table became one short rule.`},\n {name:'Example \u00b7 3 inputs',n:3,ones:[0,2,3,7]},\n {name:'Real life \u00b7 lecture hall lights',n:4,ones:[5,7,10,11,13,15],legend:{A:'weekday',B:'daytime',C:'a class is booked',D:'people are inside'},\n  story:'The lights of a lecture hall are controlled by 4 sensors: A = it is a weekday, B = it is daytime, C = a class is booked, D = people are inside. The technician wrote, for all 16 cases, whether the lights must be on (Out = 1).',\n  end:'Read it as a sentence: lights on when (it is daytime AND people are inside) OR (it is a weekday evening AND a class is booked). Two small gates instead of six long terms.'},\n {name:'Example \u00b7 4 inputs',n:4,ones:[4,5,7,12,13,15]},\n {name:'Example \u00b7 round the edge',n:4,ones:[0,2,5,8,10]}];\nlet LE=LEX[0],lS=0,lTimer=null;\nfunction drawLexChips(){$('#lEx').innerHTML=LEX.map((e,i)=>LN&&e.n!==LN?'':`<button data-lex=\"${i}\" aria-pressed=\"${LEX[i]===LE}\">${e.name}<\/button>`).join('');\n  $$('[data-lex]').forEach(b=>b.onclick=()=>{LE=LEX[+b.dataset.lex];lS=0;sS=0;lStop();drawLexChips();buildL();drawL();drawSC()})}\nconst posOf=(n,m)=>{for(let r=0;r<(n===3?2:4);r++)for(let c=0;c<4;c++)if(cellM(n,r,c)===m)return [r,c]};\nlet LST=[],LSOL=[];\nfunction bitsH(m,n,j){return [...bits(m,n)].map((b,i)=>i===j?`<b>${b}<\/b>`:b).join(' ')}\nfunction buildL(){const n=LE.n,V=VARS(n),N=1<<n,ON=new Set(LE.ones);const sol=solveSOP(n,LE.ones);LSOL=sol;const S=[];\n  const leg=LE.legend?` (${V.map(v=>`${v} = ${LE.legend[v]}`).join(', ')})`:'';\n  S.push({st:'Stage 1 \u00b7 Draw the boxes',t:'One box for each line',fill:-1,acts:[\n    LE.story?`<b>The story.<\/b> ${LE.story}`:`The truth table has ${N} lines${leg}.`,\n    `${N} lines \u2192 ${N} boxes. Each box has its line number in the small corner.`,\n    n===3?'The row of a box gives A (0 or 1). The column gives B and C together.':'The row of a box gives A and B together. The column gives C and D together.']});\n  S.push({st:'Stage 1 \u00b7 Draw the boxes',t:'Count 00, 01, 11, 10 (not 00, 01, 10, 11)',fill:-1,hot:1,acts:[\n    'Look at the amber labels: 00 \u2192 01 \u2192 11 \u2192 10.',\n    'Between two boxes side by side, only ONE bit changes: 0<b>0<\/b> \u2192 0<b>1<\/b>, then <b>0<\/b>1 \u2192 <b>1<\/b> \">${bitsH(nxt[0],n,j)}<\/span>. Box ${cells[0]} \u2192 box ${nxt[0]}.`,\n        `New box${nxt.length>1?'es':''}: ${nxt.join(', ')}. ${nxt.length>1?'They are all':'It is'} 1 \u2192 the group doubles to <b>${cells.length*2} boxes<\/b>.`,\n        wrap?'These boxes are neighbours <b>round the edge<\/b> (the map goes round).':'They are neighbours on the map: only one bit is different.']});\n      cells=[...cells,...nxt]});\n    const tries=fixed.map(j=>{const nxt=cells.map(m=>m^(1<<(n-1-j)));const z=nxt.filter(m=>!ON.has(m));return {j,nxt,z}});\n    S.push({st:'Stage 3 \u00b7 Circle the groups',t:`${base}: can it grow more? No \u2192 circle it`,fill:N,g:gi,gcells:cells,bad:tries.flatMap(t=>t.z),done:gi,acts:[\n      ...tries.map(t=>`Change ${V[t.j]}: box${t.nxt.length>1?'es':''} ${t.nxt.join(', ')}. Box ${t.z.join(', ')} ${t.z.length>1?'are':'is'} 0 (red) \u2192 cannot grow that way.`),\n      `Final group ${gi+1}: box${cells.length>1?'es':''} ${cells.slice().sort((a,b)=>a-b).join(', ')} (${cells.length} box${cells.length>1?'es':''}).`]});\n    S.push({st:'Stage 4 \u00b7 Read each group',t:`${base}: the column test`,fill:N,g:gi,gcells:cells,col:gi,done:gi,acts:[\n      'Write the bits of every box of the group under A, B, C' + (n===4?', D.':'.'),\n      'Look down each column: <b>0 and 1 mixed<\/b> \u2192 that letter changes, remove it.',\n      'Always <b>1<\/b> \u2192 write the letter. Always <b>0<\/b> \u2192 write the letter with a bar.',\n      `Group ${gi+1} = <b class=\"mono\">${termHTML(c,V)}<\/b>`]});\n    ms.forEach(m=>covered.add(m))});\n  S.push({st:'Stage 4 \u00b7 Read each group',t:'Join the groups with +',fill:N,done:sol.length,acts:[\n    `Out = <b class=\"mono\">${sopHTML(sol,V)}<\/b>`,\n    'Check: every 1 is inside a group, no 0 is inside a group, each group is as big as possible.',\n    ...(LE.end?[`<b>Back to the story.<\/b> ${LE.end}`]:[])]});\n  LST=S;$('#lSeek').max=S.length-1}\nfunction drawL(){const S=LST,st=S[lS],n=LE.n,V=VARS(n),ON=new Set(L 'Turn each block sideways: block 1 becomes row 1, block 2 becomes row 2\u2026','The small number in each box is still the line number.']});\n  S.push({t:'Swap the 3rd and 4th box of every row',v:'rows',sw:1,acts:['In every row, the 3rd and 4th boxes change places (purple).','Why? The K-map counts 00, 01, <b>11, 10<\/b>: line 3 (\u202611) must come before line 2 (\u202610).','So each row now reads: 0, 1, <b>3, 2<\/b> \u2014 then 4, 5, <b>7, 6<\/b>\u2026']});\n  if(n===4)S.push({t:'4 inputs: also swap the 3rd and 4th row',v:'rows',sw:2,acts:['Same idea for the rows: the 3rd and 4th rows change places (purple).','The rows now go: lines 0\u20133, 4\u20137, <b>12\u201315, 8\u201311<\/b> (labels 00, 01, <b>11, 10<\/b>).']});\n  S.push({t:'Done: this is your K-map',v:'map',acts:['Add the labels: '+(n===3?'A on the left (0, 1), BC on top (00, 01, 11, 10).':'AB on the left and CD on top, both 00, 01, 11, 10.'),'No need to convert line by line: 4 boxes at a time, then one swap.']});\n  S.push({t:'Shortcut 2 \u00b7 Circle: biggest first',v:'map',groups:1,acts:['Look for a group of 8, then groups of 4 (a full row, a full column, or a 2\u00d72 square), then pairs, then single boxes.','Groups may overlap and may go round the edges. Stop when every 1 is circled.',`Here: ${sol.map((c,i)=>`group ${i+1} = ${cubeMins(c).length} box${cubeMins(c).length>1?'es':''}`).join(', ')}.`]});\n  sol.forEach((c,i)=>{const ms=cubeMins(c);const lines=V.map((v,j)=>{const vals=[...new Set(ms.map(m=>bits(m,n)[j]))];return vals.length>1?`${v}: 0 and 1 \u2192 different \u2192 <b>delete ${v}<\/b>`:`${v}: always ${vals[0]} \u2192 same \u2192 <b class=\"mono\">${vals[0]==='1'?v:nb(v)}<\/b>`});\n    S.push({t:`Shortcut 3 \u00b7 Read group ${i+1}: same or different?`,v:'map',groups:1,sel:i,acts:[`Group ${i+1} = boxes ${ms.join(', ')}. Read the labels of its row${n===3?'':'s'} and column${ms.length>1?'s':''}.`,...lines,`Group ${i+1} = <b class=\"mono\">${termHTML(c,V)}<\/b>`]})});\n  S.push({t:'Join the group );\n  $('#kResult').innerHTML=K.shown?`Out = ${sopHTML(K.sol,V)}`:''}\n$$('[data-n]').forEach(b=>b.onclick=()=>newK(+b.dataset.n));\n$('#kNew').onclick=()=>newK(K.n);$('#kNum').onchange=drawK;\n$('#kCheck').onclick=()=>{const S=new Set(K.ones);let ok=0,N=1<<K.n;$$('[data-m]').forEach(b=>{const m=+b.dataset.m;const g=(K.user[m]??-1)===(S.has(m)?1:0);b.classList.toggle('right',g);b.classList.toggle('wrong',!g);if(g)ok++});\n  $('#kFb').className='fb '+(ok===N?'ok':'no');$('#kFb').textContent=ok===N?'Your K-map is correct.':`${ok} of ${N} cells correct. Turn on the line numbers to find each line.`};\n$('#kFill').onclick=()=>{const S=new Set(K.ones);for(let m=0;m<(1<<K.n);m++)K.user[m]=S.has(m)?1:0;drawK()};\n$('#kShow').onclick=()=>{K.shown=!K.shown;$('#kShow').textContent=K.shown?'Hide the groups':'Show the groups';drawK()};\n$('#kAnsCheck').onclick=()=>{let p;const fb=$('#kAnsFb');try{p=parseExpr($('#kAns').value)}catch(e){fb.className='fb no';fb.textContent='I cannot read it: '+e.message;return}\n  const V=VARS(K.n);const extra=p.vars.filter(v=>!V.includes(v));if(extra.length){fb.className='fb no';fb.textContent=`Use only the letters ${V.join(', ')}.`;return}\n  const S=new Set(K.ones);let wrong=[];for(let m=0;m<(1<<K.n);m++){const env={};V.forEach((v,j)=>env[v]=(m>>(K.n-1-j))&1);if(evalE(p.e,env)!==(S.has(m)?1:0))wrong.push(m)}\n  if(wrong.length){fb.className='fb no';fb.textContent=`Not the same function: it is wrong on line${wrong.length>1?'s':''} ${wrong.join(', ')} of the truth table.`;return}\n  const terms=p.e.op==='or'?p.e.k.length:1;fb.className='fb ok';fb.textContent=terms<=K.sol.length?'Correct, and as short as possible.':`Correct, but it can be shorter: the smallest answer has ${K.sol.length} term${K.sol.length>1?'s':''}. Try bigger groups.`};\n\n// ---------- station 4: algebra ----------\nconst EX=[\n {name:'Real life \u00b7 canteen break',n:3,ones:[2,4,6],story:'<b>Real life<\/b>Between two classes, do you go to the canteen? A = I am hungry, B = a friend asks me to come, C = my next class starts in 5 minutes. Your rule, written case by case: go if (not hungry, friend asks, no class soon) OR (hungry, no friend, no class soon) OR (hungry, friend asks, no class soon).',\n  start:`${nb('A')}B${nb('C')} + A${nb('B')}${nb('C')} + AB${nb('C')}`,steps:[\n   ['Action 1 \u00b7 find pairs',`AB${nb('C')} (the last term) differs from the first term only in A, and from the middle term only in B. It has two partners.`,`${nb('A')}B${nb('C')} + A${nb('B')}${nb('C')} + AB${nb('C')}`],\n   ['Action 2 \u00b7 copy (idempotent)','X = X + X: write AB'+nb('C')+' twice, one copy for each partner.',`${nb('A')}B${nb('C')} + AB${nb('C')} + A${nb('B')}${nb('C')} + AB${nb('C')}`],\n   ['Action 3 \u00b7 take out the common part (distributive)',`Pair 1 shares B${nb('C')}, pair 2 shares A${nb('C')}.`,`B${nb('C')}(${nb('A')} + A) + A${nb('C')}(${nb('B')} + B)`],\n   ['Action 4 \u00b7 opposite pairs make 1 (complement)',`${nb('A')} + A = 1 and ${nb('B')} + B = 1.`,`B${nb('C')} \u00b7 1 + A${nb('C')} \u00b7 1`],\n   ['Identity','Remove the \u00b7 1.',`B${nb('C')} + A${nb('C')}`],\n   ['Distributive (optional)',`Both contain ${nb('C')}. Read it as a sentence: go when there is NO class in 5 minutes AND (hungry OR a friend asks).`,`${nb('C')}(A + B)`]]},\n {name:'Two terms',n:3,ones:[3,7],start:`${nb('A')}BC + ABC`,steps:[\n   ['Distributive','Both terms contain BC. Take it out.',`BC(${nb('A')} + A)`],\n   ['Complement',`${nb('A')} + A is always 1.`,'BC \u00b7 1'],\n   ['Identity','Anything AND 1 stays the same.','BC']]},\n {name:'Three terms: copy one',n:3,ones:[0,2,6],start:`${nb('A')}${nb('B')}${nb('C')} + ${nb('A')}B${nb('C')} + AB${nb('C')}`,steps:[\n   ['Look for pairs',`${nb('A')}B${nb('C')} (the middle term) differs from the first term only in B, and from the last term only in A. It has two partners.`,`${nb('A')}${nb('B')}${nb('C')} + ${nb('A')}B${nb('C')} + AB${nb('C')}`],\n   ['Idempotent',`X = X + X, so we may write the middle term twice: one copy for each partner.`,`${nb('A')}${nb('B')}${nb('C')} + ${nb('A')}B${nb('C')} + ${nb('A')}B${nb('C')} + AB${nb('C')}`],\n   ['Distributive','Take out what each pair has in common.',`${nb('A')}${nb('C')}(${nb('B')} + B) + B${nb('C')}(${nb('A')} + A)`],\n   ['Complement','Each bracket is a letter OR its opposite, so it is 1.',`${nb('A')}${nb('C')} \u00b7 1 + B${nb('C')} \u00b7 1`],\n   ['Identity','Remove the \u00b7 1.',`${nb('A')}${nb('C')} + B${nb('C')}`],\n   ['Distributive (optional)',`Both terms contain ${nb('C')}. Taking it out saves one gate.`,`${nb('C')}(${nb('A')} + B)`]]},\n {name:'Four terms',n:3,ones:[2,3,6,7],start:`${nb('A')}B${nb('C')} + ${nb('A')}BC + ABC + AB${nb('C')}`,steps:[\n   ['Commutative + Distributive','Pair the terms that differ in C, and take out what they share.',`${nb('A')}B(${nb('C')} + C) + AB(C + ${nb('C')})`],\n   ['Complement + Identity','Each bracket is 1.',`${nb('A')}B + AB`],\n   ['Distributive','Both terms contain B.',`B(${nb('A')} + A)`],\n   ['Complement + Identity','The bracket is 1.','B']]},\n {name:'Four corners (4 inputs)',n:4,ones:[0,2,8,10],start:`${nb('A')}${nb('B')}${nb('C')}${nb('D')} + ${nb('A')}${nb('B')}C${nb('D')} + A${nb('B')}${nb('C')}${nb('D')} + A${nb('B')}C${nb('D')}`,steps:[\n   ['Distributive','Pair the terms that differ only in C.',`${nb('A')}${nb('B')}${nb('D')}(${nb('C')} + C) + A${nb('B')}${nb('D')}(${nb('C')} + C)`],\n   ['Complement + Identity','Each bracket is 1.',`${nb('A')}${nb('B')}${nb('D')} + A${nb('B')}${nb('D')}`],\n   ['Distributive',`Both terms contain ${nb('B')} and ${nb('D')}. Take them out.`,`${nb('B')}${nb('D')}(${nb('A')} + A)`],\n   ['Complement + Identity','The bracket is 1. On the K-map, these four cells are the four corners, which touch each other through the edges.',`${nb('B')}${nb('D')}`]]}];\nlet E=EX[0],eK=0;\n$('#exPick').innerHTML=EX.map((e,i)=>`<button data-ex=\"${i}\" aria-pressed=\"${i===0}\">${e.name}<\/button>`).join('');\n$$('[data-ex]').forEach(b=>b.onclick=()=>{E=EX[+b.dataset.ex];eK=0;$$('[data-ex]').forEach(x=>x.setAttribute('aria-pressed',x===b));drawEx()});\nfunction drawEx(){refreshPaper('pp4',paper4);$('#exStory').innerHTML=E.story||'<b>Method<\/b>Use the 4 actions above, one step at a time.';$('#exStart').innerHTML=E.start;$('#exSteps').innerHTML=E.steps.slice(0,eK).map(([l,t,x])=>`<li><div><span class=\"law-n\">${l}<\/span><p>${t}<\/p><p class=\"mono\">= ${x}<\/p><\/div><\/li>`).join('');\n  $('#exNext').disabled=eK>=E.steps.length;$('#exAll').disabled=eK>=E.steps.length}\n$('#exNext').onclick=()=>{eK++;drawEx()};$('#exAll').onclick=()=>{eK=E.steps.length;drawEx()};\n$('#exK').onclick=()=>{tab(E.n===4?3:2);openLesson({name:'From Q5 \u00b7 '+E.name,n:E.n,ones:E.ones,story:E.story?E.story.replace(/<b>Real life<\\/b>/,''):'',end:E.story?'Same answer as the algebra in Q5.':''});document.getElementById('scCard').scrollIntoView({block:'start'})};\n\n// ---------- exam paper model answers ----------\nconst PL=(txt,law='')=>`<div class=\"pl\"><span>${txt}<\/span><span class=\"plaw\">${law?'('+law+')':''}<\/span><\/div>`;\nconst ST=t=>`<div class=\"st\">${t}<\/div>`;\nfunction paperBtn(id,render){const b=$('#'+id+'Btn'),p=$('#'+id);b.onclick=()=>{p.hidden=!p.hidden;b.textContent=p.hidden?'Show the model answer':'Hide the model answer';if(!p.hidden)p.innerHTML=render()};}\nfunction refreshPaper(id,render){const p=$('#'+id);if(!p.hidden)p.innerHTML=render()}\nfunction paper2(){const M=TM,W=M.type==='pos'?'bracket':'term',sorted={...M,items:M.items.map(sortL)};const sep=M.type==='pos'?'':' + ';\n  const {cnt}=twinInfo(M);const tw=Object.entries(cnt).filter(([k,c])=>c>1).map(([k])=>itemH(M.type,sortL(M.items.find(l=>keyOf(l)===k))));\n  return [ST('Given:'),PL(exprH(M,0).replace(/<span class=\"br[^\"]*\">/g,'<span>')),\n   ST('Step 1: Rearrange the letters in each '+W+' in order.'),PL('= '+sorted.items.map(l=>itemH(M.type,l)).join(sep),'Commutative law: '+(M.type==='pos'?'A + B = B + A':'AB = BA')),\n   ST('Step 2: Identify the identical '+W+'s.'),PL(tw.map(t=>t+' appears twice').join(', ')),\n   ST('Step 3: Remove the repeated '+W+'s.'),PL('= '+finalH(M),'Idempotent law: '+(M.type==='pos'?'X \u00b7 X = X':'X + X = X')),\n   ST('Answer:'),PL(`<span class=\"fin\">${finalH(M)}<\/span>`)].join('')}\nfunction paper3(){const n=LE.n,V=VARS(n),ON=LE.ones,sol=solveSOP(n,ON),rows=n===3?2:4,rh=n===3?['0','1']:GRAY2.map(x=>bits(x,2)),ch=GRAY2.map(x=>bits(x,2));\n  let k=`<table class=\"kmap\"><tr><th>${n===3?'A\\\\BC':'AB\\\\CD'}<\/th>${ch.map(x=>`<th>${x}<\/th>`).join('')}<\/tr>`;for(let r=0;r<rows;r++){k+=`<tr><th>${rh[r]}<\/th>`;for(let c=0;c<4;c++){const m=cellM(n,r,c);const gs=sol.map((cb,i)=>cubeMins(cb).includes(m)?i:-1).filter(i=>i>=0);k+=`<td style=\"${gs.length?`background:color-mix(in srgb,var(--g${gs[0]+1}) 22%,transparent)`:''}\">${ON.includes(m)?1:0}<\/td>`}k+='<\/tr>'}k+='<\/table>';\n  const out=[ST('Step 1: List the lines where the output is 1 (minterms).'),PL(`F(${V.join(', ')}) = \u03a3m(${ON.join(', ')})`),\n   ST(`Step 2: Draw the ${1<<n}-box K-map (labels in Gray code 00, 01, 11, 10) and fill it.`),k,\n   ST('Step 3: Group the 1s (biggest groups first).')];\n  sol.forEach((c,i)=>out.push(PL(`Group ${i+1}: m${cubeMins(c).join(', m')}`,`${cubeMins(c).length} box${cubeMins(c).length>1?'es':''}`)));\n  out.push(ST('Step 4: Simplify each group (a variable that changes is eliminated).'));\n  sol.forEach((c,i)=>{const ms=cubeMins(c);const why=V.map((v,j)=>{const vals=[...new Set(ms.map(m=>bits(m,n)[j]))];return vals.length>1?`${v} changes`:`${v} = ${vals[0]}`}).join(', ');out.push(PL(`Group ${i+1}: ${why} \u2192 ${termHTML(c,V)}`))});\n  out.push(ST('Step 5: Write the final expression.'),PL(`<span class=\"fin\">F = ${sopHTML(sol,V)}<\/span>`));return out.join('')}\nfunction paper4(){const LW=[['commutative','Commutative law'],['idempotent','Idempotent law: X + X = X'],['distributive','Distributive law'],['complement','Complement law: X + '+nb('X')+' = 1'],['identity','Identity law: X \u00b7 1 = X']];const lawShort=l=>LW.filter(([k])=>l.toLowerCase().includes(k)).map(x=>x[1]).join(', ');\n  return [ST('Given:'),PL('F = '+E.start),...E.steps.filter(s=>!/^Look for pairs/.test(s[0])&&!/^Action 1/.test(s[0])).map((s,i)=>ST(`Step ${i+1}:`)+PL('= '+s[2],lawShort(s[0]))),ST('Answer:'),PL(`<span class=\"fin\">F = ${E.steps[E.steps.length-1][2]}<\/span>`)].join('')}\npaperBtn('pp2',paper2);paperBtn('pp3',paper3);paperBtn('pp4',paper4);\n// ---------- start ----------\ndrawGate();drawTT();drawT();newTidy();buildL();drawL();drawSC();newK(3);drawEx();tab(store.get('q',0));\n<\/script>\n\n<\/body><\/html>"}, {"fname": "4.Logic Gates in Your Computer.html", "title": "4. Logic Gates in Your Computer", "desc": "Tutorial 4 in practice \u00b7 Bitwise ops, Excel, search, NAND", "html": "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Logic Gates in Your Computer<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#EEF2EC; --panel:#FFFFFF; --ink:#1D2B2A; --muted:#566664; --line:#C9D3CC; --soft:#E2E9E3;\n  --blue:#2F6FDB; --green:#2E8B57; --red:#C0392B; --amber:#B87410; --purple:#7B5EA7; --term:#14161C; --termtx:#D7F5DE;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#131A19; --panel:#1C2524; --ink:#E5EDE9; --muted:#9DAEA9; --line:#334240; --soft:#243130;\n    --blue:#6C9BF0; --green:#4FB57D; --red:#E86A5C; --amber:#E2A23C; --purple:#A98BD6; --term:#0B0C10;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#131A19; --panel:#1C2524; --ink:#E5EDE9; --muted:#9DAEA9; --line:#334240; --soft:#243130;\n  --blue:#6C9BF0; --green:#4FB57D; --red:#E86A5C; --amber:#E2A23C; --purple:#A98BD6; --term:#0B0C10;\n}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 \"Atkinson Hyperlegible\",system-ui,-apple-system,\"Segoe UI\",sans-serif}\nh1,h2,h3{font-family:\"Bricolage Grotesque\",\"Segoe UI\",system-ui,sans-serif;line-height:1.12;margin:0}\n.n,code,kbd{font-family:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace}\n.wrap{max-width:1120px;margin:0 auto;padding:28px 16px 60px}\nheader{margin-bottom:16px}\nh1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;letter-spacing:-.02em}\nheader p{margin:6px 0 0;color:var(--muted);max-width:62ch}\nnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;padding:10px 0;margin-bottom:14px;border-bottom:2px solid var(--line)}\nnav button{font:inherit;text-align:left;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);border-radius:10px;color:var(--ink);padding:7px 10px;cursor:pointer;line-height:1.2}\nnav button:hover{border-color:var(--ink)}\nnav button b{font-size:.98rem} nav button span{font-size:.8rem;color:var(--muted)}\nnav button[aria-selected=\"true\"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}\nnav button[aria-selected=\"true\"] span{color:var(--panel)}\nbutton:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}\n.pager{display:flex;justify-content:space-between;gap:10px;margin:0 0 14px}\n.st[hidden]{display:none!important}\n.st{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:22px}\n@media (max-width:860px){.st{grid-template-columns:1fr}}\n.left h2{font-size:1.6rem;font-weight:800;margin-bottom:8px}\n.where{color:var(--muted);margin:0 0 12px}\n.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);margin:0 6px 10px 0}\n.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}\n.box h3{font-size:1rem;margin-bottom:6px}\n.os{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}\n.os button{font:inherit;font-size:.85rem;font-weight:700;padding:3px 10px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}\n.os button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}\n.box ol{margin:0;padding-left:20px} .box li{margin:4px 0}\nkbd{font-size:.85rem;background:var(--soft);border:1px solid var(--line);border-bottom-width:3px;border-radius:5px;padding:0 6px}\ncode{font-size:.9rem;background:var(--soft);padding:1px 5px;border-radius:4px}\n.term{background:var(--term);color:var(--termtx);border-radius:10px;padding:10px 12px;font:500 .9rem \"JetBrains Mono\",monospace;white-space:pre-wrap;overflow-x:auto;position:relative;margin-top:8px}\n.term .c{color:#8C93A6}\n.copy{position:absolute;top:6px;right:6px;font:700 .75rem \"Atkinson Hyperlegible\",sans-serif;padding:2px 8px;border-radius:6px;border:1px solid #444;background:#2A2D36;color:#fff;cursor:pointer}\n.think{background:var(--panel);border-left:4px solid var(--ink);padding:10px 14px;border-radius:0 8px 8px 0}\n.try{background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:16px;min-width:0}\n.try h3{font-size:1.05rem;margin-bottom:10px}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}\ninput[type=text],input[type=number],select{font:inherit;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}\n.btn{font:inherit;font-weight:700;font-size:.92rem;padding:7px 12px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer}\n.btn.ghost{background:transparent;color:var(--ink)}\n.btn:disabled{opacity:.5;cursor:wait}\ntable.t{border-collapse:collapse;font-size:.95rem;width:100%}\ntable.t td,table.t th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}\ntable.t th{font-size:.78rem;color:var(--muted)}\n.big{font:700 1.35rem \"JetBrains Mono\",monospace;word-break:break-all}\n.bits{font:700 1.05rem \"JetBrains Mono\",monospace;word-break:break-all}\n.bits .pg{color:var(--blue)} .bits .off{color:var(--amber)}\n.bars{display:grid;gap:6px;margin-top:8px}\n.bar{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;font-size:.9rem}\n.trk{height:18px;background:var(--soft);border-radius:9px;overflow:hidden}\n.trk i{display:block;height:100%;border-radius:9px;transition:width .6s}\n.note{font-size:.88rem;color:var(--muted)}\n.chart{display:flex;align-items:flex-end;gap:4px;height:160px;border-bottom:2px solid var(--ink);border-left:2px solid var(--ink);padding:0 4px;margin:8px 0 4px}\n.chart div{flex:1;border-radius:4px 4px 0 0;min-height:2px;position:relative}\n.chart div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--muted)}\nfooter{margin-top:40px;color:var(--muted);font-size:.9rem}\n.bitrow{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}\n.bitrow span{width:34px;height:40px;display:inline-flex;align-items:center;justify-content:center;font:700 1.15rem \"JetBrains Mono\",monospace;border:2px solid var(--line);border-radius:6px;background:var(--soft)}\n.bitrow span.one{background:var(--blue);border-color:var(--blue);color:#fff}\ntable.t{border-collapse:collapse;margin:6px 0}table.t th,table.t td{border:1px solid var(--line);padding:4px 12px;text-align:center;font-family:\"JetBrains Mono\",monospace}\n.try ul{margin:6px 0;padding-left:20px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header>\n  <h1>Logic Gates in Your Computer<\/h1>\n  <p>CCA102 / CST131, Tutorial 4 in practice. AND, OR, NOT, XOR, the Boolean laws and K-maps are not only on paper: your calculator, Excel, Google and your phone storage use them every day. In each station, try it on your computer, then use the tool on the right.<\/p>\n<\/header>\n<nav role=\"tablist\" aria-label=\"Stations\" id=\"nav\"><\/nav>\n<div class=\"pager\" id=\"pager\"><\/div>\n\n<!-- 1 calculator -->\n<section class=\"st\" data-t=\"1 \u00b7 Programmer calculator\" data-s=\"Gates on 8 bits at once\">\n  <div class=\"left\">\n    <h2>Your calculator has logic gates<\/h2>\n    <p class=\"where\">The Windows calculator can apply AND, OR, NOT, NAND, NOR and XOR to whole numbers. It just applies the gate to each pair of bits, column by column.<\/p>\n    <span class=\"tag\">Q1 \u00b7 gates and truth tables<\/span>\n    <div class=\"box\"><h3>Do it on your computer<\/h3>\n      <div class=\"os\" data-os=\"calc\"><button class=\"on\" data-v=\"w\">Windows<\/button><button data-v=\"m\">Mac<\/button><button data-v=\"p\">Phone<\/button><\/div>\n      <div data-for=\"calc\" data-v=\"w\"><ol><li>Open <b>Calculator<\/b> \u2192 menu \u2630 \u2192 <b>Programmer<\/b>. Click <b>BIN<\/b>.<\/li><li>Type <code>1100<\/code>, click <b>Bitwise<\/b> \u2192 <b>AND<\/b>, type <code>1010<\/code>, press <b>=<\/b>. You get <code>1000<\/code>.<\/li><li>Do the same with <b>OR<\/b>, <b>XOR<\/b>, <b>NAND<\/b>, <b>NOR<\/b>. Each column is one line of the truth table!<\/li><\/ol><\/div>\n      <div data-for=\"calc\" data-v=\"m\" hidden><ol><li>Open <b>Calculator<\/b> \u2192 <b>View \u2192 Programmer<\/b> (<kbd>\u2318<\/kbd> <kbd>3<\/kbd>).<\/li><li>Use the <b>AND<\/b>, <b>OR<\/b>, <b>XOR<\/b>, <b>NOR<\/b> keys on two binary numbers.<\/li><\/ol><\/div>\n      <div data-for=\"calc\" data-v=\"p\" hidden><ol><li>Android/iPhone calculators usually have no bitwise keys. Use the tool on the right, or install a \u201cprogrammer calculator\u201d app.<\/li><\/ol><\/div>\n      <p class=\"note\"><code>1100<\/code> AND <code>1010<\/code> tries the 4 lines of the truth table at once: 1\u00b71, 1\u00b70, 0\u00b71, 0\u00b70.<\/p>\n    <\/div>\n    <p class=\"think\"><strong>Think:<\/strong> why do <code>1100<\/code> and <code>1010<\/code> give exactly the four rows (A, B) = (1,1), (1,0), (0,1), (0,0)? Write the AND, OR and XOR truth tables from the results.<\/p>\n  <\/div>\n  <div class=\"try\"><h3>Try it here<\/h3>\n    <div class=\"row\"><label>A <input type=\"text\" id=\"cA\" value=\"1100\" maxlength=\"8\" style=\"width:7em\"><\/label><label>B <input type=\"text\" id=\"cB\" value=\"1010\" maxlength=\"8\" style=\"width:7em\"><\/label>\n      <label>Gate <select id=\"cG\"><option>AND<\/option><option>OR<\/option><option>XOR<\/option><option>NAND<\/option><option>NOR<\/option><option>XNOR<\/option><\/select><\/label><\/div>\n    <div id=\"cOut\"><\/div>\n  <\/div>\n<\/section>\n\n<!-- 2 excel -->\n<section class=\"st\" hidden data-t=\"2 \u00b7 Excel\" data-s=\"Truth tables with formulas\">\n  <div class=\"left\">\n    <h2>Build a truth table in Excel<\/h2>\n    <p class=\"where\">Excel has the gates as functions: <code>AND()<\/code>, <code>OR()<\/code>, <code>NOT()<\/code>, <code>XOR()<\/code>. You can fill a whole truth table in one minute and check the laws yourself.<\/p>\n    <span class=\"tag\">Q1 \u00b7 truth tables<\/span><span class=\"tag\">Q2 \u00b7 commutative law<\/span>\n    <div class=\"box\"><h3>Do it on your computer<\/h3>\n      <ol><li>In A1, B1, C1 type <code>A<\/code>, <code>B<\/code>, <code>Out<\/code>. In A2:B5 type the four rows 0 0, 0 1, 1 0, 1 1.<\/li>\n      <li>In C2 paste the formula from the tool, then drag it down to C5.<\/li>\n      <li>In D2 type the same formula with the inputs swapped (B2 before A2). Same column? That is the <b>commutative law<\/b>.<\/li><\/ol>\n      <p class=\"note\">In Google Sheets the formulas are the same. On a French Excel: <code>ET()<\/code>, <code>OU()<\/code>, <code>NON()<\/code>, <code>OUX()<\/code>.<\/p>\n    <\/div>\n    <p class=\"think\"><strong>Think:<\/strong> =AND(A2,B2) and =AND(B2,A2) give the same column. Which law is that? What about =AND(A2,A2)?<\/p>\n  <\/div>\n  <div class=\"try\"><h3>Get the formula<\/h3>\n    <div class=\"row\"><label>Gate <select id=\"xG\"><option>AND<\/option><option>OR<\/option><option>NOT A<\/option><option>XOR<\/option><option>NAND<\/option><option>NOR<\/option><option>XNOR<\/option><\/select><\/label><\/div>\n    <div class=\"term\"><button class=\"copy\">Copy<\/button><span id=\"xF\"><\/span><\/div>\n    <div id=\"xOut\"><\/div>\n  <\/div>\n<\/section>\n\n<!-- 3 search -->\n<section class=\"st\" hidden data-t=\"3 \u00b7 Search filters\" data-s=\"AND, OR, NOT in Google and the library\">\n  <div class=\"left\">\n    <h2>Boolean search<\/h2>\n    <p class=\"where\">Google and the USM library databases understand AND, OR and NOT. The order of the words does not change the results: that is the commutative law, used every day.<\/p>\n    <span class=\"tag\">Q2 \u00b7 commutative and idempotent laws<\/span>\n    <div class=\"box\"><h3>Do it on your computer<\/h3>\n      <ol><li>In Google, search <code>laptop OR tablet<\/code>, then <code>tablet OR laptop<\/code>: same results.<\/li>\n      <li>Search <code>laptop -gaming<\/code>: the minus sign means NOT.<\/li>\n      <li>In a library database (Advanced search), try <code>(cache OR memory) AND processor<\/code>.<\/li><\/ol>\n    <\/div>\n    <p class=\"think\"><strong>Think:<\/strong> is <code>(memory OR cache) AND (cache OR memory)<\/code> any different from <code>memory OR cache<\/code>? Which two laws prove it?<\/p>\n  <\/div>\n  <div class=\"try\"><h3>Filter these 8 campus items<\/h3>\n    <div class=\"row\"><select id=\"sA\"><option value=\"cheap\">cheap<\/option><option value=\"food\">food<\/option><option value=\"near\">near the hostel<\/option><\/select>\n      <select id=\"sOp\"><option>AND<\/option><option>OR<\/option><\/select>\n      <select id=\"sB\"><option value=\"food\">food<\/option><option value=\"cheap\">cheap<\/option><option value=\"near\">near the hostel<\/option><\/select>\n      <label><input type=\"checkbox\" id=\"sNot\"> NOT the second word<\/label><\/div>\n    <div id=\"sOut\"><\/div>\n  <\/div>\n<\/section>\n\n<!-- 4 simulator -->\n<section class=\"st\" hidden data-t=\"4 \u00b7 Logic simulator\" data-s=\"Truth table \u2192 K-map for free\">\n  <div class=\"left\">\n    <h2>Let a simulator check your K-map<\/h2>\n    <p class=\"where\">Free logic simulators can build the K-map and the simplest expression from a truth table. Use them to check your answers, not to replace them!<\/p>\n    <span class=\"tag\">Q3 \u00b7 K-map 3 inputs<\/span><span class=\"tag\">Q4 \u00b7 K-map 4 inputs<\/span><span class=\"tag\">Q5 \u00b7 simplification<\/span>\n    <div class=\"box\"><h3>Do it on your computer<\/h3>\n      <div class=\"os\" data-os=\"sim\"><button class=\"on\" data-v=\"c\">CircuitVerse (browser)<\/button><button data-v=\"l\">Logisim Evolution<\/button><\/div>\n      <div data-for=\"sim\" data-v=\"c\"><ol><li>Open <a href=\"https://circuitverse.org/simulator\" target=\"_blank\" rel=\"noopener\">circuitverse.org/simulator<\/a> (no install).<\/li><li>Menu <b>Tools \u2192 Combinational Analysis<\/b>. Give the input names (A, B, C) and one output.<\/li><li>Click the output cells to copy your truth table, then <b>Generate circuit<\/b>: it draws the simplified circuit.<\/li><\/ol><\/div>\n      <div data-for=\"sim\" data-v=\"l\" hidden><ol><li>Install <b>Logisim Evolution<\/b> (free, Windows/Mac/Linux).<\/li><li><b>Project \u2192 Analyze circuit<\/b> (Combinational Analysis) \u2192 <b>Inputs<\/b>: A, B, C, D \u2192 <b>Outputs<\/b>: Out.<\/li><li><b>Table<\/b> tab: click the outputs. <b>Minimized<\/b> tab: you see the K-map with the groups and the expression.<\/li><\/ol><\/div>\n    <\/div>\n    <p class=\"think\"><strong>Think:<\/strong> the simulator and your own K-map must give the same expression (maybe with the terms in another order). If not, which 1 did you forget to circle?<\/p>\n  <\/div>\n  <div class=\"try\"><h3>Check an answer here<\/h3>\n    <p class=\"note\" style=\"margin-top:0\">Type the lines where Out = 1 and your simplified answer. Write NOT as <code>'<\/code> (A' = \u0100).<\/p>\n    <div class=\"row\"><label>Inputs <select id=\"kN\"><option value=\"3\">3 (A,B,C)<\/option><option value=\"4\">4 (A,B,C,D)<\/option><\/select><\/label><label>Lines with Out = 1 <input type=\"text\" id=\"kOnes\" value=\"2,4,6\" style=\"width:12em\"><\/label><\/div>\n    <div class=\"row\"><label>Your answer <input type=\"text\" id=\"kAns\" value=\"BC' + AC'\" style=\"width:14em\"><\/label><button class=\"btn\" id=\"kGo\">Check<\/button><\/div>\n    <div id=\"kOut\"><\/div>\n  <\/div>\n<\/section>\n\n<!-- 5 NAND -->\n<section class=\"st\" hidden data-t=\"5 \u00b7 NAND everywhere\" data-s=\"Your phone storage, and why simplify\">\n  <div class=\"left\">\n    <h2>NAND: the gate inside your phone<\/h2>\n    <p class=\"where\">The storage of your phone and of SSD drives is called <b>NAND flash<\/b>. NAND is special: you can build every other gate with NAND only. Fewer gates = cheaper, smaller and cooler chips. That is why we simplify.<\/p>\n    <span class=\"tag\">Q1 \u00b7 NAND<\/span><span class=\"tag\">Q5 \u00b7 why simplify<\/span>\n    <div class=\"box\"><h3>Do it on your computer<\/h3>\n      <div class=\"os\" data-os=\"ssd\"><button class=\"on\" data-v=\"w\">Windows<\/button><button data-v=\"a\">Android<\/button><\/div>\n      <div data-for=\"ssd\" data-v=\"w\"><ol><li>Press <kbd>Win<\/kbd> + <kbd>X<\/kbd> \u2192 <b>Device Manager<\/b> \u2192 <b>Disk drives<\/b>: if you see \u201cSSD\u201d or \u201cNVMe\u201d, your files live in NAND flash.<\/li><li>Or Task Manager \u2192 <b>Performance<\/b> \u2192 <b>Disk 0<\/b>: type <b>SSD<\/b>.<\/li><\/ol><\/div>\n      <div data-for=\"ssd\" data-v=\"a\" hidden><ol><li><b>Settings \u2192 Storage<\/b>: all that space is NAND flash memory.<\/li><\/ol><\/div>\n    <\/div>\n    <p class=\"think\"><strong>Think:<\/strong> how many 2-input gates does an expression need before and after simplification? Try your Q5 answer in the counter on the right.<\/p>\n  <\/div>\n  <div class=\"try\"><h3>Gate counter: before and after<\/h3>\n    <div class=\"row\"><label>Expression <input type=\"text\" id=\"gE\" value=\"A'BC' + AB'C' + ABC'\" style=\"width:16em\"><\/label><button class=\"btn\" id=\"gGo\">Count<\/button><\/div>\n    <div id=\"gOut\"><\/div>\n    <h3 style=\"margin-top:14px\">Build every gate from NAND<\/h3>\n    <div class=\"row\"><select id=\"nG\"><option>NOT<\/option><option>AND<\/option><option>OR<\/option><\/select><\/div>\n    <div id=\"nOut\"><\/div>\n  <\/div>\n<\/section>\n<footer>Practical companion for Tutorial 4. The examples here are not the tutorial answers: use them to check your own method.<\/footer>\n<\/div>\n<script>\nconst $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];\nconst ST=$$('.st');\n$('#nav').innerHTML=ST.map((s,i)=>`<button role=\"tab\" aria-selected=\"${i===0}\" data-i=\"${i}\"><b>${s.dataset.t}<\/b><span>${s.dataset.s}<\/span><\/button>`).join('');\nfunction show(i,scroll){ ST.forEach((s,k)=>s.hidden=k!==i); $$('[data-i]').forEach(b=>b.setAttribute('aria-selected',+b.dataset.i===i));\n  $('#pager').innerHTML=(i>0?`<button class=\"btn ghost\" id=\"pv\">Previous: ${ST[i-1].dataset.t}<\/button>`:'<span><\/span>')+(i<ST.length-1?`<button class=\"btn\" id=\"nx\">Next: ${ST[i+1].dataset.t}<\/button>`:'');\n  if(i>0) $('#pv').onclick=()=>show(i-1,true); if(i<ST.length-1) $('#nx').onclick=()=>show(i+1,true);\n  if(scroll){const top=$('#pager').getBoundingClientRect().top+scrollY-$('nav').offsetHeight-10; if(scrollY>top) scrollTo({top});} }\n$$('[data-i]').forEach(b=>b.onclick=()=>show(+b.dataset.i,true)); show(0,false);\n$$('[data-os]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); $$(`[data-for=\"${g.dataset.os}\"]`).forEach(o=>o.hidden=o.dataset.v!==b.dataset.v); }));\n$$('.copy').forEach(b=>b.onclick=()=>{ const t=b.parentElement.innerText.replace(/^Copy\\n?/,'').split('\\n').filter(l=>!l.trim().startsWith('#')).join('\\n').trim(); navigator.clipboard?.writeText(t).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200);}).catch(()=>{}); });\n\n// ---------- logic core ----------\nconst GRAY2=[0,1,3,2];\nfunction cubesOf(n){const out=[];const rec=(p)=>{if(p.length===n){out.push(p);return}for(const c of '01-')rec(p+c)};rec('');return out}\nfunction cubeMins(c){let m=[0];for(const ch of c){m=m.flatMap(x=>ch==='-'?[x*2,x*2+1]:[x*2+(+ch)])}return m}\nfunction contains(big,small){for(let i=0;i<big.length;i++)if(big[i]!=='-'&&big[i]!==small[i])return false;return true}\nfunction solveSOP(n,ones){const S=new Set(ones);if(!ones.length)return [];\n  const imps=cubesOf(n).filter(c=>cubeMins(c).every(m=>S.has(m)));\n  const primes=imps.filter(c=>!imps.some(d=>d!==c&&contains(d,c)));\n  const lits=c=>[...c].filter(x=>x!=='-').length;\n  // essential first, then brute force the rest\n  const ess=[];for(const m of ones){const cov=primes.filter(p=>cubeMins(p).includes(m));if(cov.length===1&&!ess.includes(cov[0]))ess.push(cov[0])}\n  const covered=new Set(ess.flatMap(cubeMins));const left=ones.filter(m=>!covered.has(m));\n  const rest=primes.filter(p=>!ess.includes(p));let best=null;\n  if(!left.length)best=[];else{for(let mask=1;mask<(1<<rest.length);mask++){const pick=rest.filter((_,i)=>mask>>i&1);const cv=new Set(pick.flatMap(cubeMins));if(!left.every(m=>cv.has(m)))continue;\n    const cost=[pick.length,pick.reduce((a,c)=>a+lits(c),0)];if(!best||cost[0]<best.cost[0]||(cost[0]===best.cost[0]&&cost[1]<best.cost[1]))best={pick,cost}}best=best.pick}\n  return [...ess,...best].sort((a,b)=>lits(a)-lits(b)||(a<b?-1:1))}\nfunction termHTML(c,V){if(!c.includes('0')&&!c.includes('1'))return '1';return [...c].map((ch,i)=>ch==='-'?'':ch==='1'?V[i]:`<span class=\"nb\">${V[i]}<\/span>`).join('')}\nfunction sopHTML(cubes,V){return cubes.length?cubes.map(c=>termHTML(c,V)).join(' + '):'0'}\n// ---------- expression parser: + OR, juxtaposition or * or . AND, ' or ~ or ! NOT ----------\nfunction parseExpr(src){let s=src.replace(/\\s+/g,'').replace(/[\u00b7\u2022\u00d7]/g,'*').replace(/[\u2019`]/g,\"'\"),i=0;\n  const peek=()=>s[i];const vars=new Set();\n  function expr(){let t=[term()];while(peek()==='+'){i++;t.push(term())}return t.length===1?t[0]:{op:'or',k:t}}\n  function term(){let f=[factor()];while(i<s.length&&(peek()==='*'||peek()==='.'||/[A-Za-z(~!01]/.test(peek()))){if(peek()==='*'||peek()==='.')i++;f.push(factor())}return f.length===1?f[0]:{op:'and',k:f}}\n  function factor(){let neg=0;while(peek()==='~'||peek()==='!'){neg++;i++}let a=atom();while(peek()===\"'\"){a={op:'not',k:[a]};i++}while(neg--)a={op:'not',k:[a]};return a}\n  function atom(){const c=peek();if(c==='('){i++;const e=expr();if(peek()!==')')throw Error('missing )');i++;return e}\n    if(c==='0'||c==='1'){i++;return {op:'c',v:+c}}if(c&&/[A-Za-z]/.test(c)){i++;vars.add(c.toUpperCase());return {op:'v',n:c.toUpperCase()}}throw Error(c?`unexpected \u201c${c}\u201d`:'expression ends too early')}\n  if(!s)throw Error('empty');const e=expr();if(i<s.length)throw Error(`unexpected \u201c${s[i]}\u201d`);return {e,vars:[...vars].sort()}}\nfunction evalE(e,env){switch(e.op){case 'c':return e.v;case 'v':return env[e.n]?1:0;case 'not':return 1-evalE(e.k[0],env);case 'and':return e.k.every(x=>evalE(x,env))?1:0;case 'or':return e.k.some(x=>evalE(x,env))?1:0}}\nfunction sameFn(a,b,extraVars=[]){const V=[...new Set([...a.vars,...b.vars,...extraVars])].sort();for(let m=0;m<(1<<V.length);m++){const env={};V.forEach((v,j)=>env[v]=(m>>(V.length-1-j))&1);if(evalE(a.e,env)!==evalE(b.e,env))return {ok:false,env}}return {ok:true}}\n\nconst GF={AND:(a,b)=>a&b,OR:(a,b)=>a|b,XOR:(a,b)=>a^b,NAND:(a,b)=>1-(a&b),NOR:(a,b)=>1-(a|b),XNOR:(a,b)=>1-(a^b)};\nfunction bitBox(s,hl){return `<div class=\"bitrow\">${[...s].map((b,i)=>`<span class=\"${b==='1'?'one':''}\">${b}<\/span>`).join('')}<\/div>`}\nfunction calc(){let A=$('#cA').value.replace(/[^01]/g,''),B=$('#cB').value.replace(/[^01]/g,'');const n=Math.max(A.length,B.length,1);A=A.padStart(n,'0');B=B.padStart(n,'0');const g=$('#cG').value;\n const R=[...A].map((a,i)=>GF[g](+a,+B[i])).join('');const rows=new Map();[...A].forEach((a,i)=>rows.set(a+B[i],R[i]));\n $('#cOut').innerHTML=`<p class=\"n\" style=\"margin:6px 0\">A<\/p>${bitBox(A)}<p class=\"n\" style=\"margin:6px 0\">B<\/p>${bitBox(B)}<p class=\"n\" style=\"margin:6px 0\">A ${g} B<\/p>${bitBox(R)}\n <p>Each column is one line of the ${g} truth table:<\/p><table class=\"t\"><tr><th>A<\/th><th>B<\/th><th>${g}<\/th><\/tr>${['00','01','10','11'].map(k=>`<tr><td>${k[0]}<\/td><td>${k[1]}<\/td><td>${rows.has(k)?'<b>'+rows.get(k)+'<\/b>':'<span style=\"color:var(--muted)\">not tried<\/span>'}<\/td><\/tr>`).join('')}<\/table>\n <p class=\"note\">Decimal: ${parseInt(A,2)} ${g} ${parseInt(B,2)} = ${parseInt(R,2)}<\/p>`}\n['#cA','#cB'].forEach(s=>$(s).oninput=calc);$('#cG').onchange=calc;calc();\nconst XF={AND:'=AND(A2,B2)*1',OR:'=OR(A2,B2)*1','NOT A':'=NOT(A2)*1',XOR:'=XOR(A2,B2)*1',NAND:'=NOT(AND(A2,B2))*1',NOR:'=NOT(OR(A2,B2))*1',XNOR:'=NOT(XOR(A2,B2))*1'};\nconst XFN={AND:(a,b)=>a&b,OR:(a,b)=>a|b,'NOT A':a=>1-a,XOR:(a,b)=>a^b,NAND:(a,b)=>1-(a&b),NOR:(a,b)=>1-(a|b),XNOR:(a,b)=>1-(a^b)};\nfunction xl(){const g=$('#xG').value;$('#xF').textContent=XF[g];\n $('#xOut').innerHTML=`<p>What Excel shows after you drag it down:<\/p><table class=\"t\"><tr><th><\/th><th>A<\/th><th>B<\/th><th>C (Out)<\/th><\/tr>${[[0,0],[0,1],[1,0],[1,1]].map(([a,b],i)=>`<tr><td>${i+2}<\/td><td>${a}<\/td><td>${b}<\/td><td><b>${XFN[g](a,b)}<\/b><\/td><\/tr>`).join('')}<\/table><p class=\"note\">The <code>*1<\/code> turns TRUE/FALSE into 1/0.${g==='NOT A'?'':' Swap A2 and B2: the column does not change (commutative law).'}<\/p>`}\n$('#xG').onchange=xl;xl();\nconst ITEMS=[['Nasi lemak stall',{cheap:1,food:1,near:1}],['Campus bookshop',{cheap:0,food:0,near:1}],['Caf\u00e9 near the library',{cheap:0,food:1,near:0}],['Photocopy shop',{cheap:1,food:0,near:1}],['Night market',{cheap:1,food:1,near:0}],['Gym',{cheap:1,food:0,near:0}],['Restaurant in town',{cheap:0,food:1,near:0}],['Laundry',{cheap:1,food:0,near:1}]];\nfunction sf(){const a=$('#sA').value,b=$('#sB').value,op=$('#sOp').value,nt=$('#sNot').checked;const W={cheap:'cheap',food:'food',near:'near the hostel'};\n const f=x=>{const p=x[a],q=nt?1-x[b]:x[b];return op==='AND'?p&q:p|q};const sel=ITEMS.filter(i=>f(i[1]));\n const q=`${W[a]} ${op} ${nt?'NOT ':''}${W[b]}`;\n $('#sOut').innerHTML=`<p>Search: <b>${q}<\/b> \u2192 ${sel.length} result${sel.length===1?'':'s'}<\/p><ul>${ITEMS.map(i=>`<li style=\"${f(i[1])?'font-weight:700':'opacity:.45'}\">${i[0]}<\/li>`).join('')}<\/ul>${a===b&&!nt?`<p class=\"note\">\u201c${W[a]} ${op} ${W[a]}\u201d = \u201c${W[a]}\u201d: that is the <b>idempotent law<\/b> (X\u00b7X = X, X+X = X).<\/p>`:!nt?`<p class=\"note\">Swap the two words: the results stay the same (<b>commutative law<\/b>).<\/p>`:''}`}\n['#sA','#sB','#sOp','#sNot'].forEach(s=>$(s).onchange=sf);sf();\nfunction kchk(){const n=+$('#kN').value,V=n===3?['A','B','C']:['A','B','C','D'];const ones=[...new Set($('#kOnes').value.split(/[^0-9]+/).filter(Boolean).map(Number))].filter(m=>m<(1<<n)).sort((a,b)=>a-b);\n const sol=solveSOP(n,ones);let msg='';try{const p=parseExpr($('#kAns').value);const bad=p.vars.filter(v=>!V.includes(v));if(bad.length)throw Error('use only '+V.join(', '));\n  const S=new Set(ones);const wrong=[];for(let m=0;m<(1<<n);m++){const env={};V.forEach((v,j)=>env[v]=(m>>(n-1-j))&1);if(evalE(p.e,env)!==(S.has(m)?1:0))wrong.push(m)}\n  const terms=p.e.op==='or'?p.e.k.length:1;msg=wrong.length?`<p style=\"color:var(--red);font-weight:700\">Not the same function: wrong on line${wrong.length>1?'s':''} ${wrong.join(', ')}.<\/p>`:terms>sol.length?`<p style=\"color:var(--amber);font-weight:700\">Correct, but not the shortest: the minimum has ${sol.length} term${sol.length>1?'s':''}.<\/p>`:`<p style=\"color:var(--green);font-weight:700\">Correct and as short as possible.<\/p>`}catch(e){msg=`<p style=\"color:var(--red)\">I cannot read your answer: ${e.message}<\/p>`}\n $('#kOut').innerHTML=msg+`<p class=\"note\">The simulator's minimum: <b>${sopTxt(sol,V)}<\/b> (the order of the terms does not matter).<\/p>`}\nfunction sopTxt(c,V){return c.length?c.map(x=>[...x].map((ch,j)=>ch==='-'?'':ch==='1'?V[j]:V[j]+\"'\").join('')||'1').join(' + '):'0'}\n$('#kGo').onclick=kchk;kchk();\n// gate counter: count 2-input AND/OR gates and NOT gates from the parsed tree\nfunction count(e,c){if(e.op==='v'||e.op==='c')return;if(e.op==='not'){c.not++;count(e.k[0],c);return}c[e.op]+=e.k.length-1;e.k.forEach(x=>count(x,c))}\nfunction gc(){let p;try{p=parseExpr($('#gE').value)}catch(e){$('#gOut').innerHTML=`<p style=\"color:var(--red)\">${e.message}<\/p>`;return}\n const c={and:0,or:0,not:0};count(p.e,c);const V=p.vars;const n=V.length;const ones=[];for(let m=0;m<(1<<n);m++){const env={};V.forEach((v,j)=>env[v]=(m>>(n-1-j))&1);if(evalE(p.e,env))ones.push(m)}\n const sol=n<=4?solveSOP(n,ones):null;let c2=null,st='';if(sol){st=sopTxt(sol,V);const q=parseExpr(st==='0'||st==='1'?st:st);c2={and:0,or:0,not:0};count(q.e,c2)}\n const tot=x=>x.and+x.or+x.not;\n $('#gOut').innerHTML=`<div class=\"bars\"><div class=\"bar\"><span>Before<\/span><div class=\"trk\"><i style=\"width:100%;background:var(--red)\"><\/i><\/div><b>${tot(c)} gates<\/b><\/div>${c2?`<div class=\"bar\"><span>After: ${st}<\/span><div class=\"trk\"><i style=\"width:${tot(c)?tot(c2)/tot(c)*100:0}%;background:var(--green)\"><\/i><\/div><b>${tot(c2)} gates<\/b><\/div>`:''}<\/div><p class=\"note\">Counted as 2-input AND, OR and NOT gates. Before: ${c.and} AND, ${c.or} OR, ${c.not} NOT.${c2?` After: ${c2.and} AND, ${c2.or} OR, ${c2.not} NOT.`:''}<\/p>`}\n$('#gGo').onclick=gc;gc();\nconst NB={NOT:{f:'A NAND A = (A\u00b7A)\\' = A\\'',n:1,rows:[[0,'1'],[1,'0']],d:'Connect both inputs of one NAND to A.'},AND:{f:'(A NAND B) NAND (A NAND B) = A\u00b7B',n:2,d:'A NAND, then a second NAND used as NOT.'},OR:{f:'(A NAND A) NAND (B NAND B) = A + B',n:3,d:'Two NANDs make A\\' and B\\', a third NAND joins them (De Morgan).'}};\nfunction nb(){const g=$('#nG').value,x=NB[g];const T=g==='NOT'?[[0],[1]]:[[0,0],[0,1],[1,0],[1,1]];const nand=(a,b)=>1-(a&b);\n const out=r=>g==='NOT'?nand(r[0],r[0]):g==='AND'?nand(nand(r[0],r[1]),nand(r[0],r[1])):nand(nand(r[0],r[0]),nand(r[1],r[1]));\n $('#nOut').innerHTML=`<p class=\"big\" style=\"font-size:1.05rem\">${x.f}<\/p><p>${x.d} <b>${x.n} NAND gate${x.n>1?'s':''}<\/b>.<\/p><table class=\"t\"><tr>${(g==='NOT'?['A']:['A','B']).map(h=>`<th>${h}<\/th>`).join('')}<th>with NANDs<\/th><th>${g}<\/th><\/tr>${T.map(r=>`<tr>${r.map(v=>`<td>${v}<\/td>`).join('')}<td><b>${out(r)}<\/b><\/td><td>${g==='NOT'?1-r[0]:g==='AND'?r[0]&r[1]:r[0]|r[1]}<\/td><\/tr>`).join('')}<\/table>`}\n$('#nG').onchange=nb;nb();\n\n<\/script>\n<\/body>\n<\/html>\n<\/body><\/html>"}, {"fname": "4.Inside Flip-Flops_2.html", "title": "4. Inside Flip-Flops", "desc": "Tutorial 5 \u00b7 JK toggle, address bits, universal gates, K-maps & latches", "html": "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<title>Inside Flip-Flops<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Chivo:wght@600;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Patrick+Hand&display=swap\">\n<style>\n/* Layout: a lab bench. Four stations as tabs: the gate bench (switches, wires, lamp), the laws lab, the K-map board, the algebra steps. A signal that is 1 is always amber, a signal that is 0 is always slate. */\n:root{\n  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#18202B; --muted:#596476; --line:#CDD4DD; --soft:#E3E8EE;\n  --on:#E39B12; --on-s:#FDF0D2; --off:#7A8698; --wire:#9AA5B4;\n  --accent:#2F5DAA; --accent-s:#DCE6F6; --ok:#1C7C47; --ok-s:#DBF1E3; --bad:#B23A30; --bad-s:#F8DFDB;\n  --g1:#2F5DAA; --g2:#C2410C; --g3:#1C7C47; --g4:#9333EA; --g5:#B4235D;\n  --display:\"Chivo\",\"Segoe UI\",system-ui,sans-serif;\n  --body:\"Source Sans 3\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#12161C; --panel:#1B2129; --ink:#E6EBF1; --muted:#A3AEBD; --line:#333C48; --soft:#252D37;\n  --on:#F5B83D; --on-s:#3D3018; --off:#7E8A9C; --wire:#5B6676;\n  --accent:#8DB0F0; --accent-s:#1F2C45; --ok:#5ED091; --ok-s:#173525; --bad:#F2877B; --bad-s:#43211E;\n  --g1:#8DB0F0; --g2:#FF9A62; --g3:#5ED091; --g4:#C79BFF; --g5:#FF86B8; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#12161C; --panel:#1B2129; --ink:#E6EBF1; --muted:#A3AEBD; --line:#333C48; --soft:#252D37;\n  --on:#F5B83D; --on-s:#3D3018; --off:#7E8A9C; --wire:#5B6676;\n  --accent:#8DB0F0; --accent-s:#1F2C45; --ok:#5ED091; --ok-s:#173525; --bad:#F2877B; --bad-s:#43211E;\n  --g1:#8DB0F0; --g2:#FF9A62; --g3:#5ED091; --g4:#C79BFF; --g5:#FF86B8; color-scheme:dark}\n*,*::before,*::after{box-sizing:border-box}\n[hidden]{display:none!important}\nbody{background:var(--bg);color:var(--ink);font:400 18px/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}\n.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}\n.wrap>*{min-width:0;max-width:100%}\nsection.wrap{width:100%}\nh1{font:800 clamp(2rem,5vw,3.1rem)/1.05 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}\nh2{font:800 clamp(1.3rem,2.6vw,1.75rem)/1.2 var(--display);margin:0;text-wrap:balance}\nh3{font:600 1.08rem/1.3 var(--display);margin:0}\np{margin:0}\n.lead{color:var(--muted);max-width:66ch;margin-top:8px}\n.muted{color:var(--muted)}\nbutton,select,input{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.nb{text-decoration:overline;text-decoration-thickness:2px}\n.nb+.nb{margin-left:.14em}\n.mono,code{font-family:var(--mono);font-size:.92em}\nnav.tabs{display:flex;gap:8px;flex-wrap:wrap}\nnav.tabs button{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;cursor:pointer;text-align:left;line-height:1.25}\nnav.tabs b{display:block;font:600 1rem var(--display)} nav.tabs span{font-size:.82rem;color:var(--muted)}\nnav.tabs button[aria-selected=\"true\"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}\nnav.tabs button[aria-selected=\"true\"] span{color:var(--panel)}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}\n.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}\n.grid2>*{min-width:0}\n@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.btn{font-weight:700;padding:8px 15px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer}\n.btn.ghost{background:transparent;color:var(--ink)}\n.btn.sm{padding:4px 10px;font-size:.92rem}\n.btn:disabled{opacity:.4;cursor:not-allowed}\n.fb{font-weight:700}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}\n.chips{display:flex;gap:6px;flex-wrap:wrap}\n.chips button{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:.95rem}\n.chips button[aria-pressed=\"true\"]{border-color:var(--accent);background:var(--accent-s)}\n.life{border-left:5px solid var(--on);background:var(--on-s);border-radius:0 10px 10px 0;padding:10px 14px}\n.life b{font:600 .78rem var(--display);text-transform:uppercase;letter-spacing:.06em;display:block;color:var(--muted)}\n.note{border-left:5px solid var(--accent);background:var(--accent-s);border-radius:0 10px 10px 0;padding:10px 14px}\n.scroll{overflow-x:auto}\ntable.t{border-collapse:collapse;font-variant-numeric:tabular-nums}\ntable.t th,table.t td{border:1px solid var(--line);padding:6px 12px;text-align:center;font-family:var(--mono)}\ntable.t th{font-family:var(--display);font-size:.9rem;background:var(--soft)}\ntd.b1{color:var(--on);font-weight:700} td.b0{color:var(--off)}\ntd.diff{background:var(--bad-s)}\n/* bench */\n.bench{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}\n.sw{display:flex;flex-direction:column;gap:14px}\n.sw button{width:92px;white-space:nowrap;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:8px;font:700 1rem var(--mono)}\n.sw button .k{width:22px;height:22px;border-radius:50%;background:var(--off);transition:background .2s}\n.sw button[aria-pressed=\"true\"]{border-color:var(--on)} .sw button[aria-pressed=\"true\"] .k{background:var(--on)}\nsvg.gate{width:100%;max-width:340px;height:auto;display:block;margin:auto}\nsvg.gate .body{fill:var(--panel);stroke:var(--ink);stroke-width:3}\nsvg.gate .w{stroke:var(--wire);stroke-width:4;fill:none;transition:stroke .2s}\nsvg.gate .w.on{stroke:var(--on)}\nsvg.gate .bub{fill:var(--panel);stroke:var(--ink);stroke-width:3}\nsvg.gate text{fill:var(--muted);font:600 14px var(--mono)}\n.lamp{width:74px;height:74px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font:700 1.6rem var(--mono);color:var(--off);background:var(--soft);transition:all .2s}\n.lamp.on{background:var(--on);border-color:var(--on);color:#2A1B00;box-shadow:0 0 28px var(--on)}\n@media (prefers-reduced-motion: reduce){.lamp,.sw .k,svg.gate .w{transition:none}}\n.cellbtn{min-width:46px;border:2px dashed var(--line);background:var(--panel);border-radius:8px;cursor:pointer;font:700 1rem var(--mono);padding:2px 8px}\n.cellbtn.set{border-style:solid}\n.cellbtn.right{border-color:var(--ok);background:var(--ok-s)} .cellbtn.wrong{border-color:var(--bad);background:var(--bad-s)}\n/* laws */\n.laws{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}\n.law{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:6px}\n.law .f{font:600 1.08rem var(--mono)}\n.law small{color:var(--muted);font-size:.92rem}\n.expr{font:600 1.25rem/1.9 var(--mono);word-break:break-word}\n.br{display:inline-block;border-radius:8px;padding:0 3px;transition:background .3s}\n.br.twin{background:var(--on-s);outline:2px solid var(--on)}\n.br.gone{opacity:.25;text-decoration:line-through}\ninput[type=text]{padding:8px 11px;border-radius:9px;border:2px solid var(--line);background:var(--panel);font
