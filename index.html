mbits{font:800 1.3rem var(--mono);letter-spacing:.18em;color:var(--a);background:var(--a-soft);padding:4px 12px;border-radius:8px}\n.mbits.neg{color:var(--neg)}\n.tour{margin-left:auto;font:700 1rem var(--mono);color:var(--muted)}\n.trainwrap{overflow-x:auto;padding-bottom:70px;margin-bottom:-56px}\n.train{--w:64px;display:grid;gap:8px;width:max-content;margin:0 auto;position:relative}\n.lab{font:700 .95rem var(--display);text-align:center;padding-bottom:4px;border-bottom:3px solid;white-space:nowrap}\n.lab.c{color:var(--c);border-color:var(--c)} .lab.a{color:var(--a);border-color:var(--a)} .lab.q{color:var(--q);border-color:var(--q)}\n.cell{height:calc(var(--w)*1.15);border-radius:10px;border:2px solid var(--line);background:var(--soft);position:relative}\n.cell.c{border-color:var(--c)} .cell.a{border-color:var(--a);background:var(--a-soft)} .cell.q{border-color:var(--q);background:var(--q-soft)}\n.cell.look{box-shadow:0 0 0 4px var(--hl);border-color:var(--ink)}\n.bit{position:absolute;inset:0;display:grid;place-items:center;font:800 calc(var(--w)*.55) var(--mono);transition:transform .7s cubic-bezier(.3,.7,.2,1),opacity .7s}\n.bit.chg{color:var(--ok)}\n.bit.pop{animation:pop .5s ease}\n@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}\n.ptr{text-align:center;font:700 .85rem var(--body);color:var(--muted);line-height:1.2}\n.ptr b{display:block;font-size:1.3rem;color:var(--ink)}\n.rules{border-collapse:collapse;font-size:1rem;align-self:center}\n.rules td,.rules th{border:1px solid var(--line);padding:4px 12px}\n.rules th{background:var(--soft);font-size:.82rem;color:var(--muted)}\n.rules td:first-child{font:800 1.05rem var(--mono)}\n.rules tr.on td{background:var(--hl);font-weight:700}\n.sum{font:800 1.2rem/1.5 var(--mono);background:var(--soft);border-radius:10px;padding:10px 16px;white-space:pre;overflow-x:auto;align-self:center;max-width:100%}\n.sum .m{color:var(--a)} .sum .n{color:var(--neg)}\n.say{font-size:1.2rem;line-height:1.45;background:var(--hl);border-radius:12px;padding:12px 16px;min-height:3.3em}\n.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.btn{font-weight:700;padding:10px 16px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer}\n.btn.ghost{background:transparent;color:var(--ink)}\n.btn:disabled{opacity:.4;cursor:not-allowed}\n.dots{display:flex;gap:4px;flex-wrap:wrap}\n.dots button{width:12px;height:8px;border:0;border-radius:4px;background:var(--line);cursor:pointer;padding:0}\n.dots button.on{background:var(--ink)}\n.recipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}\n.recipe div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}\n.recipe h2{font:700 1.05rem var(--display);margin:0 0 4px}\n.recipe p{margin:0;color:var(--muted);font-size:.98rem}\n.hist{overflow-x:auto}\ntable.h{border-collapse:collapse;font-size:.98rem}\ntable.h th,table.h td{border:1px solid var(--line);padding:5px 10px;text-align:center}\ntable.h th{background:var(--soft);font-size:.82rem;color:var(--muted)}\ntd.b{font:700 1rem var(--mono);letter-spacing:.08em}\ntd.l{text-align:left}\ntr.cur td{background:var(--hl)}\n.how4{display:grid;gap:8px;background:var(--soft);border-radius:12px;padding:12px 16px}\n.how4 h3{margin:0;font:700 1.05rem var(--display)}\n.how4 .st{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr);gap:4px 14px;align-items:baseline}\n.how4 .st span{color:var(--muted)}\n.how4 code{font:800 1.12rem var(--mono);letter-spacing:.1em;word-break:break-all}\n.how4 code s{color:var(--q);text-decoration-thickness:3px}\n.how4 code i{font-style:normal;color:var(--ok)}\n.how4 code u{text-decoration:none;color:var(--a)}\n.how4 small{font-family:var(--body);letter-spacing:0;color:var(--muted)}\n.how4 .why{margin:0;color:var(--muted)}\n.letters{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}\n.letters h2{font:700 1.05rem var(--display);margin:0 0 6px}\n.letters code{font:800 1.2rem var(--mono);letter-spacing:.25em}\n@media (max-width:560px){.how4 .st{grid-template-columns:1fr}}\n@media (prefers-reduced-motion: reduce){.bit{transition:none}.bit.pop{animation:none}}\n<\/style>\n\n<div class=\"wrap\">\n  <div class=\"top\">\n    <div>\n      <h1 id=\"h1\"><\/h1>\n      <p class=\"sub\" id=\"sub\"><\/p>\n    <\/div>\n    <div class=\"pick\">\n      <span class=\"seg\" role=\"group\" aria-label=\"Method\"><button id=\"mAS\" aria-pressed=\"true\">Add-shift<\/button><button id=\"mBO\" aria-pressed=\"false\">Booth<\/button><\/span>\n      <label for=\"selN\" id=\"nWrap\" hidden><span id=\"lN\"><\/span> <select id=\"selN\"><option value=\"4\">4<\/option><option value=\"6\">6<\/option><\/select><\/label>\n      <label for=\"selM\"><span id=\"lM\"><\/span> <select id=\"selM\"><\/select><\/label>\n      <label for=\"selQ\"><span id=\"lQ\"><\/span> <select id=\"selQ\"><\/select><\/label>\n      <span class=\"seg\" role=\"group\" aria-label=\"Language\"><button id=\"fr\" aria-pressed=\"true\">FR<\/button><button id=\"en\" aria-pressed=\"false\">EN<\/button><\/span>\n    <\/div>\n  <\/div>\n\n  <section class=\"stage\">\n    <div class=\"mrow\" id=\"mrow\"><\/div>\n    <div class=\"trainwrap\"><div class=\"train\" id=\"train\"><\/div><\/div>\n    <table class=\"rules\" id=\"rules\" hidden><\/table>\n    <div class=\"sum\" id=\"sum\" hidden><\/div>\n    <div class=\"say\" id=\"say\" aria-live=\"polite\"><\/div>\n    <div class=\"how4\" id=\"how4\" hidden><\/div>\n    <div class=\"ctl\">\n      <button class=\"btn ghost\" id=\"prev\" aria-label=\"Previous\">\u25c0<\/button>\n      <button class=\"btn\" id=\"next\"><\/button>\n      <button class=\"btn ghost\" id=\"auto\"><\/button>\n      <button class=\"btn ghost\" id=\"reset\"><\/button>\n      <div class=\"dots\" id=\"dots\"><\/div>\n    <\/div>\n  <\/section>\n\n  <div class=\"recipe\" id=\"recipe\"><\/div>\n  <div class=\"letters\" id=\"letters\"><\/div>\n  <div class=\"hist\"><table class=\"h\" id=\"hist\"><\/table><\/div>\n<\/div>\n\n<script>\nconst $=s=>document.querySelector(s);\nlet L='fr',MODE='as';\nconst bn=(x,n)=>(((x%2**n)+2**n)%2**n).toString(2).padStart(n,'0');\nconst sv=(u,n)=>u>=2**(n-1)?u-2**n:u; // signed value of n-bit pattern\nconst T={\n fr:{h1:'Le train des bits',\n  sub:{as:'La multiplication add-shift, case par case. Avance avec \u00ab \u00c9tape suivante \u00bb et regarde les chiffres bouger.',bo:'L\u2019algorithme de Booth, case par case. M\u00eame train, mais on regarde 2 cases et on recopie le signe.'},\n  lN:'Bits',lM:'M (1er nombre)',lQ:'Q (2e nombre)',next:'\u00c9tape suivante \u25b6',auto:'\u25b6 Auto',stop:'\u275a\u275a Pause',reset:'Recommencer',\n  mside:'M reste \u00e0 c\u00f4t\u00e9 :',mneg:'et \u2212M (compl\u00e9ment \u00e0 2 de M) :',tour:(i,n)=>`Tour ${i} sur ${n}`,ptr:'on regarde ici',ptr2:'on regarde ces 2 cases',\n  recipe:{as:[['1 \u00b7 Ranger','C = 0, A = 0000 (vide), Q = le 2e nombre. M reste \u00e0 c\u00f4t\u00e9.'],['2 \u00b7 Regarder','La derni\u00e8re case \u00e0 droite. Si c\u2019est 1 : A = A + M. Si c\u2019est 0 : rien.'],['3 \u00b7 D\u00e9caler','Tout le train avance d\u2019une case \u00e0 droite. Le dernier chiffre tombe, un 0 entre \u00e0 gauche.'],['4 \u00b7 R\u00e9p\u00e9ter','4 tours (4 bits). R\u00e9sultat = A et Q coll\u00e9s.']],\n          bo:[['1 \u00b7 Ranger','A = 0 (vide), Q = le 2e nombre, Q\u22121 = 0 (une case en plus). M et \u2212M restent \u00e0 c\u00f4t\u00e9.'],['2 \u00b7 Regarder 2 cases','Q0 et Q\u22121. \u00ab 1 0 \u00bb : A = A \u2212 M. \u00ab 0 1 \u00bb : A = A + M. \u00ab 0 0 \u00bb ou \u00ab 1 1 \u00bb : rien.'],['3 \u00b7 D\u00e9caler','Tout le train avance d\u2019une case \u00e0 droite. Le dernier chiffre tombe, et le 1er chiffre de A est recopi\u00e9 \u00e0 gauche.'],['4 \u00b7 R\u00e9p\u00e9ter','Autant de tours que de bits. R\u00e9sultat = A et Q coll\u00e9s.']]},\n  th:{as:['\u00c9tape','C','A','Q','Ce qui se passe'],bo:['\u00c9tape','A','Q','Q\u22121','Ce qui se passe']},\n  start:{as:(f)=>`On range les nombres. <b>A = 0000<\/b> (vide, le r\u00e9sultat va s\u2019y construire), <b>Q = ${f.Qn} = ${bn(f.Qn,4)}<\/b>, et <b>M = ${f.M} = ${bn(f.M,4)}<\/b> reste \u00e0 c\u00f4t\u00e9.`,\n         bo:(f)=>`On range les nombres. <b>A = ${bn(0,f.n)}<\/b> (vide), <b>Q = ${f.Qn} = ${bn(f.Qn,f.n)}<\/b>, et une case en plus <b>Q\u22121 = 0<\/b>. M = ${bn(f.M,f.n)} et \u2212M = ${bn(-f.M,f.n)} restent \u00e0 c\u00f4t\u00e9.`},\n  look1:i=>`<b>Tour ${i}.<\/b> On regarde la derni\u00e8re case (Q0) : c\u2019est <b>1<\/b>. Donc on va ajouter M dans A.`,\n  look0:i=>`<b>Tour ${i}.<\/b> On regarde la derni\u00e8re case (Q0) : c\u2019est <b>0<\/b>. Donc on n\u2019ajoute rien.`,\n  lookB:(i,a,b)=>`<b>Tour ${i}.<\/b> On regarde les 2 derni\u00e8res cases : Q0 = <b>${a}<\/b> et Q\u22121 = <b>${b}<\/b>, donc \u00ab ${a} ${b} \u00bb. `+({'10':'R\u00e8gle : <b>on soustrait M<\/b> (A = A \u2212 M).','01':'R\u00e8gle : <b>on ajoute M<\/b> (A = A + M).','00':'R\u00e8gle : <b>on ne fait rien<\/b>.','11':'R\u00e8gle : <b>on ne fait rien<\/b>.'})[''+a+b],\n  add:(f)=>`A + M = ${bn(f.a0,4)} + ${bn(f.M,4)} = <b>${bn(f.A,4)}<\/b>${f.C?' et une retenue va dans C':''}. Les chiffres verts ont chang\u00e9.`,\n  addB:(f)=>`A + M = ${bn(f.a0,f.n)} + ${bn(f.M,f.n)} = <b>${bn(f.A,f.n)}<\/b>. Si une retenue sort \u00e0 gauche, on l\u2019ignore.`,\n  subB:(f)=>`A \u2212 M, c\u2019est A + (\u2212M) = ${bn(f.a0,f.n)} + ${bn(-f.M,f.n)} = <b>${bn(f.A,f.n)}<\/b>. Si une retenue sort \u00e0 gauche, on l\u2019ignore.`,\n  shift:{as:'<b>On d\u00e9cale :<\/b> chaque chiffre avance d\u2019une case vers la droite. Le dernier chiffre tombe, un 0 entre \u00e0 gauche.',\n         bo:'<b>On d\u00e9cale :<\/b> chaque chiffre avance d\u2019une case vers la droite. Le dernier chiffre tombe, et <b>le 1er chiffre de A est recopi\u00e9<\/b> \u00e0 gauche (au lieu d\u2019un 0).'},\n  end:(A,Q,P,M,Qn,n)=>`Fini apr\u00e8s ${n} tours. On colle A et Q : <b>${A} ${Q} = ${P}<\/b>. V\u00e9rification : ${M} \u00d7 ${Qn} = ${M*Qn}.`,\n  hs:'d\u00e9part',hl:'regarder',ha:'A = A + M',hsu:'A = A \u2212 M',hsh:'d\u00e9calage',\n  howT:'Le d\u00e9calage en 4 actions',\n  howS:{as:['1 \u00b7 \u00c9crire les 9 chiffres \u00e0 la suite (C, puis A, puis Q)','2 \u00b7 Enlever le dernier chiffre \u00e0 droite','3 \u00b7 Ajouter un 0 au d\u00e9but','4 \u00b7 Red\u00e9couper : 1 chiffre pour C, 4 pour A, 4 pour Q'],\n        bo:n=>[`1 \u00b7 \u00c9crire les ${2*n+1} chiffres \u00e0 la suite (A, puis Q, puis Q\u22121)`,'2 \u00b7 Enlever le dernier chiffre \u00e0 droite','3 \u00b7 Recopier le 1er chiffre au d\u00e9but',`4 \u00b7 Red\u00e9couper : ${n} pour A, ${n} pour Q, 1 pour Q\u22121`]},\n  howN:['chiffres','il en reste','de nouveau'],\n  why:'Pourquoi recopier le 1er chiffre ? C\u2019est le bit de signe (1 = n\u00e9gatif). En le recopiant, un nombre n\u00e9gatif reste n\u00e9gatif quand on le divise par 2.',\n  letT:'Le d\u00e9calage avec des lettres',\n  let:{as:['A B C D E F G H I','0 A B C D E F G H','Toutes les lettres glissent d\u2019une place vers la droite. Le I sort, un 0 entre au d\u00e9but. Avec les chiffres, c\u2019est pareil : le dernier chiffre de A passe au d\u00e9but de Q.'],\n       bo:['A B C D E F G H I','A A B C D E F G H','Toutes les lettres glissent d\u2019une place vers la droite. Le I sort, et la 1re lettre (A) est recopi\u00e9e au d\u00e9but. Avec les chiffres, c\u2019est pareil : le bit de signe est recopi\u00e9.']}},\n en:{h1:'The bit train',\n  sub:{as:'Add-shift multiplication, box by box. Press \"Next step\" and watch the bits move.',bo:'Booth\u2019s algorithm, box by box. Same train, but we look at 2 boxes and copy the sign.'},\n  lN:'Bits',lM:'M (1st number)',lQ:'Q (2nd number)',next:'Next step \u25b6',auto:'\u25b6 Auto',stop:'\u275a\u275a Pause',reset:'Restart',\n  mside:'M waits on the side:',mneg:'and \u2212M (two\u2019s complement of M):',tour:(i,n)=>`Round ${i} of ${n}`,ptr:'look here',ptr2:'look at these 2 boxes',\n  recipe:{as:[['1 \u00b7 Set up','C = 0, A = 0000 (empty), Q = the 2nd number. M waits on the side.'],['2 \u00b7 Look','At the last box on the right. If it is 1: A = A + M. If it is 0: nothing.'],['3 \u00b7 Shift','The whole train moves one box to the right. The last bit falls off, a 0 enters on the left.'],['4 \u00b7 Repeat','4 rounds (4 bits). Result = A and Q together.']],\n          bo:[['1 \u00b7 Set up','A = 0 (empty), Q = the 2nd number, Q\u22121 = 0 (one extra box). M and \u2212M wait on the side.'],['2 \u00b7 Look at 2 boxes','Q0 and Q\u22121. \u201c1 0\u201d: A = A \u2212 M. \u201c0 1\u201d: A = A + M. \u201c0 0\u201d or \u201c1 1\u201d: nothing.'],['3 \u00b7 Shift','The whole train moves one box to the right. The last bit falls off, and the 1st bit of A is copied on the left.'],['4 \u00b7 Repeat','As many rounds as bits. Result = A and Q together.']]},\n  th:{as:['Step','C','A','Q','What happens'],bo:['Step','A','Q','Q\u22121','What happens']},\n  start:{as:(f)=>`Set up the numbers. <b>A = 0000<\/b> (empty, the result is built here), <b>Q = ${f.Qn} = ${bn(f.Qn,4)}<\/b>, and <b>M = ${f.M} = ${bn(f.M,4)}<\/b> waits on the side.`,\n         bo:(f)=>`Set up the numbers. <b>A = ${bn(0,f.n)}<\/b> (empty), <b>Q = ${f.Qn} = ${bn(f.Qn,f.n)}<\/b>, and one extra box <b>Q\u22121 = 0<\/b>. M = ${bn(f.M,f.n)} and \u2212M = ${bn(-f.M,f.n)} wait on the side.`},\n  look1:i=>`<b>Round ${i}.<\/b> Look at the last box (Q0): it is <b>1<\/b>. So we add M into A.`,\n  look0:i=>`<b>Round ${i}.<\/b> Look at the last box (Q0): it is <b>0<\/b>. So we add nothing.`,\n  lookB:(i,a,b)=>`<b>Round ${i}.<\/b> Look at the last 2 boxes: Q0 = <b>${a}<\/b> and Q\u22121 = <b>${b}<\/b>, so \u201c${a} ${b}\u201d. `+({'10':'Rule: <b>subtract M<\/b> (A = A \u2212 M).','01':'Rule: <b>add M<\/b> (A = A + M).','00':'Rule: <b>do nothing<\/b>.','11':'Rule: <b>do nothing<\/b>.'})[''+a+b],\n  add:(f)=>`A + M = ${bn(f.a0,4)} + ${bn(f.M,4)} = <b>${bn(f.A,4)}<\/b>${f.C?', and a carry goes into C':''}. Green bits changed.`,\n  addB:(f)=>`A + M = ${bn(f.a0,f.n)} + ${bn(f.M,f.n)} = <b>${bn(f.A,f.n)}<\/b>. A carry out of the left is ignored.`,\n  subB:(f)=>`A \u2212 M is A + (\u2212M) = ${bn(f.a0,f.n)} + ${bn(-f.M,f.n)} = <b>${bn(f.A,f.n)}<\/b>. A carry out of the left is ignored.`,\n  shift:{as:'<b>Shift:<\/b> every bit moves one box to the right. The last bit falls off, a 0 enters on the left.',\n         bo:'<b>Shift:<\/b> every bit moves one box to the right. The last bit falls off, and <b>the 1st bit of A is copied<\/b> on the left (not a 0).'},\n  end:(A,Q,P,M,Qn,n)=>`Done after ${n} rounds. Put A and Q together: <b>${A} ${Q} = ${P}<\/b>. Check: ${M} \u00d7 ${Qn} = ${M*Qn}.`,\n  hs:'start',hl:'look',ha:'A = A + M',hsu:'A = A \u2212 M',hsh:'shift',\n  howT:'The shift in 4 actions',\n  howS:{as:['1 \u00b7 Write the 9 bits in a row (C, then A, then Q)','2 \u00b7 Remove the last bit on the right','3 \u00b7 Add a 0 at the start','4 \u00b7 Cut again: 1 bit for C, 4 for A, 4 for Q'],\n        bo:n=>[`1 \u00b7 Write the ${2*n+1} bits in a row (A, then Q, then Q\u22121)`,'2 \u00b7 Remove the last bit on the right','3 \u00b7 Copy the 1st bit at the start',`4 \u00b7 Cut again: ${n} for A, ${n} for Q, 1 for Q\u22121`]},\n  howN:['bits','left','again'],\n  why:'Why copy the 1st bit? It is the sign bit (1 = negative). Copying it keeps a negative number negative when it is halved.',\n  letT:'The shift with letters',\n  let:{as:['A B C D E F G H I','0 A B C D E F G H','Every letter slides one place to the right. The I falls off, a 0 comes in at the start. With bits it is the same: the last bit of A moves to the start of Q.'],\n       bo:['A B C D E F G H I','A A B C D E F G H','Every letter slides one place to the right. The I falls off, and the 1st letter (A) is copied at the start. With bits it is the same: the sign bit is copied.']}}\n};\nlet F=[],k=0,timer=null,busy=false,N=4;\nfunction fillSelects(){\n  const sM=$('#selM'),sQ=$('#selQ');sM.innerHTML='';sQ.innerHTML='';\n  if(MODE==='as'){for(let i=1;i<=15;i++){sM.add(new Option(`${i} = ${bn(i,4)}`,i));sQ.add(new Option(`${i} = ${bn(i,4)}`,i))}sM.value=5;sQ.value=3}\n  else{const h=2**(N-1);for(let i=-(h-1);i<=h-1;i++)sM.add(new Option(`${i} = ${bn(i,N)}`,i));for(let i=-h;i<=h-1;i++)sQ.add(new Option(`${i} = ${bn(i,N)}`,i));sM.value=3;sQ.value=N===4?5:13}\n}\n// ---------- frames ----------\nfunction build(){const M=+$('#selM').value,Qn=+$('#selQ').value;F=[];\n  if(MODE==='as'){let C=0,A=0,Q=Qn;const base={M,Qn,n:4};F.push({...base,kind:'start',C,A,Q});\n    for(let i=1;i<=4;i++){const q0=Q&1;F.push({...base,kind:'look',i,q0,C,A,Q});\n      if(q0){const s=A+M,a0=A;C=s>>4;A=s&15;F.push({...base,kind:'add',i,a0,C,A,Q})}\n      const all=(C<<8)|(A<<4)|Q,m=all>>1;C=(m>>8)&1;A=(m>>4)&15;Q=m&15;F.push({...base,kind:'shift',i,C,A,Q})}\n    F.push({...base,kind:'end',C,A,Q});}\n  else{const n=N,mask=2**n-1;let A=0,Q=Qn&mask,q1=0;const base={M,Qn,n};F.push({...base,kind:'start',A,Q,q1});\n    for(let i=1;i<=n;i++){const q0=Q&1;F.push({...base,kind:'look',i,q0,q1v:q1,A,Q,q1});\n      if(q0===1&&q1===0){const a0=A;A=(A-M+2**n*4)&mask;F.push({...base,kind:'sub',i,a0,A,Q,q1})}\n      else if(q0===0&&q1===1){const a0=A;A=(A+M+2**n*4)&mask;F.push({...base,kind:'addB',i,a0,A,Q,q1})}\n      const sign=A>>(n-1);q1=Q&1;Q=(Q>>1)|((A&1)<<(n-1));A=(A>>1)|(sign<<(n-1));F.push({...base,kind:'shift',i,A,Q,q1})}\n    F.push({...base,kind:'end',A,Q,q1});}\n  k=0;}\nfunction groups(){return MODE==='as'?[['C','c',1],['A','a',4],['Q','q',4]]:[['A','a',N],['Q','q',N],['Q\u22121','c',1]]}\nfunction bits(f){return MODE==='as'?[f.C,...bn(f.A,4),...bn(f.Q,4)].map(String):[...bn(f.A,f.n),...bn(f.Q,f.n),f.q1].map(String)}\nfunction cellW(){const total=groups().reduce((s,g)=>s+g[2],0),avail=Math.min($('.stage').clientWidth-40,1000);return Math.max(26,Math.min(72,Math.floor((avail-(total-1)*8)/total)))}\nfunction drawTrain(f,opt={}){const t=T[L],tr=$('#train'),bs=bits(f),G=groups(),total=bs.length;\n  tr.style.gridTemplateColumns=`repeat(${total},var(--w))`;tr.style.setProperty('--w',cellW()+'px');\n  let h=G.map(([l,c,s])=>`<div class=\"lab ${c}\" style=\"grid-column:span ${s}\">${l}<\/div>`).join('');\n  const gOf=i=>{let x=0;for(const g of G){if(i<x+g[2])return g[1];x+=g[2]}};\n  const aStart=MODE==='as'?1:0,aEnd=aStart+(MODE==='as'?4:N);\n  const lookIdx=f.kind==='look'?(MODE==='as'?[total-1]:[total-2,total-1]):[];\n  const changed=i=>(f.kind==='add'||f.kind==='sub'||f.kind==='addB')&&i>=aStart&&i<aEnd&&bn(f.a0,f.n)[i-aStart]!==bn(f.A,f.n)[i-aStart];\n  bs.forEach((b,i)=>{h+=`<div class=\"cell ${gOf(i)}${lookIdx.includes(i)?' look':''}\" style=\"grid-row:2\"><span class=\"bit${changed(i)?' chg':''}${opt.pop&&i===0?' pop':''}\" id=\"b${i}\">${b}<\/span><\/div>`});\n  const pc=MODE==='as'?`${total} / span 1`:`${total-1} / span 2`;\n  h+=`<div class=\"ptr\" style=\"grid-row:3;grid-column:${pc}\"><b>\u2191<\/b>${MODE==='as'?t.ptr:t.ptr2}<\/div>`;\n  tr.innerHTML=h;}\nfunction render(anim){const f=F[k],t=T[L],n=f.n;\n  $('#mrow').innerHTML=`<span>${t.mside}<\/span><span class=\"mbits\">${bn(f.M,n)}<\/span>${MODE==='bo'?`<span>${t.mneg}<\/span><span class=\"mbits neg\">${bn(-f.M,n)}<\/span>`:''}<span class=\"tour\">${f.i?t.tour(f.i,MODE==='as'?4:n):''}<\/span>`;\n  // rules table (Booth, look step)\n  const r=$('#rules');\n  if(MODE==='bo'&&f.kind==='look'){const key=''+f.q0+f.q1v;r.hidden=false;\n    r.innerHTML=`<tr><th>Q0 Q\u22121<\/th><th>${L==='fr'?'action':'action'}<\/th><\/tr>`+[['1 0','A = A \u2212 M'],['0 1','A = A + M'],['0 0',L==='fr'?'rien':'nothing'],['1 1',L==='fr'?'rien':'nothing']].map(([a,b])=>`<tr class=\"${a.replace(' ','')===key?'on':''}\"><td>${a}<\/td><td>${b}<\/td><\/tr>`).join('')}else r.hidden=true;\n  const s=$('#sum');\n  if(f.kind==='add'){s.hidden=false;s.innerHTML=`  A   ${bn(f.a0,4)}\\n<span class=\"m\">+ M   ${bn(f.M,4)}<\/span>\\n= A ${f.C?'1':' '} ${bn(f.A,4)}`}\n  else if(f.kind==='addB'){s.hidden=false;s.innerHTML=`   A  ${bn(f.a0,n)}\\n<span class=\"m\">+  M  ${bn(f.M,n)}<\/span>\\n=  A  ${bn(f.A,n)}`}\n  else if(f.kind==='sub'){s.hidden=false;s.innerHTML=`   A  ${bn(f.a0,n)}\\n<span class=\"n\">+ \u2212M  ${bn(-f.M,n)}<\/span>\\n=  A  ${bn(f.A,n)}`}\n  else s.hidden=true;\n  const P=MODE==='as'?(f.A<<4)|f.Q:sv(f.A*2**n+f.Q,2*n);\n  $('#say').innerHTML=f.kind==='start'?t.start[MODE](f):f.kind==='look'?(MODE==='as'?(f.q0?t.look1(f.i):t.look0(f.i)):t.lookB(f.i,f.q0,f.q1v)):f.kind==='add'?t.add(f):f.kind==='addB'?t.addB(f):f.kind==='sub'?t.subB(f):f.kind==='shift'?t.shift[MODE]:t.end(bn(f.A,n),bn(f.Q,n),P,f.M,f.Qn,MODE==='as'?4:n);\n  const hw=$('#how4');\n  if(f.kind==='shift'){const prev=bits(F[k-1]).join(''),tot=prev.length,keep=prev.slice(0,tot-1),first=MODE==='as'?'0':prev[0],now=first+keep,steps=MODE==='as'?t.howS.as:t.howS.bo(n);\n    const cut=MODE==='as'?`<i>${now[0]}<\/i> | <u>${now.slice(1,5)}<\/u> | ${now.slice(5)} &nbsp;\u2192 C = ${f.C}, A = ${bn(f.A,4)}, Q = ${bn(f.Q,4)}`:`<u>${now.slice(0,n)}<\/u> | ${now.slice(n,2*n)} | ${now.slice(2*n)} &nbsp;\u2192 A = ${bn(f.A,n)}, Q = ${bn(f.Q,n)}, Q\u22121 = ${f.q1}`;\n    const g=MODE==='as'?`${prev[0]} ${prev.slice(1,5)} ${prev.slice(5)}`:`${prev.slice(0,n)} ${prev.slice(n,2*n)} ${prev.slice(2*n)}`;\n    hw.hidden=false;hw.innerHTML=`<h3>${t.howT}<\/h3>\n    <div class=\"st\"><span>${steps[0]}<\/span><code>${g} \u2192 ${prev} <small>(${tot} ${t.howN[0]})<\/small><\/code><\/div>\n    <div class=\"st\"><span>${steps[1]}<\/span><code>${keep}<s>${prev[tot-1]}<\/s> \u2192 ${keep} <small>(${t.howN[1]} ${tot-1})<\/small><\/code><\/div>\n    <div class=\"st\"><span>${steps[2]}<\/span><code><i>${first}<\/i>${keep} <small>(${t.howN[2]} ${tot})<\/small><\/code><\/div>\n    <div class=\"st\"><span>${steps[3]}<\/span><code>${cut}<\/code><\/div>`+(MODE==='bo'?`<p class=\"why\">${t.why}<\/p>`:'');}\n  else hw.hidden=true;\n  if(anim&&f.kind==='shift'){busy=true;const prev=F[k-1];drawTrain({...prev,kind:'x'});const tot=bits(prev).length 100%;font-family:var(--mono);letter-spacing:.05em}\n.fieldrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:8px;align-items:center}\n@media (max-width:560px){.fieldrow{grid-template-columns:minmax(0,1fr)}}\n.mono-in{padding:8px 11px;border-radius:9px;border:2px solid var(--line);background:var(--panel);font-family:var(--mono);width:100%}\n.mono-in.good{border-color:var(--ok);background:var(--ok-s)} .mono-in.bad{border-color:var(--bad);background:var(--bad-s)}\n.steps2{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}\n.steps2 li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}\n.steps2 li::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font:600 .95rem var(--display)}\n.steps2 .ln{font:600 .78rem var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}\n.steps2 .mono{font-size:1.1rem;font-weight:600}\n.code{font:400 .95rem/1.6 var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 0;max-height:420px;overflow:auto}\n.code div{padding:0 12px;white-space:pre}\n.code div.cur{background:var(--on-s);font-weight:700}\n.code div.lbl{color:var(--accent)}\n.code span.c{color:var(--muted)}\ntable.t tr.top td{background:var(--on-s)}\ntable.t td.empty{color:var(--muted)}\n#memv label{display:flex;gap:6px;align-items:center;font-family:var(--mono)}\n#memv input{width:6.5em}\n<\/style>\n<div class=\"wrap\">\n  <header>\n    <h1>Floating Point Step by Step<\/h1>\n    <p class=\"lead\">Lecture 12, Floating Point Data: how a computer stores numbers like \u221212.4375 or 0.1, how it adds and multiplies them, and how the FPU stack works. One small action at a time, with the bits filling up as you go, and the way to write it on your exam paper.<\/p>\n  <\/header>\n  <nav class=\"tabs\" role=\"tablist\" aria-label=\"Parts\" id=\"tabs\"><\/nav>\n\n  <section id=\"p1\" class=\"wrap\" style=\"gap:16px\">\n    <div class=\"card\">\n      <h2>The idea: scientific notation, but in binary<\/h2>\n      <div class=\"life\"><b>Real life<\/b>Your phone shows the distance to the Sun as <span class=\"mono\">1.496 \u00d7 10\u2078 km<\/span> instead of 149 600 000. We keep only three things: the <b>sign<\/b> (+), the <b>digits<\/b> (1.496) and the <b>power<\/b> (8). A computer does the same, but in base 2: <span class=\"mono\">1.something \u00d7 2^power<\/span>.<\/div>\n      <div class=\"three\"><div class=\"sg\"><b>Sign \u00b7 1 bit<\/b>0 = positive<br>1 = negative<\/div><div class=\"ex\"><b>Exponent \u00b7 8 bits<\/b>the power of 2, plus 127 (the \u201cbias\u201d), so it is never negative<\/div><div class=\"mn\"><b>Mantissa \u00b7 23 bits<\/b>the bits after \u201c1.\u201d (the first 1 is not stored: it is always there)<\/div><\/div>\n      <div class=\"scroll\"><table class=\"t\"><tr><th>Format (lecture name)<\/th><th>Total<\/th><th>Sign<\/th><th>Exponent<\/th><th>Bias<\/th><th>Significand<\/th><th>Assembly<\/th><\/tr>\n        <tr><td>Short \u00b7 single precision<\/td><td>32<\/td><td>1<\/td><td>8<\/td><td>127<\/td><td>23 (the 1 is implied)<\/td><td><code>dd<\/code><\/td><\/tr>\n        <tr><td>Long \u00b7 double precision<\/td><td>64<\/td><td>1<\/td><td>11<\/td><td>1023<\/td><td>52 (the 1 is implied)<\/td><td><code>dq<\/code><\/td><\/tr>\n        <tr><td>Extended precision<\/td><td>80<\/td><td>1<\/td><td>15<\/td><td>16383<\/td><td>64 (the 1 is written)<\/td><td><code>dt<\/code><\/td><\/tr><\/table><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h2>Normalised or not?<\/h2>\n      <p class=\"muted\">Normalised means: the significand is at least 1 and smaller than the radix (10 in decimal, 2 in binary), and the exponent is a whole number. Like a price tag: \u201cRM 1.50\u201d is clear, \u201cRM 0.0150 \u00d7 10\u00b2\u201d is the same money written badly.<\/p>\n      <p class=\"big\" id=\"nQ\"><\/p>\n      <div class=\"row\"><button class=\"btn\" data-nq=\"yes\">Normalised<\/button><button class=\"btn ghost\" data-nq=\"no\">Not normalised<\/button><button class=\"btn ghost sm\" id=\"nNext\">Next one<\/button><\/div>\n      <p class=\"fb\" id=\"nFb\"><\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2>The biased exponent in one picture<\/h2>\n      <p class=\"muted\">The 8-bit exponent field holds 0 \u2026 255. We subtract 127 to get the real power. Move the slider.<\/p>\n      <div class=\"row\"><label for=\"bias\" class=\"muted\">Stored exponent<\/label><input type=\"range\" id=\"bias\" min=\"1\" max=\"254\" value=\"135\" style=\"flex:1;min-width:160px\"><\/div>\n      <p class=\"big\" id=\"biasOut\"><\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2>Why your calculator app says 0.1 + 0.2 = 0.30000000000000004<\/h2>\n      <p>This page just asked your browser to compute <span class=\"mono\">0.1 + 0.2<\/span>. The answer is:<\/p>\n      <p class=\"big\" id=\"pt3\"><\/p>\n      <div class=\"actbox\"><b>Why?<\/b><ol><li>In decimal, 1/3 = 0.3333\u2026 never ends. In binary, <b>0.1<\/b> never ends: 0.0001100110011\u2026<\/li><li>The computer must cut it after 23 (or 52) bits, so it stores a number very close to 0.1, not exactly 0.1.<\/li><li>The tiny errors of 0.1 and 0.2 add up and become visible. Try 0.1 in the next tab and look at step 3.<\/li><\/ol><\/div>\n    <\/div>\n    <div class=\"cheat\"><b>Remember: decimal \u2192 IEEE 754 in 6 steps<\/b><ol><li><b>Sign<\/b>: + \u2192 0, \u2212 \u2192 1.<\/li><li><b>Binary<\/b>: integer part \u00f7 2 (read the remainders bottom-up), fraction part \u00d7 2 (read the 1s top-down).<\/li><li><b>Normalise<\/b>: move the point until only one 1 is in front: 1.xxxx \u00d7 2^e. Left = +e, right = \u2212e.<\/li><li><b>Exponent<\/b>: e + 127 \u2192 8 bits.<\/li><li><b>Mantissa<\/b>: the bits after the point, padded with 0s to 23 bits.<\/li><li><b>Assemble<\/b>: sign | exponent | mantissa, then group by 4 for hex.<\/li><\/ol><\/div>\n  <\/section>\n\n  <section id=\"p2\" class=\"wrap\" style=\"gap:16px\" hidden>\n    <div class=\"card\">\n      <h2>Decimal \u2192 IEEE 754<\/h2>\n      <div class=\"row\"><label for=\"dIn\" class=\"muted\">Your number<\/label><input type=\"text\" id=\"dIn\" class=\"mono-in\" style=\"width:10em\" value=\"-12.4375\"><button class=\"btn\" id=\"dGo\">Start<\/button><span class=\"muted\">Try:<\/span><span class=\"chips\" id=\"dEx\"><\/span><\/div>\n      <div class=\"row\"><div class=\"chips\" role=\"group\" aria-label=\"Format\"><button data-w=\"32\" aria-pressed=\"true\">Short (32)<\/button><button data-w=\"64\" aria-pressed=\"false\">Long (64)<\/button><button data-w=\"80\" aria-pressed=\"false\">Extended (80)<\/button><\/div><\/div>\n      <p class=\"fb no\" id=\"dErr\"><\/p>\n    <\/div>\n    <div class=\"card lesson\" id=\"dCard\">\n      <div class=\"row\" style=\"justify-content:space-between\"><span class=\"stepn\" id=\"dStepT\"><\/span><span class=\"muted\" id=\"dStepN\"><\/span><\/div>\n      <h2 id=\"dTitle\"><\/h2>\n      <div id=\"dView\"><\/div>\n      <div class=\"actbox\" id=\"dAct\"><\/div>\n      <div class=\"strip\" id=\"dStrip\"><\/div>\n      <div class=\"row\"><button class=\"btn ghost\" id=\"dBack\">\u25c0 Back<\/button><button class=\"btn\" id=\"dNext\">Next \u25b6<\/button><\/div>\n    <\/div>\n    <div class=\"card\"><div class=\"row\" style=\"justify-content:space-between\"><h2>\u270d On your exam paper<\/h2><button class=\"btn ghost sm\" id=\"dPBtn\">Show the model answer<\/button><\/div><div class=\"paper\" id=\"dPaper\" hidden><\/div><\/div>\n  <\/section>\n\n  <section id=\"p3\" class=\"wrap\" style=\"gap:16px\" hidden>\n    <div class=\"card\">\n      <h2>IEEE 754 \u2192 decimal<\/h2>\n      <div class=\"row\"><label for=\"bIn\" class=\"muted\">Hex: 8 digits (short), 16 (long) or 20 (extended)<\/label><input type=\"text\" id=\"bIn\" class=\"mono-in\" style=\"width:min(100%,24em)\" value=\"C1470000\"><button class=\"btn\" id=\"bGo\">Start<\/button><\/div>\n      <div class=\"row\"><span class=\"muted\">Try:<\/span><span class=\"chips\" id=\"bEx\"><\/span><\/div>\n      <p class=\"fb no\" id=\"bErr\"><\/p>\n    <\/div>\n    <div class=\"card lesson\">\n      <div class=\"row\" style=\"justify-content:space-between\"><span class=\"stepn\" id=\"bStepT\"><\/span><span class=\"muted\" id=\"bStepN\"><\/span><\/div>\n      <h2 id=\"bTitle\"><\/h2>\n      <div id=\"bView\"><\/div>\n      <div class=\"actbox\" id=\"bAct\"><\/div>\n      <div class=\"strip\" id=\"bStrip\"><\/div>\n      <div class=\"row\"><button class=\"btn ghost\" id=\"bBack\">\u25c0 Back<\/button><button class=\"btn\" id=\"bNext\">Next \u25b6<\/button><\/div>\n    <\/div>\n    <div class=\"card\"><div class=\"row\" style=\"justify-content:space-between\"><h2>\u270d On your exam paper<\/h2><button class=\"btn ghost sm\" id=\"bPBtn\">Show the model answer<\/button><\/div><div class=\"paper\" id=\"bPaper\" hidden><\/div><\/div>\n  <\/section>\n\n\n  <section id=\"p5\" class=\"wrap\" style=\"gap:16px\" hidden>\n    <div class=\"card\">\n      <h2>Floating point operations, step by step<\/h2>\n      <div class=\"life\"><b>Real life<\/b>Adding money in different units: RM 2.34 thousand + RM 880 = RM 2.34 thousand + RM 0.88 thousand. First write both in the same unit (same exponent), then add.<\/div>\n      <div class=\"row\"><input type=\"text\" id=\"oA\" class=\"mono-in\" style=\"width:7em\" value=\"2.34\" aria-label=\"first significand\"><span>\u00d7 10^<\/span><input type=\"number\" id=\"oAe\" class=\"mono-in\" style=\"width:5em\" value=\"3\" aria-label=\"first exponent\">\n        <select id=\"oOp\" aria-label=\"operation\"><option>+<\/option><option>\u2212<\/option><option>\u00d7<\/option><option>\u00f7<\/option><\/select>\n        <input type=\"text\" id=\"oB\" class=\"mono-in\" style=\"width:7em\" value=\"0.88\" aria-label=\"second significand\"><span>\u00d7 10^<\/span><input type=\"number\" id=\"oBe\" class=\"mono-in\" style=\"width:5em\" value=\"3\" aria-label=\"second exponent\"><button class=\"btn\" id=\"oGo\">Go<\/button><\/div>\n      <div class=\"row\"><span class=\"muted\">Lecture examples:<\/span><span class=\"chips\" id=\"oEx\"><\/span><\/div>\n      <ol class=\"steps2\" id=\"oSteps\"><\/ol>\n      <div class=\"cheat\"><b>Remember<\/b><ol><li><b>+ and \u2212<\/b>: align (same exponent) \u2192 add or subtract \u2192 normalise.<\/li><li><b>\u00d7<\/b>: multiply the significands, <b>add<\/b> the exponents \u2192 normalise. No alignment.<\/li><li><b>\u00f7<\/b>: divide the significands, <b>subtract<\/b> the exponents \u2192 normalise. No remainder.<\/li><li>Possible errors: overflow, underflow, inexact result (and divide by zero).<\/li><\/ol><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h2>Remainder: s REM t = s \u2212 t \u00d7 NINT(s / t)<\/h2>\n      <p class=\"muted\">NINT = round to the nearest integer. The result can be negative.<\/p>\n      <div class=\"row\"><input type=\"text\" id=\"rS\" class=\"mono-in\" style=\"width:7em\" value=\"17\" aria-label=\"s\"><span>REM<\/span><input type=\"text\" id=\"rT\" class=\"mono-in\" style=\"width:7em\" value=\"5\" aria-label=\"t\"><button class=\"btn\" id=\"rGo\">Compute<\/button><\/div>\n      <div class=\"actbox\" id=\"rOut\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"p6\" class=\"wrap\" style=\"gap:16px\" hidden>\n    <div class=\"card\">\n      <h2>The FPU stack: ST(0) \u2026 ST(7)<\/h2>\n      <div class=\"life\"><b>Real life<\/b>A stack of plates at the canteen: you put a plate on top (<code>fld<\/code> = push) and you take the top plate (<code>fstp<\/code> = pop). Operations always use the plates on top: ST(0) is the top.<\/div>\n      <div class=\"grid2\">\n        <div>\n          <h3 style=\"margin-bottom:6px\">Data registers and tags<\/h3>\n          <div class=\"scroll\"><table class=\"t\" id=\"stk\"><\/table><\/div>\n          <p class=\"muted\" style=\"font-size:.9rem\">Tag: 00 valid \u00b7 01 zero \u00b7 10 invalid (\u221e or NaN) \u00b7 11 empty<\/p>\n          <h3 style=\"margin:10px 0 6px\">Memory<\/h3>\n          <div class=\"row\" id=\"memv\"><\/div>\n        <\/div>\n        <div style=\"display:flex;flex-direction:column;gap:10px;min-width:0\">\n          <div class=\"chips\" role=\"group\" aria-label=\"Mode\"><button data-fm=\"prog\" aria-pressed=\"true\">Lecture program: square root<\/button><button data-fm=\"free\" aria-pressed=\"false\">Free play<\/button><\/div>\n          <div id=\"fProg\"><div class=\"code\" id=\"prog\"><\/div><div class=\"row\" style=\"margin-top:8px\"><button class=\"btn ghost\" id=\"fReset\">Reset<\/button><button class=\"btn\" id=\"fStep\">Next instruction \u25b6<\/button><button class=\"btn ghost\" id=\"fRun\">Run to the end<\/button><\/div><\/div>\n          <div id=\"fFree\" hidden><div class=\"row\" id=\"fBtns\"><\/div><\/div>\n          <div class=\"actbox\" id=\"fAct\"><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n  <section id=\"p4\" class=\"wrap\" style=\"gap:16px\" hidden>\n    <div class=\"card\">\n      <h2>Practice like in the exam<\/h2>\n      <div class=\"row\"><div class=\"chips\" role=\"group\" aria-label=\"Direction\"><button data-pd=\"enc\" aria-pressed=\"true\">Decimal \u2192 IEEE<\/button><button data-pd=\"dec\" aria-pressed=\"false\">IEEE \u2192 decimal<\/button><\/div><button class=\"btn ghost\" id=\"pNew\">New question<\/button><\/div>\n      <p class=\"big\" id=\"pQ\"><\/p>\n      <div id=\"pForm\"><\/div>\n      <div class=\"row\"><button class=\"btn\" id=\"pCheck\">Check<\/button><button class=\"btn ghost\" id=\"pSolve\">See it step by step<\/button><span class=\"fb\" id=\"pFb\"><\/span><\/div>\n    <\/div>\n  <\/section>\n  <p class=\"muted\" style=\"font-size:.9rem\">Every answer on this page is computed exactly and checked against your computer\u2019s own float encoding.<\/p>\n<\/div>\n<script>\nconst FMT={32:{e:8,m:23,bias:127,name:'short'},64:{e:11,m:52,bias:1023,name:'long'},80:{e:15,m:64,bias:16383,name:'extended',explicit:true}};\nfunction parseDec(str){const s=String(str).trim().replace(/,/g,'.');const m=s.match(/^([+-]?)(\\d*)(?:\\.(\\d*))?$/);if(!m||(m[2]===''&&(m[3]||'')===''))return null;\n  const ip=BigInt(m[2]||'0'),fd=(m[3]||'').replace(/0+$/,'');const den=10n**BigInt(fd.length);const num=BigInt(fd||'0');return {neg:m[1]==='-',ip,num,den,fd,txt:(m[1]==='-'?'-':'')+(m[2]||'0').replace(/^0+(?=\\d)/,'')+(fd?'.'+fd:'')}}\nfunction intSteps(n){const rows=[];if(n===0n)return {bits:'0',rows:[]};let x=n;while(x>0n){rows.push({n:x,q:x/2n,r:x%2n});x=x/2n}return {bits:rows.map(r=>r.r).reverse().join(''),rows}}\nfunction fracSteps(num,den,maxBits){const rows=[];let x=num;for(let i=0;i<maxBits&&x!==0n;i++){const y=x*2n;const b=y>=den?1:0;rows.push({x,y,b,after:b?y-den:y});x=b?y-den:y}return {rows}}\nfunction toHex(bits){let h='';for(let i=0;i<bits.length;i+=4)h+=parseInt(bits.slice(i,i+4),2).toString(16).toUpperCase();return h}\nfunction incBin(s){const a=[...s];for(let i=a.length-1;i>=0;i--){if(a[i]==='0'){a[i]='1';return a.join('')}a[i]='0'}return null}\n// generic encoder from exact parts (round to nearest even)\nfunction encodeExact(neg,ib,fb,exact,w){const F=FMT[w];let e,raw;if(ib!=='0'){e=ib.length-1;raw=ib.slice(1)+fb}else{const i=fb.indexOf('1');if(i<0)return null;e=-(i+1);raw=fb.slice(i+1)}\n  const keep=F.explicit?F.m-1:F.m;let mant=raw.slice(0,keep).padEnd(keep,'0');const r=raw[keep]==='1';const sticky=raw.slice(keep+1).includes('1')||!exact;\n  if(r&&(sticky||mant.endsWith('1'))){const inc=incBin(mant);if(inc===null){mant='0'.repeat(keep);e++}else mant=inc}\n  const E=e+F.bias;if(E<=0||E>=2**F.e-1)return null;return {bits:(neg?'1':'0')+E.toString(2).padStart(F.e,'0')+(F.explicit?'1':'')+mant,e,raw,E}}\nfunction binToDec(intB,fracB){const ip=intB?BigInt('0b'+intB):0n;let num=0n,den=1n;for(const c of fracB){den*=2n;num=num*2n+BigInt(+c)}\n  if(num===0n)return ip.toString();const k=fracB.length;const scaled=num*(10n**BigInt(k))/den;return ip.toString()+'.'+scaled.toString().padStart(k,'0').replace(/0+$/,'')}\nfunction nativeBits(v,w){const dv=new DataView(new ArrayBuffer(8));let b='';if(w===32){dv.setFloat32(0,v);for(let i=0;i<4;i++)b+=dv.getUint8(i).toString(2).padStart(8,'0')}else{dv.setFloat64(0,v);for(let i=0;i<8;i++)b+=dv.getUint8(i).toString(2).padStart(8,'0')}return b}\nfunction decodeBits(bits){const w=bits.length;const F=FMT[w];const s=bits[0],eb=bits.slice(1,1+F.e),m=bits.slice(1+F.e);const E=parseInt(eb,2);\n  const special=E===0||E===2**F.e-1;const sig=F.explicit?m:'1'+m;return {w,F,s,eb,m,E,e:E-F.bias,special,sig}}\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\nconst esc=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;');\nconst store={get(k,d){try{const v=localStorage.getItem('fp-'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('fp-'+k,JSON.stringify(v))}catch(e){}}};\nconst TABS=[['p1','1 \u00b7 The idea','Normalised, biased exponent'],['p2','2 \u00b7 Decimal \u2192 float','Short, long, extended'],['p3','3 \u00b7 Float \u2192 decimal','Step by step'],['p5','4 \u00b7 Operations','+ \u2212 \u00d7 \u00f7 and REM'],['p6','5 \u00b7 FPU stack','ST(0)\u2026ST(7), instructions'],['p4','6 \u00b7 Practice','Like the exam']];\n$('#tabs').innerHTML=TABS.map(([id,a,b])=>`<button role=\"tab\" data-tab=\"${id}\" aria-selected=\"false\"><b>${a}<\/b><span>${b}<\/span><\/button>`).join('');\n$$('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));\nfunction tab(id){$$('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===id));TABS.forEach(([t])=>$('#'+t).hidden=t!==id);store.set('tab',id)}\n$('#pt3').textContent=`0.1 + 0.2 = ${0.1+0.2}`;\nconst sub=n=>`<sub>${n}<\/sub>`;\nfunction strip(w,bits,show,fresh){const F=FMT[w];const parts=[['sg','Sign',0,1],['ex','Exponent',1,1+F.e],['mn',F.explicit?'Significand (1 written)':'Significand / mantissa',1+F.e,w]];\n  return parts.map(([c,n,a,b])=>`<div class=\"grp ${c}\"><span>${n} (${b-a})<\/span><div class=\"cells\">${[...Array(b-a).keys()].map(i=>{const on=show[c];return `<i class=\"${on?'':'empty'}${on&&fresh===c?' new':''}\">${on?bits[a+i]:'\u00b7'}<\/i>`}).join('')}<\/div><\/div>`).join('')}\nconst fmtFrac=(x,den,k)=>{const ip=x/den,f=x%den;return `${ip}.${f.toString().padStart(k,'0')}`.replace(/\\.?0+$/,m=>m.startsWith('.')?'.0':'')};\nfunction fracDec(x,den,k){if(k===0)return '0';const s=(x).toString().padStart(k,'0');return '0.'+s.replace(/0+$/,'')||'0'}\n// ---------- encode ----------\nlet W=32,DS=[],dk=0,DCUR=null;\nfunction buildEnc(txt){const p=parseDec(txt);if(!p)return {err:'Type a number like -12.4375 or 0.1'};const F=FMT[W];\n  if(p.ip===0n&&p.num===0n)return {zero:true,bits:(p.neg?'1':'0')+'0'.repeat(W-1),p};\n  if(p.ip>10n**30n)return {err:'Too big for this page.'};\n  const I=intSteps(p.ip),Fs=fracSteps(p.num,p.den,12);const k=p.fd.length;\n  let fb='',x=p.num;for(let i=0;i<400&&x!==0n;i++){x*=2n;if(x>=p.den){fb+='1';x-=p.den}else fb+='0'}const exact=x===0n;\n  const ib=I.bits;const r=encodeExact(p.neg,ib,fb,exact,W);if(!r)return {err:'This number is too small or too big for the normal method. Try a number between 0.0001 and 1 000 000.'};\n  const bits=r.bits;const keep=F.explicit?F.m-1:F.m;const mAct=bits.slice(1+F.e),eAct=bits.slice(1,1+F.e);\n  const rounded=r.raw.length>keep||!exact;return {p,bits,I,Fs,fb,exact,ib,e:r.e,raw:r.raw,E:r.E,eAct,mAct,rounded,k,keep}}\nfunction storedValue(bits){const D=decodeBits(bits);if(D.special)return null;let digits=D.sig.replace(/0+$/,'')||'1';const pos=1+D.e;let ib,fb;\n  if(pos<=0){ib='0';fb='0'.repeat(-pos)+digits}else if(pos>=digits.length){ib=digits+'0'.repeat(pos-digits.length);fb=''}else{ib=digits.slice(0,pos);fb=digits.slice(pos)}\n  return {ib,fb,val:(D.s==='1'?'-':'')+binToDec(ib.replace(/^0+(?=.)/,''),fb),D}}\nconst short=s=>s.length>26?s.slice(0,26)+'\u2026':s;\nfunction encSteps(R){const F=FMT[W],p=R.p;const S=[];const neg=p.neg;\n  if(R.zero){return [{t:'Zero is special',v:`<p class=\"big\">${strip(W,R.bits,{sg:1,ex:1,mn:1})}<\/p>`,a:['Zero cannot be written as 1.xxx \u00d7 2^e.','IEEE 754 keeps a special pattern for it: exponent all 0s and mantissa all 0s.','(+0 has sign 0, \u22120 has sign 1.)'],show:{sg:1,ex:1,mn:1}}]}\n  const absTxt=p.txt.replace('-','');\n  S.push({t:'Step 1 \u00b7 The sign',v:`<p class=\"big\"><span style=\"color:var(--bad)\">${neg?'\u2212':'+'}<\/span>${esc(absTxt)}<\/p>`,a:[`The number is ${neg?'negative':'positive'}, so the sign bit is <b>${neg?1:0}<\/b>.`,'From now on we work with the number without its sign: '+esc(absTxt)+'.'],show:{sg:1},fresh:'sg'});\n  const iRows=R.I.rows;S.push({t:`Step 2 \u00b7 Integer part ${p.ip} \u2192 binary`,v:p.ip===0n?'<p class=\"big\">0 \u2192 0<\/p>':`<div class=\"scroll\"><table class=\"t\"><tr><th>number<\/th><th>\u00f7 2 =<\/th><th>remainder<\/th><\/tr>${iRows.map(r=>`<tr><td>${r.n}<\/td><td>${r.q}<\/td><td class=\"hl\">${r.r}<\/td><\/tr>`).join('')}<\/table><\/div>`,\n    a:p.ip===0n?['The integer part is 0, so it is just 0 in binary.']:['Divide by 2 again and again, and write the remainder (0 or 1) each time.','Stop when you reach 0.',`Read the remainders from the <b>bottom to the top<\/b>: ${p.ip} = <b>${R.ib}${sub(2)}<\/b>.`],show:{sg:1}});\n  if(p.num===0n)S.push({t:'Step 3 \u00b7 Fraction part',v:'<p class=\"big\">no fraction \u2192 nothing after the point<\/p>',a:['There is no fractional part, so there are no bits after the point.'],show:{sg:1}});\n  else{const rows=R.Fs.rows;S.push({t:`Step 3 \u00b7 Fraction part 0.${p.fd} \u2192 binary`,v:`<div class=\"scroll\"><table class=\"t\"><tr><th>fraction<\/th><th>\u00d7 2 =<\/th><th>bit<\/th><th>keep<\/th><\/tr>${rows.map(r=>`<tr><td>${fracDec(r.x,p.den,R.k)}<\/td><td>${fmtFrac(r.y,p.den,R.k)}<\/td><td class=\"hl\">${r.b}<\/td><td>${fracDec(r.after,p.den,R.k)}<\/td><\/tr>`).join('')}<\/table><\/div>`,\n    a:['Multiply the fraction by 2.','If the result is 1 or more, write <b>1<\/b> and keep only the part after the point; otherwise write <b>0<\/b>.',R.exact?`Stop when the fraction becomes 0. Read the bits from the <b>top to the bottom<\/b>: 0.${p.fd} = <b>0.${R.fb}${sub(2)}<\/b>.`:`It never reaches 0: the pattern repeats forever (like 1/3 = 0.333\u2026 in decimal). We keep enough bits and the computer rounds at the end: 0.${p.fd} = <b>0.${R.fb.slice(0,16)}\u2026${sub(2)}<\/b>.`],show:{sg:1}})}\n  const fShow=R.fb.length>24?R.fb.slice(0,24)+'\u2026':R.fb;\n  S.push({t:'Step 4 \u00b7 Put the two parts together',v:`<p class=\"big\">${R.ib}<span class=\"pt\">.<\/span>${fShow||'0'}${sub(2)}<\/p>`,a:[`Integer part, then the point, then the fraction part: ${esc(absTxt)} = <b>${R.ib}.${fShow||'0'}${sub(2)}<\/b>.`],show:{sg:1}});\n  const after=R.raw.length>24?R.raw.slice(0,24)+'\u2026':R.raw;const moves=Math.abs(R.e);\n  S.push({t:'Step 5 \u00b7 Normalise: 1.xxxx \u00d7 2^e',v:`<p class=\"big\">${R.ib}<span class=\"pt\">.<\/span>${fShow||'0'}<\/p><p class=\"big\">= 1<span class=\"pt\">.<\/span>${after||'0'} \u00d7 2<sup>${R.e}<\/sup><\/p>`,\n    a:['Move the point until there is exactly <b>one 1<\/b> in front of it.',R.e>0?`The point moves <b>${moves} places to the left<\/b> \u2192 the exponent is <b>+${R.e}<\/b>.`:R.e<0?`The point moves <b>${moves} place${moves>1?'s':''} to the right<\/b> \u2192 the exponent is <b>${R.e}<\/b> (negative).`:'The point does not move \u2192 the exponent is <b>0<\/b>.','Check: left = bigger exponent, right = smaller (negative) exponent.'],show:{sg:1}});\n  const Eb=R.E.toString(2).padStart(F.e,'0');const pv=[...Array(F.e).keys()].map(i=>2**(F.e-1-i));\n  S.push({t:`Step 6 \u00b7 Exponent: e + ${F.bias}`,v:`<p class=\"big\">${R.e} + ${F.bias} = ${R.E}<\/p><div class=\"scroll\"><table class=\"t\"><tr>${pv.map(x=>`<th>${x}<\/th>`).join('')}<\/tr><tr>${[...Eb].map(b=>`<td class=\"${b==='1'?'hl':''}\">${b}
