Fb').textContent=''}\n$$('[data-nq]').forEach(b=>b.onclick=()=>{const ok=(b.dataset.nq==='yes')===!!NQ[nq][1];$('#nFb').className='fb '+(ok?'ok':'no');$('#nFb').innerHTML=(ok?'Right. ':'Not quite. ')+NQ[nq][2]});\n$('#nNext').onclick=()=>{nq=(nq+1)%NQ.length;drawN()};drawN();\nfunction drawBias(){const E=+$('#bias').value;const e=E-127;$('#biasOut').innerHTML=`${E.toString(2).padStart(8,'0')}<sub>2<\/sub> = ${E} \u2192 ${E} \u2212 127 = ${e} \u2192 \u00d7 2<sup>${e}<\/sup>`}\n$('#bias').oninput=drawBias;drawBias();\n// ---------- exact decimals ----------\nconst D10=s=>{const m=String(s).trim().replace(/[\u2212\u2013]/g,'-').match(/^([+-]?)(\\d*)(?:\\.(\\d*))?$/);if(!m||(m[2]===''&&(m[3]||'')===''))return null;const f=m[3]||'';return {n:BigInt((m[1]==='-'?'-':'')+((m[2]||'0')+f)),s:f.length}};\nconst P10=k=>10n**BigInt(k);\nfunction dfmt(d){let neg=d.n<0n,n=neg?-d.n:d.n;let str=n.toString().padStart(d.s+1,'0');let ip=str.slice(0,str.length-d.s),fp=d.s?str.slice(-d.s).replace(/0+$/,''):'';return (neg?'\u2212':'')+ip+(fp?'.'+fp:'')}\nfunction sameScale(a,b){const s=Math.max(a.s,b.s);return [a.n*P10(s-a.s),b.n*P10(s-b.s),s]}\nconst dadd=(a,b)=>{const [x,y,s]=sameScale(a,b);return {n:x+y,s}},dsub=(a,b)=>{const [x,y,s]=sameScale(a,b);return {n:x-y,s}};\nconst dmul=(a,b)=>({n:a.n*b.n,s:a.s+b.s});\nfunction ddiv(a,b,P=10){const num=a.n*P10(b.s+P),den=b.n*P10(a.s);return {d:{n:num/den,s:P},exact:num%den===0n}}\nconst shiftL=(d,k)=>({n:d.n,s:d.s+k});// divide by 10^k\nconst shiftR=(d,k)=>d.s>=k?{n:d.n,s:d.s-k}:{n:d.n*P10(k-d.s),s:0};// multiply by 10^k\nconst dabs=d=>({n:d.n<0n?-d.n:d.n,s:d.s});const dcmp=(a,b)=>{const [x,y]=sameScale(a,b);return x<y?-1:x>y?1:0};\nconst sci=(m,e)=>`<span class=\"mono\">${dfmt(m)} \u00d7 10<sup>${e}<\/sup><\/span>`;\nfunction normalise(m,e,out){if(m.n===0n){out.push(['Normalise','The result is 0: nothing to normalise.',sci(m,e)]);return [m,e]}let moved=0;const ten={n:10n,s:0},one={n:1n,s:0};\n  while(dcmp(dabs(m),ten)>=0){m=shiftL(m,1);e++;moved++}if(moved){out.push(['Normalise',`The significand is 10 or more: move the point ${moved} place${moved>1?'s':''} left and add ${moved} to the exponent.`,sci(m,e)]);return [m,e]}\n  while(dcmp(dabs(m),one)<0){m=shiftR(m,1);e--;moved++}out.push(['Normalise',moved?`The significand is smaller than 1: move the point ${moved} place${moved>1?'s':''} right and take ${moved} from the exponent.`:'1 \u2264 significand < 10 already: it is normalised.',sci(m,e)]);return [m,e]}\nfunction runOp(){const A=D10($('#oA').value),B=D10($('#oB').value),ae=parseInt($('#oAe').value,10),be=parseInt($('#oBe').value,10),op=$('#oOp').value;\n  if(!A||!B||isNaN(ae)||isNaN(be)){$('#oSteps').innerHTML='<li><div>Type two numbers and two whole exponents.<\/div><\/li>';return}\n  const S=[['Start',`${op==='+'?'Add':op==='\u2212'?'Subtract':op==='\u00d7'?'Multiply':'Divide'} the two numbers.`,`${sci(A,ae)} ${op} ${sci(B,be)}`]];let m,e;\n  if(op==='+'||op==='\u2212'){let a=A,b=B,E=ae;if(ae!==be){const d=Math.abs(ae-be);if(ae<be){a=shiftL(A,d);E=be;S.push(['Align',`The exponents are different (${ae} and ${be}). Move the point of the first number ${d} place${d>1?'s':''} left so it also has exponent ${be}.`,`${sci(a,be)} ${op} ${sci(B,be)}`])}else{b=shiftL(B,d);S.push(['Align',`The exponents are different (${ae} and ${be}). Move the point of the second number ${d} place${d>1?'s':''} left so it also has exponent ${ae}.`,`${sci(A,ae)} ${op} ${sci(b,ae)}`])}}\n    else S.push(['Align','Same exponent already: no alignment needed.',`${sci(a,E)} ${op} ${sci(b,E)}`]);\n    m=op==='+'?dadd(a,b):dsub(a,b);e=E;S.push([op==='+'?'Add':'Subtract',`${op==='+'?'Add':'Subtract'} the significands only. The exponent stays ${E}.`,`${dfmt(a)} ${op} ${dfmt(b)} = ${dfmt(m)} \u2192 ${sci(m,e)}`])}\n  else if(op==='\u00d7'){m=dmul(A,B);e=ae+be;S.push(['Multiply','No alignment. Multiply the significands.',`${dfmt(A)} \u00d7 ${dfmt(B)} = ${dfmt(m)}`]);S.push(['Add the exponents','',`${ae} + ${be} = ${e} \u2192 ${sci(m,e)}`])}\n  else{if(B.n===0n){S.push(['Error','Division by zero: the FPU reports an error.','']);draw();return}const r=ddiv(A,B);m=r.d;e=ae-be;S.push(['Divide',`No alignment. Divide the significands${r.exact?'':' (it does not stop: inexact result, rounded)'}.`,`${dfmt(A)} \u00f7 ${dfmt(B)} = ${dfmt(m)}`]);S.push(['Subtract the exponents','',`${ae} \u2212 ${be} = ${e} \u2192 ${sci(m,e)}`])}\n  normalise(m,e,S);draw();\n  function draw(){$('#oSteps').innerHTML=S.map(([l,t,x])=>`<li><div><span class=\"ln\">${l}<\/span>${t?`<p>${t}<\/p>`:''}${x?`<p class=\"mono\">${x}<\/p>`:''}<\/div><\/li>`).join('')}}\n$('#oGo').onclick=runOp;\nconst OEX=[['2.34',3,'+','0.88',3],['6.22',8,'+','3.93',8],['6.44',4,'\u2212','6.23',4],['2.4',-3,'\u00d7','6.3',2],['1.86',13,'\u00f7','7.44',5],['9.5',2,'+','7.25',0]];\n$('#oEx').innerHTML=OEX.map((x,i)=>`<button data-ox=\"${i}\">${x[0]}\u00d710^${x[1]} ${x[2]} ${x[3]}\u00d710^${x[4]}<\/button>`).join('');\n$$('[data-ox]').forEach(b=>b.onclick=()=>{const x=OEX[+b.dataset.ox];$('#oA').value=x[0];$('#oAe').value=x[1];$('#oOp').value=x[2];$('#oB').value=x[3];$('#oBe').value=x[4];runOp()});\nfunction runRem(){const s=D10($('#rS').value),t=D10($('#rT').value);if(!s||!t){$('#rOut').innerHTML='Type two numbers.';return}if(t.n===0n){$('#rOut').innerHTML='<b>Error<\/b><ol><li>t = 0: the division s / t is a divide-by-zero attempt.<\/li><\/ol>';return}\n  const [x,y]=sameScale(s,t);let q=x/y,r=x%y;if(r!==0n){const twice=2n*(r<0n?-r:r),ay=y<0n?-y:y;if(twice>ay||(twice===ay&&(q%2n!==0n)))q+=((x<0n)!==(y<0n))?-1n:1n}\n  const res=dsub(s,dmul(t,{n:q,s:0}));const ratio=ddiv(s,t,6);\n  $('#rOut').innerHTML=`<b>Step by step<\/b><ol><li>s / t = ${dfmt(s)} / ${dfmt(t)} = ${dfmt(ratio.d)}${ratio.exact?'':'\u2026'}<\/li><li>NINT = nearest integer = <b>${q}<\/b><\/li><li>s \u2212 t \u00d7 NINT = ${dfmt(s)} \u2212 ${dfmt(t)} \u00d7 ${q} = <b>${dfmt(res)}<\/b><\/li><\/ol>`}\n$('#rGo').onclick=runRem;\n// ---------- FPU stack ----------\nconst fmtN=x=>Number.isNaN(x)?'NaN':!isFinite(x)?(x>0?'+\u221e':'\u2212\u221e'):String(+x.toPrecision(10));\nconst tagOf=x=>x===undefined?'11':x===0?'01':!isFinite(x)||Number.isNaN(x)?'10':'00';\nconst TAGW={'00':'valid','01':'zero','10':'invalid','11':'empty'};\nlet ST=[],MEM={A:2,Two:2,MaxRelErr:5e-7,Xold:NaN,Xnew:NaN},FL={C3:0,C0:0},AH=null,pc=0,lastAct='',iter=0;\nconst PROG=[['fld1','Xnew = 1.0'],['fstp Xnew',''],['REPEAT:',''],['fld Xnew','Xold = Xnew'],['fst Xold',''],['fld A','Xnew = (A/Xold + Xold) / 2'],['fld Xold',''],['fdiv',''],['fld Xold',''],['fadd',''],['fld Two',''],['fdiv',''],['fst Xnew',''],['fsub','test MaxRelErr*Xnew > |Xnew \u2212 Xold|'],['fabs',''],['fld MaxRelErr',''],['fld Xnew',''],['fmul',''],['fcompp',''],['fstsw TestResult','copy the FPU flags to the CPU flags'],['sahf',''],['jna REPEAT','UNTIL MaxRelErr*Xnew > |Xnew \u2212 Xold|'],['fld Xnew','return Xnew on the FPU stack'],['ret','']];\nfunction push(x){if(ST.length>=8)return 'Stack overflow: all 8 registers are full!';ST.unshift(x);return ''}\nfunction pop(){return ST.shift()}\nfunction exec(ins){const [op,arg]=ins.split(/\\s+/);const t0=ST[0],t1=ST[1];let msg='';\n  const need=k=>{if(ST.length<k){msg=`Stack underflow: ${op} needs ${k} value${k>1?'s':''} on the stack.`;return false}return true};\n  switch(op){\n   case 'fld1':msg=push(1)||'Push 1.0 on top of the stack: ST(0) = 1. Everything else moves down one place.';break;\n   case 'fldz':msg=push(0)||'Push 0.0 on top: ST(0) = 0 (tag 01 = zero).';break;\n   case 'fld':{const v=MEM[arg];msg=push(v)||`Load ${arg} (${fmtN(v)}) from memory and push it on top: ST(0) = ${fmtN(v)}.`;break}\n   case 'fst':if(!need(1))break;MEM[arg]=t0;msg=`Copy ST(0) = ${fmtN(t0)} into ${arg}. The value stays on the stack (no pop).`;break;\n   case 'fstp':if(!need(1))break;MEM[arg]=pop();msg=`Store ST(0) = ${fmtN(t0)} into ${arg} and pop it: the stack moves up one place.`;break;\n   case 'fadd':if(!need(2))break;pop();ST[0]=t1+t0;msg=`Pop the top two values, add them, push the result: ${fmtN(t1)} + ${fmtN(t0)} = ${fmtN(ST[0])}.`;break;\n   case 'fsub':if(!need(2))break;pop();ST[0]=t1-t0;msg=`ST(1) \u2212 ST(0) = ${fmtN(t1)} \u2212 ${fmtN(t0)} = ${fmtN(ST[0])}. Two values out, one result in.`;break;\n   case 'fsubr':if(!need(2))break;pop();ST[0]=t0-t1;msg=`Reversed: ST(0) \u2212 ST(1) = ${fmtN(t0)} \u2212 ${fmtN(t1)} = ${fmtN(ST[0])}.`;break;\n   case 'fmul':if(!need(2))break;pop();ST[0]=t1*t0;msg=`ST(1) \u00d7 ST(0) = ${fmtN(t1)} \u00d7 ${fmtN(t0)} = ${fmtN(ST[0])}.`;break;\n   case 'fdiv':if(!need(2))break;pop();ST[0]=t1/t0;msg=t0===0?`Divide by zero! ${fmtN(t1)} / 0 = ${fmtN(ST[0])} (tag 10 = invalid).`:`ST(1) / ST(0) = ${fmtN(t1)} / ${fmtN(t0)} = ${fmtN(ST[0])}.`;break;\n   case 'fchs':if(!need(1))break;ST[0]=-t0;msg=`Change the sign of ST(0): ${fmtN(t0)} \u2192 ${fmtN(ST[0])}.`;break;\n   case 'fabs':if(!need(1))break;ST[0]=Math.abs(t0);msg=`Absolute value of ST(0): |${fmtN(t0)}| = ${fmtN(ST[0])}.`;break;\n   case 'fsqrt':if(!need(1))break;ST[0]=Math.sqrt(t0);msg=`Square root of ST(0): \u221a${fmtN(t0)} = ${fmtN(ST[0])}${t0<0?' (negative \u2192 NaN, invalid)':''}.`;break;\n   case 'frndint':if(!need(1))break;ST[0]=Math.round(t0);msg=`Round ST(0) to the nearest integer: ${fmtN(t0)} \u2192 ${fmtN(ST[0])}.`;break;\n   case 'fxch':if(!need(2))break;[ST[0],ST[1]]=[t1,t0];msg=`Exchange ST(0) and ST(1): now ST(0) = ${fmtN(ST[0])}, ST(1) = ${fmtN(ST[1])}.`;break;\n   case 'fcompp':if(!need(2))break;FL={C3:t0===t1?1:0,C0:t0<t1?1:0};pop();pop();msg=`Compare ST(0) = ${fmtN(t0)} with ST(1) = ${fmtN(t1)}, then pop both. ${t0>t1?'ST(0) is greater (\u201cabove\u201d): C3 = 0, C0 = 0.':t0<t1?'ST(0) is smaller: C0 = 1.':'They are equal: C3 = 1.'}`;break;\n   case 'fstsw':AH={...FL};msg=`Store the FPU status word (with C3 and C0) into TestResult, then mov ax, TestResult (fwait waits for the FPU).`;break;\n   case 'sahf':msg=`Copy AH into the CPU flags: ZF = C3 = ${FL.C3}, CF = C0 = ${FL.C0}. Now a normal jump can test the comparison.`;break;\n   case 'finit':ST=[];msg='finit: initialise the FPU. All registers are empty (tag 11).';break;\n   default:msg=''}\n  return msg}\nfunction stepProg(){if(pc>=PROG.length)return;const [ins]=PROG[pc];let msg='';\n  if(ins==='REPEAT:'){iter++;msg=`Label REPEAT: iteration ${iter} starts.`;pc++}\n  else if(ins.startsWith('jna')){const jump=FL.C0===1||FL.C3===1;msg=jump?`jna = jump if NOT above. MaxRelErr \u00d7 Xnew was not above |Xnew \u2212 Xold|: the guess is not good enough yet \u2192 back to REPEAT.`:`MaxRelErr \u00d7 Xnew is above |Xnew \u2212 Xold|: the answer is accurate enough. No jump: continue.`;pc=jump?PROG.findIndex(p=>p[0]==='REPEAT:'):pc+1}\n  else if(ins==='ret'){msg=`Done after ${iter} iteration${iter>1?'s':''}: ST(0) = Xnew = ${fmtN(MEM.Xnew)} \u2248 \u221a${fmtN(MEM.A)} (check: ${fmtN(Math.sqrt(MEM.A))}).`;pc++}\n  else{msg=exec(ins);pc++}\n  lastAct=`<b>${esc(ins)}<\/b><ol><li>${msg}<\/li><\/ol>`;drawF()}\nfunction resetF(){ST=[];MEM.Xold=NaN;MEM.Xnew=NaN;FL={C3:0,C0:0};pc=0;iter=0;lastAct='<b>Ready<\/b><ol><li>Press \u201cNext instruction\u201d. Change A in the memory box to find another square root.<\/li><\/ol>';drawF()}\nfunction drawF(){$('#stk').innerHTML='<tr><th>Register<\/th><th>Value<\/th><th>Tag<\/th><\/tr>'+[...Array(8).keys()].map(i=>{const v=ST[i];const t=tagOf(v);return `<tr class=\"${i===0&&v!==undefined?'top':''}\"><td>ST(${i})${i===0?' \u2190 top':i===7?' \u2190 bottom':''}<\/td><td class=\"${v===undefined?'empty':''}\">${v===undefined?'empty':fmtN(v)}<\/td><td>${t} <span class=\"muted\">${TAGW[t]}<\/span><\/td><\/tr>`}).join('');\n  $('#memv').innerHTML=Object.entries(MEM).map(([k,v])=>`<label>${k}<input type=\"text\" class=\"mono-in\" data-mem=\"${k}\" value=\"${Number.isNaN(v)?'?':fmtN(v)}\" ${k==='Xold'||k==='Xnew'?'readonly':''}><\/label>`).join('');\n  $$('[data-mem]').forEach(i=>i.onchange=()=>{const v=parseFloat(i.value);if(!isNaN(v))MEM[i.dataset.mem]=v;resetF()});\n  $('#prog').innerHTML=PROG.map(([ins,c],i)=>`<div class=\"${i===pc?'cur':''} ${ins.endsWith(':')?'lbl':''}\">${ins.endsWith(':')?esc(ins):'    '+esc(ins).padEnd(17)}${c?`<span class=\"c\">; ${esc(c)}<\/span>`:''}<\/div>`).join('');\n  const cur=$('#prog .cur');if(cur)cur.scrollIntoView({block:'nearest'});$('#fAct').innerHTML=lastAct;$('#fStep').disabled=pc>=PROG.length}\n$('#fStep').onclick=stepProg;$('#fReset').onclick=resetF;$('#fRun').onclick=()=>{let g=0;while(pc<PROG.length&&g++<500)stepProg()};\nconst FREE=['fld A','fld Two','fld1','fldz','fadd','fsub','fsubr','fmul','fdiv','fchs','fabs','fsqrt','frndint','fxch','fst Xnew','fstp Xnew','fld Xnew','finit'];\n$('#fBtns').innerHTML=FREE.map(f=>`<button class=\"btn ghost sm\" data-fi=\"${f}\">${f}<\/button>`).join('');\n$$('[data-fi]').forEach(b=>b.onclick=()=>{const m=exec(b.dataset.fi);lastAct=`<b>${esc(b.dataset.fi)}<\/b><ol><li>${m}<\/li><\/ol>`;drawF()});\n$$('[data-fm]').forEach(b=>b.onclick=()=>{$$('[data-fm]').forEach(x=>x.setAttribute('aria-pressed',x===b));const free=b.dataset.fm==='free';$('#fProg').hidden=free;$('#fFree').hidden=!free;resetF();if(free)lastAct='<b>Free play<\/b><ol><li>Push some values with fld, then try fadd, fdiv, fxch\u2026 Watch ST(0) and the tags.<\/li><\/ol>',drawF()});\n\nstartD();startB();newP();runOp();runRem();resetF();tab(store.get('tab','p1'));\n<\/script>\n\n<\/body><\/html>"}, {"fname": "3.Inside Arithmetic.html", "title": "3. Inside Arithmetic", "desc": "Tutorial 3 \u00b7 Base arithmetic, two's complement, Booth & division", "html": "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Inside Arithmetic<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#F1EFEA; --panel:#FFFFFF; --ink:#1F2433; --muted:#5D6375; --line:#D3D0C7; --soft:#E9E6DE;\n  --acc:#2F6FDB; --carry:#C0392B; --hl:#FFF1C9; --ok:#2E8B57; --a:#7B5EA7; --q:#C2571A;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#15171D; --panel:#1E212A; --ink:#E8E9EE; --muted:#A3A8B8; --line:#353A47; --soft:#2A2E39;\n    --acc:#6C9BF0; --carry:#EE6B5E; --hl:#3A3420; --ok:#4FB57D; --a:#A98BD6; --q:#EE8A4F; color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#15171D; --panel:#1E212A; --ink:#E8E9EE; --muted:#A3A8B8; --line:#353A47; --soft:#2A2E39;\n  --acc:#6C9BF0; --carry:#EE6B5E; --hl:#3A3420; --ok:#4FB57D; --a:#A98BD6; --q:#EE8A4F; color-scheme:dark;\n}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 \"Atkinson Hyperlegible\",system-ui,-apple-system,\"Segoe UI\",sans-serif}\nh1,h2,h3{font-family:\"Bricolage Grotesque\",\"Segoe UI\",system-ui,sans-serif;line-height:1.1;margin:0}\n.n,.mono{font-family:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace}\n.wrap{max-width:1120px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}\nheader{margin-bottom:16px}\nh1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;letter-spacing:-.02em}\nheader p{margin:6px 0 0;color:var(--muted);max-width:62ch}\nnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;padding:10px 0;margin-bottom:14px;border-bottom:2px solid var(--line)}\nnav button{font:inherit;text-align:left;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);border-radius:10px;color:var(--ink);padding:7px 10px;cursor:pointer;line-height:1.2}\nnav button:hover{border-color:var(--ink)}\nnav button b{font-size:1.05rem} nav button span{font-size:.82rem;color:var(--muted)}\nnav button[aria-selected=\"true\"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}\nnav button[aria-selected=\"true\"] span{color:var(--panel)}\nbutton:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\n.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px}\n@media (max-width:860px){.lab{grid-template-columns:1fr}}\n.intro h2{font-size:1.6rem;font-weight:800;margin-bottom:10px}\n.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px}\n.box ol{margin:6px 0 0;padding-left:20px} .box li{margin:3px 0}\n.life{border-left:4px solid var(--acc);border-radius:0 10px 10px 0}\n.think{background:var(--panel);border-left:4px solid var(--ink);padding:12px 14px;border-radius:0 8px 8px 0;margin:0}\n.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}\n.btn{font:inherit;font-weight:700;font-size:.95rem;padding:8px 14px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer}\n.btn.ghost{background:transparent;color:var(--ink)}\n.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}\n.btn:disabled{opacity:.4;cursor:not-allowed}\n.problem{font-size:1.3rem;font-weight:700;margin:4px 0 12px}\n.problem .n{font-size:1.35rem}\nsub{font-size:.65em}\n.say{min-height:3.2em;font-size:1.08rem;background:var(--hl);border-radius:8px;padding:8px 12px;margin:10px 0}\n.scroll{overflow-x:auto}\ntable.t{border-collapse:collapse;font-size:1rem}\ntable.t td,table.t th{padding:5px 10px;border:1px solid var(--line);text-align:center}\ntable.t th{font-size:.8rem;color:var(--muted);background:var(--soft)}\ntable.t td.l{text-align:left;font-size:.92rem}\ntable.t td.b{font:700 1.05rem \"JetBrains Mono\",monospace;letter-spacing:.08em}\ntable.t tr.cur td{background:var(--hl)}\ntable.add td{border:0;font:700 1.35rem \"JetBrains Mono\",monospace;min-width:1.6em;padding:2px 6px}\ntable.add td.cy{color:var(--carry);font-size:.85rem;height:1.4em}\ntable.add tr.res td{border-top:3px solid var(--ink)}\ntable.add td.cur{background:var(--hl)}\n.big{font:700 1.3rem \"JetBrains Mono\",monospace;word-break:break-all;margin:6px 0}\n.big .x{color:var(--carry);text-decoration:line-through}\n.ref{font-size:.9rem;color:var(--muted)}\nfooter{margin-top:40px;color:var(--muted);font-size:.9rem}\n.how4{display:grid;gap:6px;background:var(--soft);border-radius:10px;padding:10px 14px;margin-top:12px}\n.how4 div{display:grid;grid-template-columns:minmax(0,16em) minmax(0,1fr);gap:10px;align-items:baseline}\n.how4 span{color:var(--muted);font-size:.95rem}\n.how4 code{font:700 1.1rem \"JetBrains Mono\",monospace;letter-spacing:.12em;word-break:break-all}\n.how4 s{color:var(--carry)} .how4 i{font-style:normal;color:var(--ok)} .how4 u{text-decoration:none;color:var(--acc)}\n.how4 .ref{margin:0}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header>\n  <h1>Inside Arithmetic<\/h1>\n  <p>CST131 / CCA102 Computer Organisation, Tutorial 3. Each tab shows the method step by step on <b>different numbers<\/b> from the tutorial. Watch the steps, press New example to practise, then solve the tutorial questions on paper.<\/p>\n<\/header>\n<nav role=\"tablist\" aria-label=\"Tutorial 3 questions\" id=\"nav\"><\/nav>\n<section class=\"lab\">\n  <div class=\"intro\">\n    <h2 id=\"qTitle\"><\/h2>\n    <div class=\"box life\"><b>In real life<\/b><div id=\"qLife\"><\/div><\/div>\n    <div class=\"box\"><b>The method<\/b><ol id=\"qHow\"><\/ol><\/div>\n    <p class=\"think\" id=\"qThink\"><\/p>\n  <\/div>\n  <div class=\"stage\">\n    <div class=\"row\" id=\"opts\"><\/div>\n    <div class=\"problem\" id=\"problem\"><\/div>\n    <div class=\"row\"><button class=\"btn\" id=\"nx\">Next step<\/button><button class=\"btn ghost\" id=\"pl\">Play<\/button><button class=\"btn ghost\" id=\"all\">Show all steps<\/button><button class=\"btn ghost\" id=\"rs\">Restart<\/button><button class=\"btn ghost\" id=\"nw\">New example<\/button><\/div>\n    <div class=\"scroll\" id=\"board\"><\/div>\n    <div class=\"say\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n<\/section>\n<footer>Method companion for Tutorial 3. The examples never use the tutorial's numbers: use the same method on the real questions.<\/footer>\n<\/div>\n<script>\nconst $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];\nconst DG='0123456789ABCDEF', rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));\nconst bin=(x,n)=>((x%(2**n))+2**n)%(2**n)<0?'':(((x%2**n)+2**n)%2**n).toString(2).padStart(n,'0');\nconst sp=s=>s.split('').join(' ');\nconst inv=s=>s.replace(/[01]/g,c=>c==='0'?'1':'0');\nconst tc=s=>{const n=s.length;return bin(2**n-parseInt(s,2),n)};\n// avoid the tutorial's own values\nconst BAN=new Set(['1001011+11101','4556+1245','BCD+A34','111011101110','11111111000100','100000000','1010101010111',\n '100101-11011','1101011-111010','1110111-10110111','6-3','5--4','-3--5','10*4','15*3','14*14','5*6','23*19','11/3']);\nfunction uniq(f){let r,g=0;do{r=f()}while(BAN.has(r.key)&&g++<50);return r}\n// ---------- step builders: each returns {problem, steps:[{b,t}]} ----------\nfunction addSteps(base){\n  const ex=uniq(()=>{const lim={2:[20,90],8:[200,3000],16:[300,3800]}[base];const A=rnd(...lim),C=rnd(lim[0]/2|0,lim[1]);return {A,C,key:A.toString(base).toUpperCase()+'+'+C.toString(base).toUpperCase()}});\n  const a=ex.A.toString(base).toUpperCase(),c=ex.C.toString(base).toUpperCase(),S=ex.A+ex.C,r=S.toString(base).toUpperCase(),w=Math.max(a.length,c.length,r.length);\n  const x=a.padStart(w,' '),y=c.padStart(w,' '),rs=r.padStart(w,' '),car={};let carry=0;const steps=[];\n  const grid=(upto)=>{let h='<table class=\"add\"><tr><td><\/td>'+[...Array(w)].map((_,i)=>`<td class=\"cy\">${car[w-1-i]??''}<\/td>`).join('')+'<\/tr>';\n    h+='<tr><td><\/td>'+[...x].map((d,i)=>`<td class=\"${w-1-i===upto?'cur':''}\">${d.trim()}<\/td>`).join('')+'<\/tr>';\n    h+='<tr><td>+<\/td>'+[...y].map((d,i)=>`<td class=\"${w-1-i===upto?'cur':''}\">${d.trim()}<\/td>`).join('')+'<\/tr>';\n    h+='<tr class=\"res\"><td>=<\/td>'+[...rs].map((d,i)=>`<td>${w-1-i<=upto?d.trim():''}<\/td>`).join('')+'<\/tr><\/table>';return h};\n  steps.push({b:grid(-1),t:`Add column by column, from right to left. In base ${base}, the digits go from 0 to ${DG[base-1]}: when a column reaches ${base}, write the rest and carry 1.`});\n  for(let p=0;p<w;p++){const i=w-1-p,dx=x[i]===' '?0:parseInt(x[i],base),dy=y[i]===' '?0:parseInt(y[i],base),s=dx+dy+carry,d=s%base,nc=Math.floor(s/base);\n    if(nc)car[p+1]=1;const L=v=>base===16&&v>9?`${DG[v]} (${v})`:v;\n    steps.push({b:grid(p),t:`Column ${p+1}: ${L(dx)} + ${L(dy)}${carry?' + carry 1':''} = ${s}. `+(nc?`That is ${base} or more: write ${DG[d]}${base===16&&d>9?' ('+d+')':''}, carry 1.`:`Less than ${base}: write ${DG[d]}${base===16&&d>9?' ('+d+')':''}.`)});carry=nc}\n  steps.push({b:grid(w-1)+`<p class=\"big\">= (${r})<sub>${base}<\/sub><\/p>`,t:`Result: (${r}) base ${base}. Check in decimal: ${ex.A} + ${ex.C} = ${S}.`});\n  return {problem:`(<span class=\"n\">${a}<\/span>)<sub>${base}<\/sub> + (<span class=\"n\">${c}<\/span>)<sub>${base}<\/sub>`,steps};\n}\nfunction tcSteps(){\n  const ex=uniq(()=>{const n=rnd(6,12);let s='1'+[...Array(n-1)].map(()=>rnd(0,1)).join('');if(!s.includes('1',1))s=s.slice(0,-1)+'1';return {s,key:s}});\n  const s=ex.s,n=s.length,iv=inv(s),r=tc(s),k=s.lastIndexOf('1');\n  const tb=u=>`<table class=\"t\"><tr><td class=\"l\">number (${n} bits)<\/td><td class=\"b\">${s}<\/td><\/tr>${u>=1?`<tr><td class=\"l\">flip every bit<\/td><td class=\"b\">${iv}<\/td><\/tr>`:''}${u>=2?`<tr><td class=\"l\">add 1<\/td><td class=\"b\">${r}<\/td><\/tr>`:''}${u>=3?`<tr><td class=\"l\">shortcut<\/td><td class=\"b\"><span style=\"color:var(--muted)\">${iv.slice(0,k)}<\/span><span style=\"color:var(--acc)\">${s.slice(k)}<\/span><\/td><\/tr>`:''}<\/table>`;\n  return {problem:`Two's complement of <span class=\"n\">${s}<\/span>`,steps:[\n    {b:tb(0),t:`Keep the same number of bits: ${n}.`},\n    {b:tb(1),t:`Step 1, one's complement: every 0 becomes 1 and every 1 becomes 0.`},\n    {b:tb(2),t:`Step 2: add 1 to the result. This is the two's complement.`},\n    {b:tb(3),t:`Shortcut: copy from the right up to the first 1 (blue), then flip everything on its left. Same answer.`},\n    {b:tb(3)+`<p class=\"ref\">Check: ${s} + ${r} = 1 followed by ${n} zeros. The 1 falls off the left, so the sum is 0 on ${n} bits.<\/p>`,t:`Check: the number plus its two's complement gives 0 on ${n} bits.`}]};\n}\nfunction subSteps(mode){\n  const ex=uniq(()=>{if(mode==='u'){const n=rnd(6,8),M=rnd(2**(n-2),2**n-1),N=rnd(3,2**n-1);return {M,N,n,key:M.toString(2)+'-'+N.toString(2)}}\n    const n=rnd(4,5),lim=2**(n-1)-1;let M,N;do{M=rnd(-lim,lim);N=rnd(-lim,lim)}while(M-N>lim||M-N<-lim-1||N===0);return {M,N,n,key:M+'-'+N}});\n  const {M,N,n}=ex,a=bin(M,n),c=bin(N,n),ct=tc(c),S=(parseInt(a,2)+parseInt(ct,2)),carry=S>=2**n,out=bin(S,n);\n  const prob=mode==='u'?`(<span class=\"n\">${M.toString(2)}<\/span>)<sub>2<\/sub> \u2212 (<span class=\"n\">${N.toString(2)}<\/span>)<sub>2<\/sub>`:`${M} \u2212 (${N}) on ${n} bits`;\n  let res;\n  if(mode==='u') res=carry?`${out} = ${parseInt(out,2)}`:`no carry \u2192 negative: \u2212(${tc(out)}) = \u2212${parseInt(tc(out),2)}`;\n  else res=`${out} = ${M-N}`;\n  const tb=u=>`<table class=\"t\"><tr><td class=\"l\">M<\/td><td class=\"b\">${a}<\/td><\/tr><tr><td class=\"l\">N<\/td><td class=\"b\">${c}<\/td><\/tr>${u>=1?`<tr><td class=\"l\">two's complement of N<\/td><td class=\"b\">${ct}<\/td><\/tr>`:''}${u>=2?`<tr><td class=\"l\">M + it<\/td><td class=\"b\">${carry?'<span style=\"color:var(--carry)\">1<\/span>':''}${out}<\/td><\/tr>`:''}${u>=3?`<tr><td class=\"l\">answer<\/td><td class=\"b\" style=\"color:var(--ok)\">${res}<\/td><\/tr>`:''}<\/table>`;\n  return {problem:prob,steps:[\n    {b:tb(0),t:mode==='u'?`Write both numbers with the same number of bits: ${n}.`:`Write both numbers in two's complement on ${n} bits.${M<0?` ${M} is ${a}.`:''}${N<0?` ${N} is ${c}.`:''}`},\n    {b:tb(1),t:`Take the two's complement of the number you subtract: ${c} \u2192 ${ct}.`},\n    {b:tb(2),t:`Add M and that two's complement.${carry?' A carry falls off the left: ignore it.':''}`},\n    {b:tb(3),t:mode==='u'?(carry?`With a carry, the answer is positive: ${parseInt(out,2)}. Check: ${M} \u2212 ${N} = ${M-N}.`:`No carry: the answer is negative. Take the two's complement of ${out} to read it: \u2212${parseInt(tc(out),2)}. Check: ${M} \u2212 ${N} = ${M-N}.`):`Read the ${n}-bit answer: ${out} = ${M-N}. Check: ${M} \u2212 (${N}) = ${M-N}.`}]};\n}\nfunction asSteps(){\n  const ex=uniq(()=>{const M=rnd(5,15),Q=rnd(3,15);return {M,Q,key:M+'*'+Q}});const {M,Q}=ex,n=4;\n  let C=0,A=0,q=Q;const rows=[['Start',C,A,q]],steps=[],sx={};\n  const tb=u=>'<table class=\"t\"><tr><th>Step<\/th><th>C<\/th><th>A<\/th><th>Q<\/th><\/tr>'+rows.slice(0,u+1).map((r,i)=>`<tr class=\"${i===u?'cur':''}\"><td class=\"l\">${r[0]}<\/td><td class=\"b\">${r[1]}<\/td><td class=\"b\">${bin(r[2],n)}<\/td><td class=\"b\">${bin(r[3],n)}<\/td><\/tr>`).join('')+'<\/table>';\n  const say=[`Set up: M = ${bin(M,n)} (${M}) waits on the side, Q = ${bin(Q,n)} (${Q}), A = 0000 (empty, the result is built here), C = 0.`];\n  for(let i=0;i<n;i++){if(q&1){const s=A+M;C=s>>n;A=s&15;rows.push([`Cycle ${i+1}: Q0 = 1 \u2192 A = A + M`,C,A,q]);say.push(`Q0 is 1: add M to A. A = ${bin(A,n)}${C?', carry 1 in C':''}.`)}\n    else{rows.push([`Cycle ${i+1}: Q0 = 0 \u2192 no add`,C,A,q]);say.push('Q0 is 0: do not add.')}\n    const s9=C+bin(A,n)+bin(q,n),s8=s9.slice(0,8);\n    q=(q>>1)|((A&1)<<(n-1));A=(A>>1)|(C<<(n-1));C=0;rows.push(['shift C, A, Q right',C,A,q]);say.push(`Shift: every bit slides one box to the right. The last bit falls off, a 0 comes in on the left. A = ${bin(A,n)}, Q = ${bin(q,n)}.`);\n    sx[rows.length-1]=`<div class=\"how4\"><b>The shift in 4 actions<\/b>\n      <div><span>1 \u00b7 Write C, A, Q in a row<\/span><code>${s9}<\/code><\/div>\n      <div><span>2 \u00b7 Remove the last bit<\/span><code>${s8}<s>${s9[8]}<\/s><\/code><\/div>\n      <div><span>3 \u00b7 Add a 0 at the start<\/span><code><i>0<\/i>${s8}<\/code><\/div>\n      <div><span>4 \u00b7 Cut again 1 | 4 | 4<\/span><code><i>0<\/i> | <u>${('0'+s8).slice(1,5)}<\/u> | ${('0'+s8).slice(5)}<\/code><\/div>\n      <p class=\"ref\">Like letters: A B C D E F G H I \u2192 0 A B C D E F G H.<\/p><\/div>`}\n  rows.forEach((_,i)=>steps.push({b:tb(i)+(sx[i]||''),t:say[i]}));\n  const P=(A<<n)|q;steps.push({b:tb(rows.length-1)+`<p class=\"big\">A Q = ${bin(P,2*n)} = ${P}<\/p>`,t:`Product = A followed by Q = ${bin(P,2*n)} = ${P}. Check: ${M} \u00d7 ${Q} = ${M*Q}.`});\n  return {problem:`${M} \u00d7 ${Q} with 4 bits`,steps};\n}\nfunction boothSteps(n){\n  const ex=uniq(()=>{const lim=2**(n-1)-1;const M=rnd(3,lim),Q=rnd(3,lim);return {M,Q,key:M+'*'+Q}});const {M,Q}=ex;const mask=2**n-1;\n  let A=0,q=Q,q1=0;const rows=[['Start',A,q,q1]],say=[`M = ${bin(M,n)}, \u2212M = ${bin(-M,n)}, Q = ${bin(Q,n)}. A = ${'0'.repeat(n)}, Q\u22121 = 0.`];\n  for(let i=0;i<n;i++){const q0=q&1;\n    if(q0===1&&q1===0){A=(A-M)&mask;rows.push([`Cycle ${i+1}: Q0 Q\u22121 = 10 \u2192 A = A \u2212 M`,A,q,q1]);say.push(`Bits 1 0: A = A \u2212 M (add ${bin(-M,n)}). A = ${bin(A,n)}.`)}\n    else if(q0===0&&q1===1){A=(A+M)&mask;rows.push([`Cycle ${i+1}: Q0 Q\u22121 = 01 \u2192 A = A + M`,A,q,q1]);say.push(`Bits 0 1: A = A + M. A = ${bin(A,n)}.`)}\n    else{rows.push([`Cycle ${i+1}: Q0 Q\u22121 = ${q0}${q1} \u2192 nothing`,A,q,q1]);say.push('The two bits are equal: do nothing.')}\n    q1=q&1;q=(q>>1)|((A&1)<<(n-1));A=(A>>1)|(A&(1<<(n-1)));rows.push(['arithmetic shift right',A,q,q1]);say.push(`Arithmetic shift right (copy the sign bit of A). A = ${bin(A,n)}, Q = ${bin(q,n)}, Q\u22121 = ${q1}.`)}\n  const tb=u=>'<table class=\"t\"><tr><th>Step<\/th><th>A<\/th><th>Q<\/th><th>Q\u22121<\/th><\/tr>'+rows.slice(0,u+1).map((r,i)=>`<tr class=\"${i===u?'cur':''}\"><td class=\"l\">${r[0]}<\/td><td class=\"b\">${bin(r[1],n)}<\/td><td class=\"b\">${bin(r[2],n)}<\/td><td class=\"b\">${r[3]}<\/td><\/tr>`).join('')+'<\/table>';\n  const steps=rows.map((_,i)=>({b:tb(i),t:say[i]}));const P=A*2**n+q;\n  steps.push({b:tb(rows.length-1)+`<p class=\"big\">A Q = ${bin(P,2*n)} = ${P}<\/p>`,t:`Product = A followed by Q = ${bin(P,2*n)} = ${P}. Check: ${M} \u00d7 ${Q} = ${M*Q}.`});\n  return {problem:`Booth: ${M} \u00d7 ${Q} with ${n} bits`,steps};\n}\nfunction divSteps(){\n  const ex=uniq(()=>{const D=rnd(7,15),V=rnd(2,5);return {D,V,key:D+'/'+V}});const {D,V}=ex,n=4;\n  let A=0,q=D;const rows=[['Start',A,q]],say=[`Q = ${bin(D,n)} (${D}), M = ${bin(V,n)} (${V}), A = 0.`];\n  for(let i=0;i<n;i++){A=(A<<1)|(q>>(n-1));q=(q<<1)&15;rows.push([`Cycle ${i+1}: shift A, Q left`,A,q]);say.push(`Shift A and Q one bit left. A = ${A}, Q = ${bin(q,n)}.`);\n    A=A-V;rows.push(['A = A \u2212 M',A,q]);say.push(`Try A \u2212 M = ${A}.`);\n    if(A<0){A+=V;rows.push(['A < 0 \u2192 restore A, Q0 = 0',A,q]);say.push(`Negative: undo it (restore A = ${A}) and put 0 in Q0.`)}\n    else{q|=1;rows.push(['A \u2265 0 \u2192 Q0 = 1',A,q]);say.push(`Zero or positive: keep A = ${A} and put 1 in Q0.`)}}\n  const fa=a=>a<0?`${bin(a,n+1)} (${a})`:bin(a,n+1);\n  const tb=u=>'<table class=\"t\"><tr><th>Step<\/th><th>A<\/th><th>Q<\/th><\/tr>'+rows.slice(0,u+1).map((r,i)=>`<tr class=\"${i===u?'cur':''}\"><td class=\"l\">${r[0]}<\/td><td class=\"b\">${fa(r[1])}<\/td><td class=\"b\">${bin(r[2],n)}<\/td><\/tr>`).join('')+'<\/table>';\n  const steps=rows.map((_,i)=>({b:tb(i),t:say[i]}));\n  steps.push({b:tb(rows.length-1)+`<p class=\"big\">Quotient Q = ${bin(q,n)} = ${q} \u00b7 Remainder A = ${A}<\/p>`,t:`Quotient = ${q}, remainder = ${A}. Check: ${V} \u00d7 ${q} + ${A} = ${D}.`});\n  return {problem:`${D} \u00f7 ${V} with 4 bits`,steps};\n}\nconst Q=[\n {tab:'Q1',sub:'Add in any base',title:'Adding in base 2, 8 and 16',life:'A car odometer: after 9 it goes back to 0 and the next wheel moves by 1. In base 8 the wheel goes back after 7, in base 16 after F (15). Web colours like #A0C4FF are base 16.',\n  how:['Write the numbers one under the other, aligned on the right.','Add each column from right to left.','If the column reaches the base, write (sum \u2212 base) and carry 1.','Check by converting to decimal.'],think:'In base 16, what is B + 7? Say it in decimal first, then write it back in hex.',\n  opts:[['Base 2',()=>addSteps(2)],['Base 8',()=>addSteps(8)],['Base 16',()=>addSteps(16)]]},\n {tab:'Q2',sub:\"Two's complement\",title:\"Two's complement\",life:'Old car odometer with 3 digits: go back 1 km from 000 and it shows 999. Computers write \u22121 the same way: on 4 bits, \u22121 is 1111.',\n  how:['Keep the same number of bits.','Flip every bit (one\\'s complement).','Add 1.','Shortcut: copy up to the first 1 from the right, flip the rest.'],think:'What happens with a number like 1000\u20260 (a 1 followed only by zeros)? Try the method on it in the tutorial.',\n  opts:[['New number',tcSteps]]},\n {tab:'Q3',sub:'Subtract by adding',title:\"Subtract with the two's complement\",life:'On a 3-digit odometer, going back 5 km is the same as going forward 995 km: 7 + 995 = 1002, and the display shows 002.',\n  how:['Write both numbers with the same number of bits.','Take the two\\'s complement of the number you subtract.','Add.','A carry out of the left: ignore it. Unsigned numbers with no carry: the answer is negative.'],think:'For a question like 5 \u2212 (\u22124), how many bits do you need so that the answer fits?',\n  opts:[['Binary numbers',()=>subSteps('u')],['Signed decimals',()=>subSteps('s')]]},\n {tab:'Q4',sub:'Add-shift',title:'Multiply with the add-shift method',life:'It is the long multiplication from primary school. In binary each line is either 0 (add nothing) or the multiplicand (add it), moved one place each time.',\n  how:['Set up: A = 0000 (empty), C = 0, Q = multiplier, M = multiplicand on the side.','Look at Q0, the last box on the right. If it is 1: A = A + M (a carry goes in C). If it is 0: nothing.','Shift: write C, A, Q in a row, remove the last bit, add a 0 at the start, cut again 1 | 4 | 4.','Repeat 4 times. Product = A then Q. Slow animation: the Add-Shift Bit Train page.'],think:'Why is the product 8 bits long when each number has only 4 bits?',\n  opts:[['New example',asSteps]]},\n {tab:'Q5\u20136',sub:'Booth',title:'Booth\\'s algorithm',life:'Paying 99 ringgit: instead of counting 99 coins, you pay 100 and get 1 back. Booth does the same with a group of 1s: subtract at its start, add at its end.',\n  how:['A = 0, Q\u22121 = 0. Prepare M and \u2212M (two\\'s complement).','Look at Q0 and Q\u22121: 10 \u2192 A = A \u2212 M, 01 \u2192 A = A + M, 00 or 11 \u2192 nothing.','Arithmetic shift right of A, Q, Q\u22121 (copy the sign bit of A).','Repeat n times (n = number of bits). Product = A then Q.'],think:'Q5 uses 4 bits and Q6 uses 6 bits. How many cycles for each? How many bits in each product?',\n  opts:[['4 bits',()=>boothSteps(4)],['6 bits',()=>boothSteps(6)]]},\n {tab:'Q7',sub:'Restoring division',title:'Restoring division',life:'Sharing sweets: you try to take 3 more. If you would go below zero, you cancel the try and put the sweets back. That \"put back\" is the restore.',\n  how:['A = 0, Q = dividend, M = divisor.','Shift A, Q one bit left.','A = A \u2212 M.','If A < 0: restore A (A + M) and Q0 = 0. Else Q0 = 1.','Repeat 4 times. Q = quotient, A = remainder.'],think:'Check your final answer with: divisor \u00d7 quotient + remainder = dividend.',\n  opts:[['New example',divSteps]]}\n];\n$('#nav').innerHTML=Q.map((q,i)=>`<button role=\"tab\" aria-selected=\"${i===0}\" data-q=\"${i}\"><b>${q.tab}<\/b><span>${q.sub}<\/span><\/button>`).join('');\n$$('[data-q]').forEach(b=>b.onclick=()=>load(+b.dataset.q));\nlet cur=0,opt=0,ex=null,k=0,pt=null;\nfunction load(i){cur=i;opt=0;const q=Q[i];$$('[data-q]').forEach(b=>b.setAttribute('aria-selected',+b.dataset.q===i));\n  $('#qTitle').textContent=q.title;$('#qLife').textContent=q.life;$('#qHow').innerHTML=q.how.map(x=>`<li>${x}<\/li>`).join('');$('#qThink').textContent=q.think;\n  $('#opts').innerHTML=q.opts.length>1?q.opts.map((o,j)=>`<button class=\"btn ${j?'ghost':'on'}\" data-o=\"${j}\">${o[0]}<\/button>`).join(''):'';\n  $$('[data-o]').forEach(b=>b.onclick=()=>{opt=+b.dataset.o;$$('[data-o]').forEach(x=>x.className='btn '+(x===b?'on':'ghost'));fresh()});\n  fresh();try{localStorage.setItem('iar',i)}catch(e){}}\nfunction fresh(){stop();ex=Q[cur].opts[opt][1]();$('#problem').innerHTML=ex.problem;k=0;draw()}\nfunction draw(){const s=ex.steps[k];$('#board').innerHTML=s.b;$('#say').textContent=s.t;$('#nx').disabled=k>=ex.steps.length-1}\nfunction stop(){clearInterval(pt);pt=null;$('#pl').textContent='Play'}\n$('#nx').onclick=()=>{if(k<ex.steps.length-1){k++;draw()}};\n$('#rs').onclick=()=>{stop();k=0;draw()};\n$('#all').onclick=()=>{stop();k=ex.steps.length-1;draw()};\n$('#nw').onclick=fresh;\n$('#pl').onclick=()=>{if(pt){stop();return}$('#pl').textContent='Pause';pt=setInterval(()=>{if(k<ex.steps.length-1){k++;draw()}else stop()},2800)};\nlet s0=0;try{s0=+localStorage.getItem('iar')||0}catch(e){}\nload(Math.min(s0,Q.length-1));\n<\/script>\n<\/body>\n<\/html>\n\n<\/body><\/html>"}, {"fname": "4.Inside Logic Gates TA.html", "title": "4. Inside Logic Gates", "desc": "Tutorial 4 \u00b7 Gates, Boolean laws, K-maps & algebra", "html": "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<title>Inside Logic Gates<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Chivo:wght@600;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Patrick+Hand&display=swap\">\n<style>\n/* Layout: a lab bench. Four stations as tabs: the gate bench (switches, wires, lamp), the laws lab, the K-map board, the algebra steps. A signal that is 1 is always amber, a signal that is 0 is always slate. */\n:root{\n  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#18202B; --muted:#596476; --line:#CDD4DD; --soft:#E3E8EE;\n  --on:#E39B12; --on-s:#FDF0D2; --off:#7A8698; --wire:#9AA5B4;\n  --accent:#2F5DAA; --accent-s:#DCE6F6; --ok:#1C7C47; --ok-s:#DBF1E3; --bad:#B23A30; --bad-s:#F8DFDB;\n  --g1:#2F5DAA; --g2:#C2410C; --g3:#1C7C47; --g4:#9333EA; --g5:#B4235D;\n  --display:\"Chivo\",\"Segoe UI\",system-ui,sans-serif;\n  --body:\"Source Sans 3\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#12161C; --panel:#1B2129; --ink:#E6EBF1; --muted:#A3AEBD; --line:#333C48; --soft:#252D37;\n  --on:#F5B83D; --on-s:#3D3018; --off:#7E8A9C; --wire:#5B6676;\n  --accent:#8DB0F0; --accent-s:#1F2C45; --ok:#5ED091; --ok-s:#173525; --bad:#F2877B; --bad-s:#43211E;\n  --g1:#8DB0F0; --g2:#FF9A62; --g3:#5ED091; --g4:#C79BFF; --g5:#FF86B8; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#12161C; --panel:#1B2129; --ink:#E6EBF1; --muted:#A3AEBD; --line:#333C48; --soft:#252D37;\n  --on:#F5B83D; --on-s:#3D3018; --off:#7E8A9C; --wire:#5B6676;\n  --accent:#8DB0F0; --accent-s:#1F2C45; --ok:#5ED091; --ok-s:#173525; --bad:#F2877B; --bad-s:#43211E;\n  --g1:#8DB0F0; --g2:#FF9A62; --g3:#5ED091; --g4:#C79BFF; --g5:#FF86B8; color-scheme:dark}\n*,*::before,*::after{box-sizing:border-box}\n[hidden]{display:none!important}\nbody{background:var(--bg);color:var(--ink);font:400 18px/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}\n.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}\n.wrap>*{min-width:0;max-width:100%}\nsection.wrap{width:100%}\nh1{font:800 clamp(2rem,5vw,3.1rem)/1.05 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}\nh2{font:800 clamp(1.3rem,2.6vw,1.75rem)/1.2 var(--display);margin:0;text-wrap:balance}\nh3{font:600 1.08rem/1.3 var(--display);margin:0}\np{margin:0}\n.lead{color:var(--muted);max-width:66ch;margin-top:8px}\n.muted{color:var(--muted)}\nbutton,select,input{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.nb{text-decoration:overline;text-decoration-thickness:2px}\n.nb+.nb{margin-left:.14em}\n.mono,code{font-family:var(--mono);font-size:.92em}\nnav.tabs{display:flex;gap:8px;flex-wrap:wrap}\nnav.tabs button{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;cursor:pointer;text-align:left;line-height:1.25}\nnav.tabs b{display:block;font:600 1rem var(--display)} nav.tabs span{font-size:.82rem;color:var(--muted)}\nnav.tabs button[aria-selected=\"true\"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}\nnav.tabs button[aria-selected=\"true\"] span{color:var(--panel)}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}\n.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}\n.grid2>*{min-width:0}\n@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.btn{font-weight:700;padding:8px 15px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer}\n.btn.ghost{background:transparent;color:var(--ink)}\n.btn.sm{padding:4px 10px;font-size:.92rem}\n.btn:disabled{opacity:.4;cursor:not-allowed}\n.fb{font-weight:700}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}\n.chips{display:flex;gap:6px;flex-wrap:wrap}\n.chips button{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:.95rem}\n.chips button[aria-pressed=\"true\"]{border-color:var(--accent);background:var(--accent-s)}\n.life{border-left:5px solid var(--on);background:var(--on-s);border-radius:0 10px 10px 0;padding:10px 14px}\n.life b{font:600 .78rem var(--display);text-transform:uppercase;letter-spacing:.06em;display:block;color:var(--muted)}\n.note{border-left:5px solid var(--accent);background:var(--accent-s);border-radius:0 10px 10px 0;padding:10px 14px}\n.scroll{overflow-x:auto}\ntable.t{border-collapse:collapse;font-variant-numeric:tabular-nums}\ntable.t th,table.t td{border:1px solid var(--line);padding:6px 12px;text-align:center;font-family:var(--mono)}\ntable.t th{font-family:var(--display);font-size:.9rem;background:var(--soft)}\ntd.b1{color:var(--on);font-weight:700} td.b0{color:var(--off)}\ntd.diff{background:var(--bad-s)}\n/* bench */\n.bench{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}\n.sw{display:flex;flex-direction:column;gap:14px}\n.sw button{width:92px;white-space:nowrap;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:8px;font:700 1rem var(--mono)}\n.sw button .k{width:22px;height:22px;border-radius:50%;background:var(--off);transition:background .2s}\n.sw button[aria-pressed=\"true\"]{border-color:var(--on)} .sw button[aria-pressed=\"true\"] .k{background:var(--on)}\nsvg.gate{width:100%;max-width:340px;height:auto;display:block;margin:auto}\nsvg.gate .body{fill:var(--panel);stroke:var(--ink);stroke-width:3}\nsvg.gate .w{stroke:var(--wire);stroke-width:4;fill:none;transition:stroke .2s}\nsvg.gate .w.on{stroke:var(--on)}\nsvg.gate .bub{fill:var(--panel);stroke:var(--ink);stroke-width:3}\nsvg.gate text{fill:var(--muted);font:600 14px var(--mono)}\n.lamp{width:74px;height:74px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font:700 1.6rem var(--mono);color:var(--off);background:var(--soft);transition:all .2s}\n.lamp.on{background:var(--on);border-color:var(--on);color:#2A1B00;box-shadow:0 0 28px var(--on)}\n@media (prefers-reduced-motion: reduce){.lamp,.sw .k,svg.gate .w{transition:none}}\n.cellbtn{min-width:46px;border:2px dashed var(--line);background:var(--panel);border-radius:8px;cursor:pointer;font:700 1rem var(--mono);padding:2px 8px}\n.cellbtn.set{border-style:solid}\n.cellbtn.right{border-color:var(--ok);background:var(--ok-s)} .cellbtn.wrong{border-color:var(--bad);background:var(--bad-s)}\n/* laws */\n.laws{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}\n.law{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:6px}\n.law .f{font:600 1.08rem var(--mono)}\n.law small{color:var(--muted);font-size:.92rem}\n.expr{font:600 1.25rem/1.9 var(--mono);word-break:break-word}\n.br{display:inline-block;border-radius:8px;padding:0 3px;transition:background .3s}\n.br.twin{background:var(--on-s);outline:2px solid var(--on)}\n.br.gone{opacity:.25;text-decoration:line-through}\ninput[type=text]{padding:8px 11px;border-radius:9px;border:2px solid var(--line);background:var(--panel);font-family:var(--mono);width:min(100%,24em)}\n/* kmap */\n.kmap{border-collapse:separate;border-spacing:4px;font-family:var(--mono)}\n.kmap th{font:600 .95rem var(--mono);color:var(--muted);padding:2px 6px}\n.kmap th.corner{font-size:.8rem;text-align:right;line-height:1.2}\n.kmap td{padding:0}\n.kc{width:58px;height:54px;border:2px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;font:700 1.25rem var(--mono);position:relative}\n.kc small{position:absolute;top:2px;left:5px;font:500 .62rem var(--mono);color:var(--muted)}\n.kc.v1{color:var(--on);border-color:var(--on)}\n.kc.v0{color:var(--off)}\n.kc.right{background:var(--ok-s)} .kc.wrong{background:var(--bad-s);border-color:var(--bad)}\n.dots{position:absolute;bottom:3px;right:4px;display:flex;gap:2px}\n.dots i{width:9px;height:9px;border-radius:50%;display:block}\n.groups{display:flex;flex-direction:column;gap:8px}\n.grp{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--panel);text-align:left}\n.grp .sq{width:14px;height:14px;border-radius:4px;margin-top:5px}\n.grp[aria-pressed=\"true\"]{border-color:var(--ink);background:var(--soft)}\n.term{font:700 1.1rem var(--mono)}\n.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}\n.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}\n.steps li::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font:600 .95rem var(--display)}\n.steps .law-n{font:600 .78rem var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}\n.steps .mono{font-size:1.08rem;font-weight:600;word-break:break-word}\n.gray{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-family:var(--mono)}\n.gray span{border:2px solid var(--line);border-radius:8px;padding:2px 8px;background:var(--panel)}\n.gray span b{color:var(--on)}\n.signs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}\n@media (max-width:760px){.signs{grid-template-columns:minmax(0,1fr)}}\n.signs>div{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start;background:var(--soft);border-radius:12px;padding:10px 12px}\n.signs .big{font:800 2rem/1 var(--mono);text-align:center;color:var(--accent)}\n.lesson{border:2px solid var(--ink)}\n.lt{font-size:1.3rem}\n.lx{font-size:1.15rem;max-width:70ch;min-height:3em}\n.big-expr{font-size:1.6rem;line-height:2.1;background:var(--soft);border-radius:12px;padding:10px 14px}\n.br.sorted{background:var(--accent-s);outline:2px solid var(--accent)}\n.br.t1{background:var(--on-s);outline:2px solid var(--on)}\n.br.t2{background:var(--ok-s);outline:2px solid var(--ok)}\n.arrow-sw{color:var(--accent);font-weight:800}\ndetails.card summary{cursor:pointer;font-family:var(--display)}\ntable.t tr.pick td{background:var(--accent-s)}\ntable.t tr[data-row]{cursor:pointer}\n.kc.hot{outline:4px solid var(--accent);outline-offset:1px}\nth.hot{color:var(--on)!important;background:var(--on-s);border-radius:6px}\n.coltest td.out{opacity:.35;text-decoration:line-through}\n.coltest td.keep{background:var(--ok-s);font-weight:700}\n.coltest th{font-size:.85rem}\n.verdict{font:700 1.3rem var(--mono)}\n.actbox{border:2px dashed var(--accent);border-radius:12px;padding:10px 14px;background:var(--panel);font-size:1.05rem}\n.actbox>b{font:600 .8rem var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);display:block;margin-bottom:4px}\n.actbox ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}\n.actbox .now{background:var(--on-s);border-radius:6px;padding:0 4px}\n.actbox .bitrow{font:600 1.05rem var(--mono);letter-spacing:.08em}\n.actbox .bitrow b{color:var(--on);text-decoration:underline}\n.stages{display:flex;gap:8px;flex-wrap:wrap}\n.stages span{border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700}\n.stages b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:.8rem;margin-right:6px}\n.stagepill{font:600 .82rem var(--display);text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:var(--panel);border-radius:999px;padding:3px 12px}\n.kc.cur{outline:4px solid var(--accent);outline-offset:1px}\n.kc.bad{outline:4px solid var(--bad);outline-offset:1px}\n.kc.fresh{animation:pop .6s ease}\n@keyframes pop{0%{transform:scale(1.25);background:var(--on-s)}100%{transform:scale(1)}}\ntable.t tr.now td{background:var(--on-s)}\n.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.95rem}\n.legend2 span b{font-family:var(--mono)}\n@media (prefers-reduced-motion: reduce){.kc.fresh{animation:none}}\n.scview{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}\n.scview>*{min-width:0}\n.outcol{display:flex;flex-direction:column;gap:3px}\n.outcol div{display:grid;grid-template-columns:2.2em 2em;gap:6px;align-items:center;font-family:var(--mono);border-radius:6px;padding:1px 6px}\n.blkrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}\n.blkrow .lab{width:5.5em;font:600 .85rem var(--display);color:var(--muted)}\n.bx{width:52px;height:50px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font:700 1.25rem var(--mono);position:relative;background:var(--panel)}\n.bx small{position:absolute;top:1px;left:4px;font:500 .62rem var(--mono);color:var(--muted)}\n.bx.one{color:var(--on);border-color:var(--on)}\n.bx.sw{outline:4px solid var(--g4);outline-offset:1px}\n.swapnote{font:700 1rem var(--display);color:var(--g4)}\n.cheat{border:2px solid var(--on);background:var(--on-s);border-radius:12px;padding:10px 14px}\n.cheat>b{font:600 .8rem var(--display);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}\n.cheat ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}\n.paper{--rule:color-mix(in srgb,var(--accent) 22%,transparent);background:var(--panel);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--rule) 35px,var(--rule) 36px);border:1px solid var(--line);border-left:4px solid color-mix(in srgb,var(--bad) 60%,transparent);border-radius:6px;padding:4px 16px 12px 22px;font:400 1.3rem/36px \"Patrick Hand\",\"Comic Sans MS\",cursive;overflow-x:auto}\n.paper .pl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline}\n.paper .pl .plaw{color:var(--accent);font-size:1.05rem;white-space:nowrap}\n.paper .st{font-weight:700;text-decoration:underline;text-underline-offset:4px}\n.paper .fin{border:2px solid var(--ok);border-radius:6px;padding:0 8px;display:inline-block;line-height:32px}\n.paper table.kmap{font-family:inherit;margin:4px 0}\n.paper table.kmap td,.paper table.kmap th{border:1.5px solid var(--ink);width:44px;height:36px;text-align:center;font:400 1.2rem \"Patrick Hand\",cursive}\n.paper table.kmap{border-collapse:collapse}\n@media (max-width:560px){.paper .pl{grid-template-columns:minmax(0,1fr)}.paper .pl .plaw{white-space:normal}}\n.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}\n@media (max-width:860px){.intro{grid-template-columns:minmax(0,1fr)}}\n.think{font-style:italic;border-left:5px solid var(--accent);padding:6px 12px;background:var(--soft);border-radius:0 10px 10px 0;margin:0}\n<\/style>\n<div class=\"wrap\">\n  <header>\n    <h1>Inside Logic Gates<\/h1>\n    <p class=\"lead\">CST131 / CCA102 Computer Organisation, Tutorial 4 (Digital Logic 1). One tab per tutorial question: first an everyday situation and the method, then a live demo you can play with step by step.<\/p>\n  <\/header>\n  <nav class=\"tabs\" role=\"tablist\" aria-label=\"Tutorial 4 questions\" id=\"tabs\"><\/nav>\n  <div class=\"card\">\n    <h2 id=\"qTitle\"><\/h2>\n    <div class=\"intro\">\n      <div class=\"life\"><b>In real life<\/b><div id=\"qLife\"><\/div><\/div>\n      <div class=\"note\"><b>The method<\/b><ol id=\"qHow\" style=\"margin:4px 0 0;padding-left:22px\"><\/ol><\/div>\n    <\/div>\n    <p class=\"think\" id=\"qThink\"><\/p>\n  <\/div>\n\n  <!-- STATION 1 -->\n  <section id=\"s1\" class=\"wrap\" style=\"gap:16px\">\n    <div class=\"card\">\n      <h2>The gate bench<\/h2>\n      <p class=\"muted\">Pick a gate. Click the switches A and B. A wire that carries 1 turns amber, and the lamp lights when the output is 1. A small circle on a wire means NOT: the bit is flipped as it passes.<\/p>\n      <div class=\"chips\" id=\"gatePick\" role=\"group\" aria-label=\"Gates\"><\/div>\n    <\/div>\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <h3 id=\"gName\"><\/h3>\n        <div class=\"bench\">\n          <div class=\"sw\" id=\"sw\"><\/div>\n          <div id=\"gSvg\" style=\"min-width:0\"><\/div>\n          <div class=\"lamp\" id=\"lamp\">0<\/div>\n        <\/div>\n        <p class=\"mono muted\" id=\"gRule\" style=\"text-align:center\"><\/p>\n        <div class=\"life\" id=\"gLife\"><\/div>\n      <\/div>\n      <div class=\"card\">\n        <h3>Fill the truth table yourself<\/h3>\n        <p class=\"muted\">Try each line on the bench, then click the output cell to write 0 or 1.<\/p>\n        <div class=\"scroll\"><table class=\"t\" id=\"tt\"><\/table><\/div>\n        <div class=\"row\"><button class=\"btn\" id=\"ttCheck\">Check<\/button><span class=\"fb\" id=\"ttFb\"><\/span><\/div>\n        <div id=\"mystery\" hidden class=\"note\">\n          <p><b>Detective question.<\/b> This gate has the same truth table as one of the normal gates. Which one?<\/p>\n          <div class=\"row\" style=\"margin-top:8px\"><select id=\"myPick\" aria-label=\"Which gate\"><option value=\"\">choose<\/option><option>AND<\/option><option>OR<\/option><option>NAND<\/option><option>NOR<\/option><option>XOR<\/option><option>XNOR<\/option><\/select><button class=\"btn sm\" id=\"myCheck\">Check<\/button><span class=\"fb\" id=\"myFb\"><\/span><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- STATION 2 -->\n  <section id=\"s2\" class=\"wrap\" style=\"gap:16px\" hidden>\n    <div class=\"card\">\n      <h2>Tidy an expression in 3 moves<\/h2>\n      <p class=\"muted\">Three signs to know first:<\/p>\n      <div class=\"signs\">\n        <div><span class=\"big\">+<\/span><p><b>OR<\/b>: at least one is true. \u201ctea + coffee\u201d = you drink tea, or coffee, or both.<\/p><\/div>\n        <div><span class=\"big\">\u00b7<\/span><p><b>AND<\/b>: both are true. Two things written side by side, like <span class=\"mono\">PQ<\/span>, also mean AND. Brackets next to each other are joined by AND.<\/p><\/div>\n        <div><span class=\"big\"><span class=\"nb\">P<\/span><\/span><p><b>NOT<\/b>: the bar means the opposite. <span class=\"mono\"><span class=\"nb\">P<\/span><\/span> is 1 when P is 0. The bar stays glued to its letter.<\/p><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"card lesson\">\n      <div class=\"row\" style=\"justify-content:space-between\"><div class=\"chips\" id=\"tEx\" role=\"group\" aria-label=\"Examples\"><\/div><span class=\"muted\" id=\"tStepN\"><\/span><\/div>\n      <div id=\"tStory\" class=\"life\"><\/div>\n      <h3 id=\"tTitle\" class=\"lt\"><\/h3>\n      <div class=\"expr big-expr\" id=\"tShow\"><\/div>\n      <p id=\"tText\" class=\"lx\"><\/p>\n      <div class=\"actbox\"><b>What we do, one by one<\/b><ol id=\"tAct\"><\/ol><\/div>\n      <div class=\"row\"><button class=\"btn ghost\" id=\"tBack\">\u25c0 Back<\/button><button class=\"btn\" id=\"tNext\">Next \u25b6<\/button><\/div>\n    <\/div>\n    <div class=\"card paperwrap\"><div class=\"row\" style=\"justify-content:space-between\"><h2>\u270d On your exam paper<\/h2><button class=\"btn ghost sm\" id=\"pp2Btn\">Show the model answer<\/button><\/div><p class=\"muted\">Write your answer in numbered steps like this. Put the law you used on the right: it shows the examiner your method.<\/p><div class=\"paper\" id=\"pp2\" hidden><\/div><\/div>\n    <div class=\"card\">\n      <h2>Your turn<\/h2>\n      <p class=\"muted\">Do the 3 moves on paper, type your answer, then check. Type NOT as an apostrophe: <code>P'<\/code> means <span class=\"mono\"><span class=\"nb\">P<\/span><\/span>.<\/p>\n      <div class=\"expr\" id=\"tidyExpr\"><\/div>\n      <div class=\"row\"><input type=\"text\" id=\"tidyAns\" placeholder=\"your tidy answer\"><button class=\"btn\" id=\"tidyCheck\">Check<\/button><button class=\"btn ghost\" id=\"tidySolve\">Show the 3 moves<\/button><button class=\"btn ghost\" id=\"tidyNew\">New expression<\/button><\/div>\n      <p class=\"fb\" id=\"tidyFb\"><\/p>\n      <p class=\"muted\" id=\"tidyMsg\"><\/p>\n    <\/div>\n    <details class=\"card\">\n      <summary><b>All the laws (for reference)<\/b><\/summary>\n      <div class=\"laws\" id=\"laws\" style=\"margin-top:12px\"><\/div>\n    <\/details>\n    <details class=\"card\">\n      <summary><b>Tool: are two expressions the same?<\/b><\/summary>\n      <p class=\"muted\">The page tries every combination of 0 and 1. <code>(AB)'<\/code> means NOT of AB.<\/p>\n      <div class=\"row\"><label for=\"ex1\" class=\"muted\" style=\"width:2em\">1<\/label><input type=\"text\" id=\"ex1\" value=\"P(P+Q)\"><\/div>\n      <div class=\"row\"><label for=\"ex2\" class=\"muted\" style=\"width:2em\">2<\/label><input type=\"text\" id=\"ex2\" value=\"P\"><\/div>\n      <div class=\"row\"><button class=\"btn\" id=\"cmp\">Compare<\/button><span class=\"fb\" id=\"cmpFb\"><\/span><\/div>\n      <div class=\"scroll\"><table class=\"t\" id=\"cmpT\"><\/table><\/div>\n    <\/details>\n  <\/section>\n\n  <!-- STATION 3 -->\n  <section id=\"s3\" class=\"wrap\" style=\"gap:16px\" hidden>\n    <div class=\"card\">\n      <h2>The K-map method in 4 stages<\/h2>\n      <div class=\"stages\"><span><b>1<\/b> Draw the boxes<\/span><span><b>2<\/b> Copy the 1s<\/span><span><b>3<\/b> Circle groups<\/span><span><b>4<\/b> Read each group<\/span><\/div>\n      <p class=\"muted\">Pick an example, then press Next (or Play) and watch every small action. Start with the real-life one.<\/p>\n      <div class=\"chips\" id=\"lEx\" role=\"group\" aria-label=\"Examples\"><\/div>\n    <\/div>\n    <div class=\"card lesson\" id=\"scCard\">\n      <div class=\"row\" style=\"justify-content:space-between\"><span class=\"stagepill\" style=\"background:var(--on);color:#2A1B00\">The fast way \u00b7 3 shortcuts<\/span><span class=\"muted\" id=\"scStepN\"><\/span><\/div>\n      <h2 id=\"scTitle\"><\/h2>\n      <div class=\"actbox\" id=\"scAct\"><\/div>\n      <div id=\"scView\" class=\"scview\"><\/div>\n      <div class=\"row\"><button class=\"btn ghost\" id=\"scBack\">\u25c0 Back<\/button><button class=\"btn\" id=\"scNext\">Next \u25b6<\/button><\/div>\n      <div class=\"cheat\"><b>Remember<\/b><ol><li><b>Fill:<\/b> cut the Out column into blocks of 4, lay each block as a row, swap the 3rd and 4th box. (4 inputs: also swap the 3rd and 4th row.)<\/li><li><b>Circle:<\/b> biggest first: 8, then 4, then 2, then 1. Edges touch.<\/li><li><b>Read:<\/b> look at the labels of the group. Same digit \u2192 keep the letter (1 = A, 0 = <span class=\"nb\">A<\/span>). Different digits \u2192 delete the letter.<\/li><\/ol><\/div>\n    <\/div>\n    <div class=\"card paperwrap\"><div class=\"row\" style=\"justify-content:space-between\"><h2>\u270d On your exam paper<\/h2><button class=\"btn ghost sm\" id=\"pp3Btn\">Show the model answer<\/button><\/div><p class=\"muted\">Write your answer in numbered steps like this. Put the law you used on the right: it shows the examiner your method.<\/p><div class=\"paper\" id=\"pp3\" hidden><\/div><\/div>\n    <p class=\"muted\" style=\"text-align:center\">Want to see every single action? The slow, detailed version is below.<\/p>\n    <div class=\"card lesson\" id=\"lessonCard\">\n      <div class=\"row\" style=\"justify-content:space-between\"><span class=\"stagepill\" id=\"lStage\"><\/span><span class=\"muted\" id=\"lStepN\"><\/span><\/div>\n      <h2 id=\"lTitle\"><\/h2>\n      <div class=\"actbox\" id=\"lAct\"><\/div>\n      <div class=\"grid2\">\n        <div><h3 style=\"margin-bottom:6px\">Truth table<\/h3><div class=\"scroll\"><table class=\"t\" id=\"lTT\"><\/table><\/div><\/div>\n        <div style=\"display:flex;flex-direction:column;gap:12px;min-width:0\">\n          <div><h3 style=\"margin-bottom:6px\">K-map<\/h3><div class=\"scroll\"><table class=\"kmap\" id=\"lMap\"><\/table><\/div><\/div>\n          <div id=\"lCol\"><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"row\"><button class=\"btn ghost\" id=\"lBack\">\u25c0 Back<\/button><button class=\"btn\" id=\"lNext\">Next \u25b6<\/button><button class=\"btn ghost\" id=\"lPlay\">\u25b6 Play<\/button><input type=\"range\" id=\"lSeek\" min=\"0\" max=\"1\" value=\"0\" aria-label=\"Go to step\" style=\"flex:1;min-width:120px\"><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h2>Your turn<\/h2>\n      <p class=\"muted\">A new truth table each time. Fill the K-map, find the groups, type your answer.<\/p>\n      <div class=\"row\">\n        <div class=\"chips\" role=\"group\" aria-label=\"Size\"><button data-n=\"3\" aria-pressed=\"true\">3 inputs<\/button><button data-n=\"4\" aria-pressed=\"false\">4 inputs<\/button><\/div>\n        <button class=\"btn ghost\" id=\"kNew\">New truth table<\/button>\n        <label class=\"row muted\" style=\"gap:6px\"><input type=\"checkbox\" id=\"kNum\" checked> show line numbers in the boxes<\/label>\n      <\/div>\n      <div class=\"grid2\">\n        <div class=\"scroll\"><table class=\"t\" id=\"kTT\"><\/table><\/div>\n        <div style=\"display:flex;flex-direction:column;gap:10px;min-width:0\">\n          <p class=\"muted\">Click each box to write the output from the table.<\/p>\n          <div class=\"scroll\"><table class=\"kmap\" id=\"kMap\"><\/table><\/div>\n          <div class=\"row\"><button class=\"btn\" id=\"kCheck\">Check my K-map<\/button><button class=\"btn ghost\" id=\"kFill\">Fill it for me<\/button><\/div>\n          <p class=\"fb\" id=\"kFb\"><\/p>\n        <\/div>\n      <\/div>\n      <div class=\"row\"><label for=\"kAns\" class=\"muted\">Your answer<\/label><input type=\"text\" id=\"kAns\" placeholder=\"e.g. A'C + BC\"><button class=\"btn\" id=\"kAnsCheck\">Check<\/button><button class=\"btn ghost\" id=\"kShow\">Show the groups<\/button><\/div>\n      <p class=\"fb\" id=\"kAnsFb\"><\/p>\n      <div class=\"groups\" id=\"kGroups\"><\/div>\n      <p class=\"term\" id=\"kResult\"><\/p>\n    <\/div>\n  <\/section>\n\n  <!-- STATION 4 -->\n  <section id=\"s4\" class=\"wrap\" style=\"gap:16px\" hidden>\n    <div class=\"card\">\n      <h2>Simplify with algebra, then check with a K-map<\/h2>\n      <p class=\"muted\">The key move is the combining rule: when two terms are the same except for one letter, that letter disappears. <span class=\"mono\">X<span class=\"nb\">Y<\/span> + XY = X(<span class=\"nb\">Y<\/span> + Y) = X \u00b7 1 = X<\/span>. When one term can pair with two others, copy it first (X = X + X).<\/p>\n      <div class=\"chips\" id=\"exPick\" role=\"group\" aria-label=\"Examples\"><\/div>\n    <\/div>\n    <div class=\"card\">\n      <div class=\"actbox\"><b>The method in 4 actions<\/b><ol><li>Find two terms that are the same except for ONE letter.<\/li><li>If one term is needed by two partners, copy it (X = X + X).<\/li><li>Take out what the pair has in common (distributive law).<\/li><li>The letter and its opposite make 1 (X\u0304 + X = 1), so that letter disappears.<\/li><\/ol><\/div>\n      <div class=\"life\" id=\"exStory\"><\/div>\n      <p class=\"expr\" id=\"exStart\"><\/p>\n      <ol class=\"steps\" id=\"exSteps\"><\/ol>\n      <div class=\"row\"><button class=\"btn\" id=\"exNext\">Next step<\/button><button class=\"btn ghost\" id=\"exAll\">Show all<\/button><button class=\"btn ghost\" id=\"exK\">See it on the K-map<\/button><\/div>\n    <\/div>\n    <div class=\"card paperwrap\"><div class=\"row\" style=\"justify-content:space-between\"><h2>\u270d On your exam paper<\/h2><button class=\"btn ghost sm\" id=\"pp4Btn\">Show the model answer<\/button><\/div><p class=\"muted\">Write your answer in numbered steps like this. Put the law you used on the right: it shows the examiner your method.<\/p><div class=\"paper\" id=\"pp4\" hidden><\/div><\/div>\n  <\/section>\n\n  <p class=\"muted\" style=\"font-size:.9rem\">Q2 works through the tutorial\u2019s own expressions. The other tabs use their own examples: use exactly the same method on the tutorial, and check your answers with the comparison tool at the bottom of Q2.<\/p>\n<\/div>\n<script>\n// ---------- logic core ----------\nconst GRAY2=[0,1,3,2];\nfunction cubesOf(n){const out=[];const rec=(p)=>{if(p.length===n){out.push(p);return}for(const c of '01-')rec(p+c)};rec('');return out}\nfunction cubeMins(c){let m=[0];for(const ch of c){m=m.flatMap(x=>ch==='-'?[x*2,x*2+1]:[x*2+(+ch)])}return m}\nfunction contains(big,small){for(let i=0;i<big.length;i++)if(big[i]!=='-'&&big[i]!==small[i])return false;return true}\nfunction solveSOP(n,ones){const S=new Set(ones);if(!ones.length)return [];\n  const imps=cubesOf(n).filter(c=>cubeMins(c).every(m=>S.has(m)));\n  const primes=imps.filter(c=>!imps.some(d=>d!==c&&contains(d,c)));\n  const lits=c=>[...c].filter(x=>x!=='-').length;\n  // essential first, then brute force the rest\n  const ess=[];for(const m of ones){const cov=primes.filter(p=>cubeMins(p).includes(m));if(cov.length===1&&!ess.includes(cov[0]))ess.push(cov[0])}\n  const covered=new Set(ess.flatMap(cubeMins));const left=ones.filter(m=>!covered.has(m));\n  const rest=primes.filter(p=>!ess.includes(p));let best=null;\n  if(!left.length)best=[];else{for(let mask=1;mask<(1<<rest.length);mask++){const pick=rest.filter((_,i)=>mask>>i&1);const cv=new Set(pick.flatMap(cubeMins));if(!left.every(m=>cv.has(m)))continue;\n    const cost=[pick.length,pick.reduce((a,c)=>a+lits(c),0)];if(!best||cost[0]<best.cost[0]||(cost[0]===best.cost[0]&&cost[1]<best.cost[1]))best={pick,cost}}best=best.pick}\n  return [...ess,...best].sort((a,b)=>lits(a)-lits(b)||(a<b?-1:1))}\nfunction termHTML(c,V){if(!c.includes('0')&&!c.includes('1'))return '1';return [...c].map((ch,i)=>ch==='-'?'':ch==='1'?V[i]:`<span class=\"nb\">${V[i]}<\/span>`).join('')}\nfunction sopHTML(cubes,V){return cubes.length?cubes.map(c=>termHTML(c,V)).join(' + '):'0'}\n// ---------- expression parser: + OR, juxtaposition or * or . AND, ' or ~ or ! NOT ----------\nfunction parseExpr(src){let s=src.replace(/\\s+/g,'').replace(/[\u00b7\u2022\u00d7]/g,'*').replace(/[\u2019`]/g,\"'\"),i=0;\n  const peek=()=>s[i];const vars=new Set();\n  function expr(){let t=[term()];while(peek()==='+'){i++;t.push(term())}return t.length===1?t[0]:{op:'or',k:t}}\n  function term(){let f=[factor()];while(i<s.length&&(peek()==='*'||peek()==='.'||/[A-Za-z(~!01]/.test(peek()))){if(peek()==='*'||peek()==='.')i++;f.push(factor())}return f.length===1?f[0]:{op:'and',k:f}}\n  function factor(){let neg=0;while(peek()==='~'||peek()==='!'){neg++;i++}let a=atom();while(peek()===\"'\"){a={op:'not',k:[a]};i++}while(neg--)a={op:'not',k:[a]};return a}\n  function atom(){const c=peek();if(c==='('){i++;const e=expr();if(peek()!==')')throw Error('missing )');i++;return e}\n    if(c==='0'||c==='1'){i++;return {op:'c',v:+c}}if(c&&/[A-Za-z]/.test(c)){i++;vars.add(c.toUpperCase());return {op:'v',n:c.toUpperCase()}}throw Error(c?`unexpected \u201c${c}\u201d`:'expression ends too early')}\n  if(!s)throw Error('empty');const e=expr();if(i<s.length)throw Error(`unexpected \u201c${s[i]}\u201d`);return {e,vars:[...vars].sort()}}\nfunction evalE(e,env){switch(e.op){case 'c':return e.v;case 'v':return env[e.n]?1:0;case 'not':return 1-evalE(e.k[0],env);case 'and':return e.k.every(x=>evalE(x,env))?1:0;case 'or':return e.k.some(x=>evalE(x,env))?1:0}}\nfunction sameFn(a,b,extraVars=[]){const V=[...new Set([...a.vars,...b.vars,...extraVars])].sort();for(let m=0;m<(1<<V.length);m++){const env={};V.forEach((v,j)=>env[v]=(m>>(V.length-1-j))&1);if(evalE(a.e,env)!==evalE(b.e,env))return {ok:false,env}}return {ok:true}}\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\nconst esc=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;');\nconst store={get(k,d){try{const v=localStorage.getItem('lg-'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('lg-'+k,JSON.stringify(v))}catch(e){}}};\nconst nb=x=>`<span class=\"nb\">${x}<\/span>`;\n// ---------- tabs ----------\nconst QS=[\n {tab:'Q1',sub:'Gates and truth tables',title:'Name each gate, fill its truth table',show:['s1'],\n  life:'A car starts only if the key is turned <strong>AND<\/strong> your foot is on the brake. A doorbell rings if the front <strong>OR<\/strong> the back button is pressed. The staircase light changes when either switch is flipped (<strong>XOR<\/strong>).',\n  how:['Look at the body: flat back + round front = AND, curved shield = OR, extra curve = XOR, triangle = NOT.','A small circle on a wire = NOT on that wire (before the input, or after the output).','Try the 4 combinations of A and B on the bench, then write each output in the table.'],\n  think:'Two gates of the tutorial have circles on their INPUTS. Which normal gate do they behave like? The two mystery gates below will tell you.'},\n {tab:'Q2',sub:'Commutative law',title:'Simplify with the commutative law',show:['s2'],\n  life:'A shopping list: \u201cmilk, bread\u201d and \u201cbread, milk\u201d are the same list. If \u201cmilk\u201d is written twice, you still buy one milk.',\n  how:['Move 1 \u00b7 Commutative law: write the letters of every bracket in A, B, C order.','Move 2 \u00b7 Find the twins: same letters, same bars.','Move 3 \u00b7 Idempotent law: X \u00b7 X = X and X + X = X, so keep only one.'],\n  think:'Follow the 3 moves on each tutorial expression. For b) and d), can another law make the answer even shorter?'},\n {tab:'Q3',sub:'K-map, 3 inputs',title:'From a 3-input truth table to a K-map',show:['s3'],n:3,\n  life:'Between two classes, do you go to the canteen? Three yes/no questions decide it. The K-map turns your long list of cases into one short rule.',\n  how:['8 lines \u2192 8 boxes. Rows: A. Columns: BC in the order 00, 01, 11, 10.','Copy the outputs: cut the Out column in blocks of 4, swap the 3rd and 4th box.','Circle the 1s in groups of 1, 2, 4 or 8, biggest first. Edges touch.','Read each group: a letter that changes disappears.'],\n  think:'Draw the K-map of the tutorial table. Which 1s can share a group? Is every 1 inside a group?'},\n {tab:'Q4',sub:'K-map, 4 inputs',title:'From a 4-input truth table to a K-map',show:['s3'],n:4,\n  life:'Lecture hall lights: A = weekday, B = daytime, C = a class is booked, D = people are inside. The lights should be on in some of the 16 cases. A 4\u00d74 K-map finds the short rule.',\n  how:['16 lines \u2192 16 boxes. Rows: AB, columns: CD, both in the order 00, 01, 11, 10.','Fill: blocks of 4 become rows, swap the 3rd and 4th box of each row, then swap the 3rd and 4th row.','Look for groups of 8 and 4 first (full rows, full columns, 2\u00d72 squares, the 4 corners).','Read each group with \u201csame or different?\u201d.'],\n  think:'In the tutorial table, find a group of 4 first. Which 1 is left alone, and which neighbour can it join?'},\n {tab:'Q5',sub:'Simplify two ways',title:'Simplify with algebra, then with a K-map',show:['s4'],\n  life:'You will go to the canteen if (not hungry, friend asks, no class soon) OR (hungry, no friend, no class soon) OR (hungry, friend asks, no class soon). Can you say it in fewer words?',\n  how:['Find two terms that are the same except for ONE letter.','If one term has two partners, copy it (X = X + X).','Take out the common part, then X\u0304 + X = 1 removes the letter.','Check with a K-map: you must get the same answer.'],\n  think:'Do the tutorial expression with both methods. Which term is used twice? Do the algebra and the K-map give the same answer?'}];\n$('#tabs').innerHTML=QS.map((q,i)=>`<button role=\"tab\" data-tab=\"${i}\" aria-selected=\"false\"><b>${q.tab}<\/b><span>${q.sub}<\/span><\/button>`).join('');\n$$('[data-tab]').forEach(b=>b.onclick=()=>tab(+b.dataset.tab));\nlet LN=0;\nfunction tab(i){if(typeof i==='string')i=({s1:0,s2:1,s3:LE&&LE.n===4?3:2,s4:4})[i]??0;i=Math.min(Math.max(0,i|0),QS.length-1);const q=QS[i];\n  $$('[data-tab]').forEach(b=>b.setAttribute('aria-selected',+b.dataset.tab===i));['s1','s2','s3','s4'].forEach(t=>$('#'+t).hidden=!q.show.includes(t));\n  $('#qTitle').textContent=`${q.tab} \u00b7 ${q.title}`;$('#qLife').innerHTML=q.life;$('#qHow').innerHTML=q.how.map(x=>`<li>${x}<\/li>`).join('');$('#qThink').textContent=q.think;\n  if(q.n&&typeof LEX!=='undefined'){LN=q.n;if(!LE||LE.n!==q.n){LE=LEX.find(e=>e.n===q.n);lS=0;sS=0;lStop();buildL();drawL();drawSC()}drawLexChips();if(K.n!==q.n)newK(q.n)}\n  store.set('q',i)}\n// ---------- station 1: gates ----------\nconst GATES=[\n {id:'and',name:'AND',body:'and',f:(a,b)=>a&b,rule:'Output = A \u00b7 B',life:'A car starts only if the key is turned AND your foot is on the brake.'},\n {id:'or',name:'OR',body:'or',f:(a,b)=>a|b,rule:'Output = A + B',life:'The doorbell rings if someone presses the front button OR the back button (or both).'},\n {id:'not',name
