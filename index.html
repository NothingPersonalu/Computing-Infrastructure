<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCA102 / CST131 Interactive Study Hub</title>
<style>
  :root {
    --bar-bg: #18202B;
    --bar-panel: #232D3B;
    --bar-ink: #F1F5F9;
    --bar-muted: #94A3B8;
    --bar-accent: #3B82F6;
    --bar-accent-hover: #2563EB;
    --bar-border: #334155;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0F172A;
    color: var(--bar-ink);
  }
  .app-shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  .topbar {
    background: var(--bar-bg);
    border-bottom: 1px solid var(--bar-border);
    padding: 10px 16px;
    padding-top: max(10px, env(safe-area-inset-top, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    z-index: 100;
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-badge {
    background: var(--bar-accent);
    color: #fff;
    font-weight: 800;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 6px;
    text-transform: uppercase;
  }
  .brand-title {
    font-weight: 700;
    font-size: 1.02rem;
    letter-spacing: -0.01em;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    flex: 1;
    justify-content: flex-end;
    min-width: 260px;
  }
  .select-wrap {
    position: relative;
    display: flex;
    align-items: center;
    flex: 1;
    max-width: 480px;
    min-width: 220px;
  }
  .select-wrap label {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--bar-muted);
    margin-right: 8px;
    white-space: nowrap;
  }
  select#topicSelect {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background: var(--bar-panel);
    color: var(--bar-ink);
    border: 1.5px solid var(--bar-border);
    border-radius: 8px;
    padding: 7px 34px 7px 12px;
    font: 600 0.92rem/1.3 inherit;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  select#topicSelect:hover {
    border-color: var(--bar-accent);
  }
  select#topicSelect:focus-visible {
    outline: 2px solid var(--bar-accent);
    outline-offset: 2px;
  }
  .select-arrow {
    position: absolute;
    right: 11px;
    pointer-events: none;
    color: var(--bar-muted);
    font-size: 0.75rem;
  }
  .nav-btns {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-btn {
    background: var(--bar-panel);
    color: var(--bar-ink);
    border: 1.5px solid var(--bar-border);
    border-radius: 8px;
    padding: 6px 11px;
    font: 600 0.85rem/1.2 inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }
  .nav-btn:hover:not(:disabled) {
    background: var(--bar-accent);
    border-color: var(--bar-accent);
    color: #fff;
  }
  .nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .topic-pills {
    background: #131A24;
    border-bottom: 1px solid var(--bar-border);
    padding: 6px 16px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: thin;
    flex-shrink: 0;
  }
  .pill {
    background: transparent;
    color: var(--bar-muted);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 4px 12px;
    font: 600 0.8rem/1.2 inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .pill:hover {
    color: var(--bar-ink);
    background: var(--bar-panel);
  }
  .pill[aria-selected="true"] {
    background: var(--bar-accent);
    color: #fff;
    border-color: var(--bar-accent);
  }
  .viewer {
    flex: 1;
    width: 100%;
    position: relative;
    background: #fff;
  }
  iframe#topicFrame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  @media (max-width: 640px) {
    .brand-title { display: none; }
    .select-wrap label { display: none; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand">
      <span class="brand-badge">CCA102</span>
      <span class="brand-title">Compilation Of CCA102</span>
    </div>
    <div class="controls">
      <div class="select-wrap">
        <label for="topicSelect">Study Topic:</label>
        <select id="topicSelect" aria-label="Choose a topic to study"></select>
        <span class="select-arrow" aria-hidden="true">▼</span>
      </div>
      <div class="nav-btns">
        <button class="nav-btn" id="prevTopic" title="Previous topic">◀ Prev</button>
        <button class="nav-btn" id="nextTopic" title="Next topic">Next ▶</button>
      </div>
    </div>
  </div>
  <div class="topic-pills" id="topicPills" role="tablist" aria-label="Quick topic switcher"></div>
  <main class="viewer">
    <iframe id="topicFrame" title="Interactive topic content"></iframe>
  </main>
</div>

<script>
const TOPICS = [{"fname": "2.Inside Numbers.html", "title": "2. Inside Numbers", "desc": "Tutorial 2 \u00b7 Number bases & conversions", "html": "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Inside Numbers<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#F1EFEA; --panel:#FFFFFF; --ink:#1F2433; --muted:#5D6375; --line:#D3D0C7; --soft:#E9E6DE;\n  --b2:#2F6FDB; --b8:#7B5EA7; --b10:#2E8B57; --b16:#C2571A; --hl:#FFF1C9; --ok:#2E8B57;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#15171D; --panel:#1E212A; --ink:#E8E9EE; --muted:#A3A8B8; --line:#353A47; --soft:#2A2E39;\n    --b2:#6C9BF0; --b8:#A98BD6; --b10:#4FB57D; --b16:#EE8A4F; --hl:#3A3420; --ok:#4FB57D;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#15171D; --panel:#1E212A; --ink:#E8E9EE; --muted:#A3A8B8; --line:#353A47; --soft:#2A2E39;\n  --b2:#6C9BF0; --b8:#A98BD6; --b10:#4FB57D; --b16:#EE8A4F; --hl:#3A3420; --ok:#4FB57D;\n}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 \"Atkinson Hyperlegible\",system-ui,-apple-system,\"Segoe UI\",sans-serif}\nh1,h2,h3{font-family:\"Bricolage Grotesque\",\"Segoe UI\",system-ui,sans-serif;line-height:1.1;margin:0}\n.mono,.n{font-family:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace}\n.wrap{max-width:1120px;margin:0 auto;padding:28px 16px 60px}\nheader{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}\nh1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;letter-spacing:-.02em}\nheader p{margin:6px 0 0;color:var(--muted);max-width:56ch}\n.legend{display:flex;flex-wrap:wrap;gap:8px}\n.chip{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}\n.dot{width:10px;height:10px;border-radius:50%;display:inline-block}\nnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;padding:10px 0;margin-bottom:14px;border-bottom:2px solid var(--line)}\nnav button{font:inherit;text-align:left;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);border-radius:10px;color:var(--ink);padding:7px 10px;cursor:pointer;line-height:1.2}\nnav button:hover{border-color:var(--ink)}\nnav button b{font-size:1.05rem}\nnav button span{font-size:.82rem;color:var(--muted)}\nnav button[aria-selected=\"true\"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}\nnav button[aria-selected=\"true\"] span{color:var(--panel)}\nbutton:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--b2);outline-offset:2px}\n.pager{display:flex;justify-content:space-between;gap:10px;margin:0 0 14px}\n.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px}\n@media (max-width:820px){.lab{grid-template-columns:1fr}}\n.intro h2{font-size:1.6rem;font-weight:800;margin-bottom:10px}\n.intro p{margin:0 0 12px;max-width:44ch}\n.how{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px}\n.how ol{margin:6px 0 0;padding-left:20px}\n.how li{margin:3px 0}\n.think{background:var(--panel);border-left:4px solid var(--ink);padding:12px 14px;border-radius:0 8px 8px 0}\n.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}\n.btn{font:inherit;font-weight:700;font-size:.95rem;padding:8px 14px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer}\n.btn.ghost{background:transparent;color:var(--ink)}\n.btn.sm{padding:5px 10px;font-size:.88rem}\n.btn.on{background:var(--b2);border-color:var(--b2);color:#fff}\n.btn:disabled{opacity:.4;cursor:not-allowed}\n.problem{font-size:1.25rem;font-weight:700;margin:4px 0 12px}\n.problem .n{font-size:1.35rem}\nsub{font-size:.65em}\n.steps{display:flex;flex-direction:column;gap:6px;min-height:120px}\n.step{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel);transition:background .4s}\n.step.new{background:var(--hl)}\n.step .lbl{font-size:.8rem;color:var(--muted);font-weight:700;display:block;margin-bottom:2px}\ntable.t{border-collapse:collapse;font-size:.95rem}\ntable.t td,table.t th{padding:4px 10px;border-bottom:1px solid var(--line);text-align:right}\ntable.t th{font-size:.78rem;color:var(--muted);font-weight:700}\ntable.t tr.hl td{background:var(--hl)}\n.result{margin-top:12px;border:2px solid var(--ok);border-radius:10px;padding:10px 14px;font-size:1.15rem;font-weight:700;display:none}\n.result.on{display:block}\n.result .n{font-size:1.3rem}\n.bits{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:flex-end;vertical-align:middle}\n.grp{display:inline-flex;flex-direction:column;align-items:center;gap:2px}\n.grp .bx{display:inline-flex;border:2px solid var(--c,var(--ink));border-radius:6px;overflow:hidden}\n.grp .bx span{width:22px;height:26px;display:inline-flex;align-items:center;justify-content:center;font:700 .95rem \"JetBrains Mono\",monospace;border-right:1px solid var(--line)}\n.grp .bx span:last-child{border-right:0}\n.grp .bx span.pad{color:var(--muted);background:var(--soft)}\n.grp small{font:700 .9rem \"JetBrains Mono\",monospace;color:var(--c,var(--ink))}\n.pv{display:flex;gap:4px;flex-wrap:wrap;align-items:stretch}\n.pv .col{border:1px solid var(--line);border-radius:6px;padding:4px 8px;text-align:center;min-width:56px}\n.pv .col .h{font-size:.75rem;color:var(--muted)}\n.pv .col .d{font:700 1.2rem \"JetBrains Mono\",monospace}\n.pv .col .v{font-size:.8rem}\n.pv .pt{align-self:center;font:700 1.6rem \"JetBrains Mono\",monospace;padding:0 2px}\n.line{position:relative;height:70px;margin:12px 6px 4px;border-bottom:3px solid var(--ink)}\n.line .tick{position:absolute;bottom:-22px;transform:translateX(-50%);font-size:.75rem;color:var(--muted)}\n.line .mk{position:absolute;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:.8rem;font-weight:700;white-space:nowrap}\n.line .mk i{width:3px;height:16px;background:currentColor;display:block}\n.digits{display:flex;flex-wrap:wrap;gap:4px;font-size:.82rem;color:var(--muted);margin-top:8px}\n.digits span{border:1px solid var(--line);border-radius:5px;padding:1px 6px}\nfooter{margin-top:40px;color:var(--muted);font-size:.9rem}\n@media (prefers-reduced-motion: reduce){.step{transition:none}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header>\n  <div>\n    <h1>Inside Numbers<\/h1>\n    <p>CCA102 / CST131 Computer Organisation, Tutorial 2. Each tab shows the method step by step on a different number. Watch the steps, press New example to practise the method, then solve the tutorial question on paper.<\/p>\n  <\/div>\n  <div class=\"legend\" aria-label=\"Base colours\">\n    <span class=\"chip\"><i class=\"dot\" style=\"background:var(--b2)\"><\/i>Binary (2)<\/span>\n    <span class=\"chip\"><i class=\"dot\" style=\"background:var(--b8)\"><\/i>Octal (8)<\/span>\n    <span class=\"chip\"><i class=\"dot\" style=\"background:var(--b10)\"><\/i>Decimal (10)<\/span>\n    <span class=\"chip\"><i class=\"dot\" style=\"background:var(--b16)\"><\/i>Hex (16)<\/span>\n  <\/div>\n<\/header>\n\n<nav role=\"tablist\" aria-label=\"Tutorial 2 questions\" id=\"nav\"><\/nav>\n<div class=\"pager\" id=\"pager\"><\/div>\n\n<section class=\"lab\">\n  <div class=\"intro\">\n    <h2 id=\"qTitle\"><\/h2>\n    <div class=\"how\"><b>The method<\/b><ol id=\"qHow\"><\/ol><\/div>\n    <p class=\"think\" id=\"qThink\"><\/p>\n  <\/div>\n  <div class=\"stage\">\n    <div class=\"row\" id=\"examples\"><\/div>\n    <div class=\"problem\" id=\"problem\"><\/div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"next\">Next step<\/button>\n      <button class=\"btn ghost\" id=\"play\">Play<\/button>\n      <button class=\"btn ghost\" id=\"all\">Show all steps<\/button>\n      <button class=\"btn ghost sm\" id=\"restart\">Restart<\/button>\n    <\/div>\n    <div class=\"steps\" id=\"steps\" aria-live=\"polite\"><\/div>\n    <div class=\"result\" id=\"result\"><\/div>\n    <div class=\"digits\" id=\"digits\"><\/div>\n  <\/div>\n<\/section>\n\n<footer>Method companion for Tutorial 2. The examples use different numbers from the tutorial: use the same method on the real questions.<\/footer>\n<\/div>\n\n<script>\nconst $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];\nconst DG='0123456789ABCDEF';\nconst COL={2:'var(--b2)',8:'var(--b8)',10:'var(--b10)',16:'var(--b16)'};\nconst colB=b=>COL[b]||'var(--ink)';\nconst N=(s,b)=>`<span class=\"n\" style=\"color:${colB(b)}\">${s}<\/span><sub>${b}<\/sub>`;\nconst rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));\nconst pick=a=>a[Math.floor(Math.random()*a.length)];\n\n// ---------- exact arithmetic with fractions (numerator / power-of-base denominators stay small) ----------\nfunction gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}\nfunction F(n,d=1){const g=gcd(n,d)||1;return {n:n/g,d:d/g};}\nconst add=(x,y)=>F(x.n*y.d+y.n*x.d,x.d*y.d);\nfunction fstr(x){ // decimal string (terminating for our denominators)\n  const ip=Math.floor(x.n/x.d); let r=x.n-ip*x.d; if(!r) return String(ip);\n  let s=ip+'.'; let k=0; while(r&&k<10){r*=10;s+=Math.floor(r/x.d);r%=x.d;k++;} return s;\n}\nfunction parseBase(s,b){ const [i,f='']=s.split('.'); let v=F(0);\n  for(const c of i) v=add(F(v.n*b,v.d),F(DG.indexOf(c)));\n  [...f].forEach((c,k)=>{v=add(v,F(DG.indexOf(c),b**(k+1)));}); return v; }\nfunction intTo(n,b){ if(n===0) return '0'; let s=''; while(n){s=DG[n%b]+s;n=Math.floor(n/b);} return s; }\nconst sup=k=>`<sup>${k}<\/sup>`;\n\n// ---------- step builders ----------\nfunction expandSteps(s,b,label){ // base b -> decimal, one row per digit\n  const [i,f='']=s.split('.'); const rows=[]; let tot=F(0);\n  [...i].forEach((c,k)=>{const p=i.length-1-k, d=DG.indexOf(c); const v=F(d*b**p); tot=add(tot,v); rows.push([c,(d>9?`${c} = ${d}`:''),`${b}${sup(p)} = ${b**p}`,`${d} \u00d7 ${b**p}`,fstr(v)]);});\n  [...f].forEach((c,k)=>{const p=-(k+1), d=DG.indexOf(c); const v=F(d,b**(k+1)); tot=add(tot,v); rows.push([c,(d>9?`${c} = ${d}`:''),`${b}${sup(p)} = 1/${b**(k+1)}`,`${d} \u00f7 ${b**(k+1)}`,fstr(v)]);});\n  const st=[];\n  st.push({lbl:label||'Step: write the place value of each digit',html:`Each position is a power of ${b}. Left of the point: ${b}${sup(0)}, ${b}${sup(1)}, ${b}${sup(2)}\u2026 Right of the point: ${b}${sup('\u22121')}, ${b}${sup('\u22122')}\u2026`});\n  st.push({lbl:'Multiply each digit by its place value',html:`<table class=\"t\"><tr><th>digit<\/th><th>${b===16?'value':''}<\/th><th>place value<\/th><th>calculation<\/th><th>result<\/th><\/tr>${rows.map(r=>`<tr><td class=\"n\">${r[0]}<\/td><td>${r[1]}<\/td><td>${r[2]}<\/td><td>${r[3]}<\/td><td class=\"n\">${r[4]}<\/td><\/tr>`).join('')}<\/table>`});\n  st.push({lbl:'Add everything',html:`${rows.map(r=>r[4]).join(' + ')} = <b class=\"n\">${fstr(tot)}<\/b>`});\n  return {st,val:tot};\n}\nfunction divSteps(n,b){ // decimal int -> base b\n  const rows=[]; let x=n; if(x===0) rows.push([0,0,0]);\n  while(x>0){rows.push([x,Math.floor(x/b),x%b]);x=Math.floor(x/b);}\n  const res=rows.map(r=>DG[r[2]]).reverse().join('');\n  return {st:[\n    {lbl:`Divide by ${b} again and again, keep the remainders`,html:`<table class=\"t\"><tr><th>number<\/th><th>\u00f7 ${b}<\/th><th>quotient<\/th><th>remainder<\/th><\/tr>${rows.map(r=>`<tr><td class=\"n\">${r[0]}<\/td><td>\u00f7 ${b}<\/td><td class=\"n\">${r[1]}<\/td><td class=\"n\" style=\"color:${colB(b)}\">${DG[r[2]]}${r[2]>9?` (${r[2]})`:''}<\/td><\/tr>`).join('')}<\/table>Stop when the quotient is 0.`},\n    {lbl:'Read the remainders from the bottom to the top',html:`${rows.map(r=>DG[r[2]]).reverse().join(' ')} \u2192 <b>${N(res,b)}<\/b>`}\n  ],res};\n}\nfunction mulSteps(fr,b){ // fraction part -> base b\n  const rows=[]; let x=fr, k=0;\n  while(x.n!==0&&k<10){ const m=F(x.n*b,x.d); const d=Math.floor(m.n/m.d); rows.push([fstr(x),fstr(m),d]); x=F(m.n-d*m.d,m.d); k++; }\n  const res=rows.map(r=>DG[r[2]]).join('');\n  return {st:[\n    {lbl:`Fraction part: multiply by ${b} again and again, keep the whole part`,html:`<table class=\"t\"><tr><th>fraction<\/th><th>\u00d7 ${b}<\/th><th>result<\/th><th>whole part<\/th><\/tr>${rows.map(r=>`<tr><td class=\"n\">${r[0]}<\/td><td>\u00d7 ${b}<\/td><td class=\"n\">${r[1]}<\/td><td class=\"n\" style=\"color:${colB(b)}\">${DG[r[2]]}<\/td><\/tr>`).join('')}<\/table>Continue with the fraction left over; stop when it is 0.`},\n    {lbl:'Read the whole parts from the top to the bottom',html:`. ${rows.map(r=>DG[r[2]]).join(' ')} \u2192 <b>${N('0.'+res,b)}<\/b>`}\n  ],res};\n}\nfunction boxes(bits,c,padLeft=0){ return `<span class=\"bx\" style=\"--c:${c}\">${[...bits].map((x,k)=>`<span class=\"${k<padLeft?'pad':''}\">${x}<\/span>`).join('')}<\/span>`; }\nfunction regroup(bin,size){ // returns groups from right, with padding\n  const pad=(size-bin.length%size)%size; const full='0'.repeat(pad)+bin; const g=[];\n  for(let k=0;k<full.length;k+=size) g.push(full.slice(k,k+size)); return {g,pad};\n}\nfunction trimZeros(s){ const t=s.replace(/^0+/,''); return t||'0'; }\n\n// ---------- questions ----------\nconst TUT={q1:['1.1|2','1.4|10','1.5|16'],q2:['54|8|5','312|4|7','520|6|7','12212|3|9'],q3:['28','125','209','14.625','25.625','35.25'],q4:['C.7','B9.A','875.1','BAD.E','46D','19A'],q5:['12','5655','2550276','765453336','3726755'],q6:['4FB2','88BAE','DC4']};\nconst Q={\nq1:{tab:'Q1',sub:'Compare bases',title:'Compare numbers written in different bases',\n how:['Convert each number to decimal, using place values.','Right of the point, positions are 1/base, 1/base\u00b2, \u2026','Compare the decimal values. The same digits can mean different values!'],\n think:'Why can \"1.1\" be bigger in base 2 than \"1.5\" in base 16? What does the first digit after the point really count in each base?',\n ex:[['10.1|2','2.7|10','2.A|16'],['1.11|2','1.6|10','1.8|16'],['11.1|2','3.3|8','3.4|16']],\n gen(){ const a=['1'+pick(['0','1'])+'.'+pick(['1','01','11'])+'|2', rnd(1,3)+'.'+rnd(1,9)+'|10', rnd(1,3)+'.'+pick([...'89ABCDE'])+'|16']; return a; },\n fmt(e){return e.map(x=>{const[s,b]=x.split('|');return N(s,+b);}).join(' , ');},\n build(e){ const st=[], vals=[];\n  e.forEach(x=>{const[s,b]=x.split('|'); const r=expandSteps(s,+b,`Convert ${s} (base ${b}) to decimal`); vals.push([s,+b,r.val]); st.push(...r.st);});\n  const sorted=[...vals].sort((a,b)=>a[2].n/a[2].d-b[2].n/b[2].d);\n  const lo=Math.floor(sorted[0][2].n/sorted[0][2].d), hi=Math.ceil(sorted[2][2].n/sorted[2][2].d+.0001);\n  const pos=v=>((v.n/v.d-lo)/(hi-lo||1))*100;\n  let ticks=''; for(let t=lo;t<=hi;t+=0.5) ticks+=`<span class=\"tick\" style=\"left:${(t-lo)/(hi-lo||1)*100}%\">${t}<\/span>`;\n  st.push({lbl:'Place them on a number line',html:`<div class=\"line\">${ticks}${vals.map((v,k)=>`<span class=\"mk\" style=\"left:${pos(v[2])}%;color:${colB(v[1])};bottom:${k*18}px\">${v[0]}<sub>${v[1]}<\/sub> = ${fstr(v[2])}<i><\/i><\/span>`).join('')}<\/div>`});\n  const vv=v=>v[2].n/v[2].d; return {st,res:'Smallest to largest: '+sorted.map((v,k)=>(k?(vv(v)===vv(sorted[k-1])?' = ':' &lt; '):'')+`${N(v[0],v[1])} (${fstr(v[2])})`).join('')}; }},\nq2:{tab:'Q2',sub:'Base to base',title:'From one base to another (through decimal)',\n how:['Convert the number to decimal: digit \u00d7 base<sup>position<\/sup>, then add.','Convert the decimal number to the new base: divide by the new base again and again.','Read the remainders from the bottom up.'],\n think:'Why is going through base 10 the safest way when neither base is 2, 8 or 16? Check: can a digit in base 5 ever be 5 or more?',\n ex:['63|8|5','231|4|7','1022|3|9','413|5|6'],\n gen(){ let b,t,s; do{ b=rnd(3,8); t=rnd(3,9); if(t===b) continue; const len=rnd(2,4); s=String(rnd(1,b-1)); for(let k=1;k<len;k++) s+=rnd(0,b-1); }while(!s||t===b); return `${s}|${b}|${t}`; },\n fmt(e){const[s,b,t]=e.split('|');return `${N(s,+b)} \u2192 base ${t}`;},\n build(e){ const[s,b,t]=e.split('|'); const a=expandSteps(s,+b,`Part 1 \u2013 ${s} (base ${b}) to decimal`); const n=a.val.n; const d=divSteps(n,+t);\n  return {st:[...a.st,{lbl:`Part 2 \u2013 ${n} (decimal) to base ${t}`,html:`Now take ${N(n,10)} and convert it to base ${t}.`},...d.st],res:`${N(s,+b)} = ${N(n,10)} = ${N(d.res,+t)}`}; }},\nq3:{tab:'Q3',sub:'Decimal \u2192 binary',title:'Decimal to binary (with a fraction part)',\n how:['Split the number: whole part and fraction part.','Whole part: divide by 2 again and again, read the remainders bottom-up.','Fraction part: multiply by 2 again and again, read the whole parts top-down.','Put the two parts together with a point.'],\n think:'Why do we read the remainders upward but the fraction digits downward? Try 0.5, 0.25 and 0.125: what pattern do you see?',\n ex:['19','37.375','13.75','92.125'],\n gen(){ return rnd(10,250)+pick(['','','.5','.25','.75','.125','.375','.625','.875']); },\n fmt(e){return `${N(e,10)} \u2192 binary`;},\n build(e){ const[i,f]=e.split('.'); const st=[{lbl:'Split the number',html:`Whole part: <b class=\"n\">${i}<\/b>${f?` \u00b7 Fraction part: <b class=\"n\">0.${f}<\/b>`:' \u00b7 no fraction part'}`}];\n  const d=divSteps(+i,2); st.push(...d.st); let res=d.res;\n  if(f){ const m=mulSteps(F(+f,10**f.length),2); st.push(...m.st); res+='.'+m.res; st.push({lbl:'Join both parts',html:`${N(d.res,2)} and ${N('0.'+m.res,2)} \u2192 <b>${N(res,2)}<\/b>`}); }\n  return {st,res:`${N(e,10)} = ${N(res,2)}`}; }},\nq4:{tab:'Q4',sub:'Hex \u2192 decimal',title:'Hexadecimal to decimal',\n how:['Replace each letter by its value: A=10, B=11, C=12, D=13, E=14, F=15.','Multiply each digit by its power of 16 (16<sup>\u22121<\/sup> = 1/16 after the point).','Add everything.'],\n think:'Why does one hex digit after the point always give a fraction with 16 at the bottom? What is 8/16 as a decimal?',\n ex:['A3.8','2F.C','1B4','E0.4'],\n gen(){ const n=rnd(1,3); let s=pick([...'123456789ABCDEF']); for(let k=1;k<n;k++) s+=pick([...DG]); if(Math.random()<.6) s+='.'+pick([...'123456789ABCDEF']); return s; },\n fmt(e){return `${N(e,16)} \u2192 decimal`;},\n build(e){ const r=expandSteps(e,16,'Write the place value of each hex digit'); return {st:r.st,res:`${N(e,16)} = ${N(fstr(r.val),10)}`}; }},\nq5:{tab:'Q5',sub:'Octal \u2192 hex',title:'Octal to hexadecimal (through binary)',\n how:['Write each octal digit as 3 bits (8 = 2\u00b3).','Join all the bits.','Regroup the bits in groups of 4, starting from the RIGHT (16 = 2\u2074). Add zeros on the left if needed.','Write each group of 4 as one hex digit.'],\n think:'Why 3 bits for octal and 4 bits for hex? Why must the regrouping start from the right?',\n ex:['37','4127','615340','70251'],\n gen(){ const n=rnd(2,7); let s=String(rnd(1,7)); for(let k=1;k<n;k++) s+=rnd(0,7); return s; },\n fmt(e){return `${N(e,8)} \u2192 hexadecimal`;},\n build(e){ const tri=[...e].map(c=>parseInt(c,8).toString(2).padStart(3,'0')); const bin=tri.join('');\n  const g=regroup(bin,4); const hex=g.g.map(x=>DG[parseInt(x,2)]).join(''); const res=trimZeros(hex);\n  let used=0; const gHtml=g.g.map((x,k)=>{const pl=k===0?g.pad:0; return `<span class=\"grp\" style=\"--c:var(--b16)\">${boxes(x,'var(--b16)',pl)}<small>${DG[parseInt(x,2)]}<\/small><\/span>`;}).join('');\n  return {st:[\n   {lbl:'Each octal digit \u2192 3 bits',html:`<span class=\"bits\">${[...e].map((c,k)=>`<span class=\"grp\" style=\"--c:var(--b8)\">${boxes(tri[k],'var(--b8)')}<small>${c}<\/small><\/span>`).join('')}<\/span>`},\n   {lbl:'Join the bits',html:`<span class=\"n\">${bin}<\/span> (${bin.length} bits)`},\n   {lbl:'Regroup by 4 from the right (grey = zeros added on the left)',html:`<span class=\"bits\">${gHtml}<\/span>`},\n   {lbl:'Read the hex digits',html:`${g.g.map(x=>`${x} = ${DG[parseInt(x,2)]}`).join(' \u00b7 ')} \u2192 <b>${N(res,16)}<\/b>${hex!==res?' (leading 0 dropped)':''}`}\n  ],res:`${N(e,8)} = ${N(res,16)}`}; }},\nq6:{tab:'Q6',sub:'Hex \u2192 bin, oct, dec',title:'Hexadecimal to binary, octal and decimal',\n how:['Binary: write each hex digit as 4 bits.','Octal: regroup those bits by 3 from the right, each group is one octal digit.','Decimal: digit \u00d7 16<sup>position<\/sup>, then add.'],\n think:'Which of the three conversions needs no calculation at all? Why is binary the bridge between hex and octal?',\n ex:['3A7','B5E','2C9D','F10'],\n gen(){ const n=rnd(3,5); let s=pick([...'123456789ABCDEF']); for(let k=1;k<n;k++) s+=pick([...DG]); return s; },\n fmt(e){return `${N(e,16)} \u2192 binary, octal, decimal`;},\n build(e){ const q=[...e].map(c=>parseInt(c,16).toString(2).padStart(4,'0')); const bin=trimZeros(q.join(''));\n  const g=regroup(bin,3); const oct=trimZeros(g.g.map(x=>parseInt(x,2)).join(''));\n  const dec=expandSteps(e,16,'Decimal: place value of each hex digit');\n  return {st:[\n   {lbl:'Binary: each hex digit \u2192 4 bits',html:`<span class=\"bits\">${[...e].map((c,k)=>`<span class=\"grp\" style=\"--c:var(--b16)\">${boxes(q[k],'var(--b16)')}<small>${c}<\/small><\/span>`).join('')}<\/span><br>\u2192 ${N(bin,2)}${q.join('')!==bin?' (leading zeros dropped)':''}`},\n   {lbl:'Octal: regroup the bits by 3 from the right',html:`<span class=\"bits\">${g.g.map((x,k)=>`<span class=\"grp\" style=\"--c:var(--b8)\">${boxes(x,'var(--b8)',k===0?g.pad:0)}<small>${parseInt(x,2)}<\/small><\/span>`).join('')}<\/span><br>\u2192 ${N(oct,8)}`},\n   ...dec.st\n  ],res:`${N(e,16)} = ${N(bin,2)} = ${N(oct,8)} = ${N(fstr(dec.val),10)}`}; }}\n};\nconst KEYS=Object.keys(Q);\n\n// ---------- player ----------\nlet cur='q1', ex=null, data=null, shown=0, timer=null;\n$('#nav').innerHTML=KEYS.map((k,i)=>`<button role=\"tab\" aria-selected=\"${i===0}\" data-q=\"${k}\"><b>${Q[k].tab}<\/b><span>${Q[k].sub}<\/span><\/button>`).join('');\n$$('[data-q]').forEach(b=>b.onclick=()=>load(b.dataset.q,true));\nfunction isTut(k,e){ return Array.isArray(e)?e.some(x=>TUT[k].includes(x)):TUT[k].includes(e); }\nfunction setEx(e){ stop(); ex=e; data=Q[cur].build(e); shown=0; $('#problem').innerHTML='Example: '+Q[cur].fmt(e); render(); drawEx(); }\nfunction drawEx(){\n  const q=Q[cur];\n  $('#examples').innerHTML='<span style=\"color:var(--muted);font-size:.9rem\">Examples:<\/span>'+q.ex.map((e,i)=>`<button class=\"btn sm ${JSON.stringify(e)===JSON.stringify(ex)?'on':'ghost'}\" data-ex=\"${i}\">${Array.isArray(e)?e.map(x=>x.split('|')[0]).join(' \u00b7 '):e.split('|')[0]}<\/button>`).join('')+'<button class=\"btn sm ghost\" id=\"newEx\">New example<\/button>';\n  $$('[data-ex]').forEach(b=>b.onclick=()=>setEx(q.ex[+b.dataset.ex]));\n  $('#newEx').onclick=()=>{ let e,g=0; do{ e=q.gen(); g++; }while(isTut(cur,e)&&g<50); setEx(e); };\n}\nfunction render(){\n  $('#steps').innerHTML=data.st.slice(0,shown).map((s,i)=>`<div class=\"step ${i===shown-1?'new':''}\"><span class=\"lbl\">Step ${i+1}. ${s.lbl}<\/span>${s.html}<\/div>`).join('')||'<p style=\"color:var(--muted)\">Press <b>Next step<\/b> to start, or try the question yourself first.<\/p>';\n  const done=shown>=data.st.length; $('#result').classList.toggle('on',done); $('#result').innerHTML=done?'Result: '+data.res:'';\n  $('#next').disabled=done; $('#all').disabled=done;\n  const last=$('#steps .step:last-child'); if(last&&shown>1) last.scrollIntoView({block:'nearest',behavior:'smooth'});\n}\nfunction stop(){ clearInterval(timer); timer=null; $('#play').textContent='Play'; }\n$('#next').onclick=()=>{ stop(); if(shown<data.st.length){shown++;render();} };\n$('#all').onclick=()=>{ stop(); shown=data.st.length; render(); };\n$('#restart').onclick=()=>{ stop(); shown=0; render(); };\n$('#play').onclick=()=>{ if(timer){stop();return;} if(shown>=data.st.length) shown=0; $('#play').textContent='Pause';\n  const tickf=()=>{ if(shown<data.st.length){shown++;render();} if(shown>=data.st.length) stop(); }; tickf(); timer=setInterval(tickf,3200); };\nfunction load(k,scroll){\n  cur=k; const q=Q[k];\n  $$('[data-q]').forEach(b=>b.setAttribute('aria-selected',b.dataset.q===k));\n  $('#qTitle').textContent=q.title; $('#qHow').innerHTML=q.how.map(x=>`<li>${x}<\/li>`).join(''); $('#qThink').innerHTML='<strong>Think:<\/strong> '+q.think;\n  $('#digits').innerHTML=(k==='q4'||k==='q6'||k==='q5')?[...'0123456789ABCDEF'].map((c,i)=>`<span><b class=\"mono\">${c}<\/b> = ${i}${k!=='q4'?` = <span class=\"mono\">${i.toString(2).padStart(4,'0')}<\/span>`:''}<\/span>`).join(''):'';\n  const i=KEYS.indexOf(k);\n  $('#pager').innerHTML=(i>0?`<button class=\"btn ghost\" id=\"prevQ\">Previous: ${Q[KEYS[i-1]].tab}<\/button>`:'<span><\/span>')+(i<KEYS.length-1?`<button class=\"btn\" id=\"nextQ\">Next: ${Q[KEYS[i+1]].tab}<\/button>`:'');\n  if(i>0) $('#prevQ').onclick=()=>load(KEYS[i-1],true);\n  if(i<KEYS.length-1) $('#nextQ').onclick=()=>load(KEYS[i+1],true);\n  setEx(q.ex[0]);\n  if(scroll){const top=$('#pager').getBoundingClientRect().top+scrollY-$('nav').offsetHeight-10; if(scrollY>top) scrollTo({top});}\n}\nload('q1',false);\n<\/script>\n<\/body>\n<\/html>\n\n<\/body><\/html>"}, {"fname": "2.Numbers in Your Computer.html", "title": "2. Numbers in Your Computer", "desc": "Tutorial 2 in practice \u00b7 Calculator, colours, ASCII, files, IP", "html": "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Numbers in Your Computer<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#F1EFEA; --panel:#FFFFFF; --ink:#1F2433; --muted:#5D6375; --line:#D3D0C7; --soft:#E9E6DE;\n  --b2:#2F6FDB; --b8:#7B5EA7; --b10:#2E8B57; --b16:#C2571A; --term:#14161C; --termtx:#D7F5DE; --bad:#C0392B;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#15171D; --panel:#1E212A; --ink:#E8E9EE; --muted:#A3A8B8; --line:#353A47; --soft:#2A2E39;\n    --b2:#6C9BF0; --b8:#A98BD6; --b10:#4FB57D; --b16:#EE8A4F; --term:#0B0C10; --bad:#E86A5C;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#15171D; --panel:#1E212A; --ink:#E8E9EE; --muted:#A3A8B8; --line:#353A47; --soft:#2A2E39;\n  --b2:#6C9BF0; --b8:#A98BD6; --b10:#4FB57D; --b16:#EE8A4F; --term:#0B0C10; --bad:#E86A5C;\n}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 \"Atkinson Hyperlegible\",system-ui,-apple-system,\"Segoe UI\",sans-serif}\nh1,h2,h3{font-family:\"Bricolage Grotesque\",\"Segoe UI\",system-ui,sans-serif;line-height:1.12;margin:0}\n.n,code,kbd,.mono{font-family:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace}\n.wrap{max-width:1120px;margin:0 auto;padding:28px 16px 60px}\nheader{margin-bottom:16px}\nh1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;letter-spacing:-.02em}\nheader p{margin:6px 0 0;color:var(--muted);max-width:62ch}\nnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:10px 0;margin-bottom:14px;border-bottom:2px solid var(--line)}\nnav button{font:inherit;text-align:left;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);border-radius:10px;color:var(--ink);padding:7px 10px;cursor:pointer;line-height:1.2}\nnav button:hover{border-color:var(--ink)}\nnav button b{font-size:.98rem} nav button span{font-size:.8rem;color:var(--muted)}\nnav button[aria-selected=\"true\"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}\nnav button[aria-selected=\"true\"] span{color:var(--panel)}\nbutton:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--b2);outline-offset:2px}\n.pager{display:flex;justify-content:space-between;gap:10px;margin:0 0 14px}\n.st[hidden]{display:none!important}\n.st{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:22px}\n@media (max-width:860px){.st{grid-template-columns:1fr}}\n.left h2{font-size:1.65rem;font-weight:800;margin-bottom:8px}\n.where{color:var(--muted);margin:0 0 12px}\n.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);margin:0 6px 10px 0}\n.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}\n.box h3{font-size:1rem;margin-bottom:6px}\n.os{display:flex;gap:4px;margin-bottom:8px}\n.os button{font:inherit;font-size:.85rem;font-weight:700;padding:3px 10px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}\n.os button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}\n.box ol{margin:0;padding-left:20px} .box li{margin:4px 0}\nkbd{font-size:.85rem;background:var(--soft);border:1px solid var(--line);border-bottom-width:3px;border-radius:5px;padding:0 6px}\ncode{font-size:.9rem;background:var(--soft);padding:1px 5px;border-radius:4px}\n.term{background:var(--term);color:var(--termtx);border-radius:10px;padding:10px 12px;font:500 .9rem \"JetBrains Mono\",monospace;white-space:pre-wrap;overflow-x:auto;position:relative}\n.term .c{color:#8C93A6}\n.copy{position:absolute;top:6px;right:6px;font:700 .75rem \"Atkinson Hyperlegible\",sans-serif;padding:2px 8px;border-radius:6px;border:1px solid #444;background:#2A2D36;color:#fff;cursor:pointer}\n.think{background:var(--panel);border-left:4px solid var(--ink);padding:10px 14px;border-radius:0 8px 8px 0}\n.try{background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:16px;min-width:0}\n.try h3{font-size:1.05rem;margin-bottom:10px}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}\ninput[type=text],input[type=number],select{font:inherit;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}\ninput.mono{font-family:\"JetBrains Mono\",monospace}\n.btn{font:inherit;font-weight:700;font-size:.92rem;padding:7px 12px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer}\n.btn.ghost{background:transparent;color:var(--ink)}\ntable.t{border-collapse:collapse;font-size:.95rem;width:100%}\ntable.t td,table.t th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}\ntable.t th{font-size:.78rem;color:var(--muted)}\n.b2{color:var(--b2)} .b8{color:var(--b8)} .b10{color:var(--b10)} .b16{color:var(--b16)}\n.sw{width:100%;height:90px;border-radius:10px;border:1px solid var(--line);margin-bottom:10px}\n.perm{border-collapse:collapse;margin-bottom:10px}\n.perm td,.perm th{padding:6px 10px;text-align:center;border:1px solid var(--line)}\n.perm th{font-size:.8rem;color:var(--muted)}\n.big{font:700 1.6rem \"JetBrains Mono\",monospace}\n.bytes{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin:8px 0}\n.bytes span{border:1px solid var(--line);border-radius:6px;text-align:center;padding:4px 0;font:700 .9rem \"JetBrains Mono\",monospace}\n.bytes small{display:block;font-size:.7rem;color:var(--muted);font-weight:500}\n.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted)}\n.bar{height:22px;border-radius:6px;background:var(--soft);overflow:hidden;display:flex;margin:4px 0 10px}\n.bar i{display:block;height:100%}\n.out{font:700 1.05rem \"JetBrains Mono\",monospace;word-break:break-all}\n.note{font-size:.88rem;color:var(--muted)}\nfooter{margin-top:40px;color:var(--muted);font-size:.9rem}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header>\n  <h1>Numbers in Your Computer<\/h1>\n  <p>CCA102 / CST131, Tutorial 2 in practice. Binary, octal, decimal and hexadecimal are not just exercises: your computer shows them every day. In each station, do the steps on your own computer, then play with the tool on the right.<\/p>\n<\/header>\n<nav role=\"tablist\" aria-label=\"Stations\" id=\"nav\"><\/nav>\n<div class=\"pager\" id=\"pager\"><\/div>\n\n<!-- 1 Calculator -->\n<section class=\"st\" id=\"s1\" data-t=\"1 \u00b7 Calculator\" data-s=\"Programmer mode\">\n  <div class=\"left\">\n    <h2>Your calculator speaks 4 bases<\/h2>\n    <p class=\"where\">Every Windows and Mac computer has a calculator with a Programmer mode that shows HEX, DEC, OCT and BIN at the same time.<\/p>\n    <span class=\"tag\">Tutorial 2 \u00b7 all questions<\/span>\n    <div class=\"box\"><h3>Do it on your computer<\/h3>\n      <div class=\"os\" data-os=\"calc\"><button class=\"on\" data-v=\"w\">Windows<\/button><button data-v=\"m\">Mac<\/button><\/div>\n      <ol data-for=\"calc\" data-v=\"w\"><li>Open <b>Calculator<\/b>.<\/li><li>Click the menu \u2630 and choose <b>Programmer<\/b>.<\/li><li>Click <b>DEC<\/b>, type <code>200<\/code>: read the HEX, OCT and BIN lines.<\/li><li>Click <b>HEX<\/b> and type <code>2F<\/code>: what is it in DEC?<\/li><\/ol>\n      <ol data-for=\"calc\" data-v=\"m\" hidden><li>Open <b>Calculator<\/b>.<\/li><li>Press <kbd>\u2318<\/kbd> + <kbd>3<\/kbd> (View \u2192 Programmer).<\/li><li>Choose <b>10<\/b> (decimal), type <code>200<\/code>, then switch to <b>16<\/b> and <b>8<\/b>.<\/li><li>The binary bits are shown under the display.<\/li><\/ol>\n    <\/div>\n    <p class=\"think\"><strong>Rule for today:<\/strong> solve the tutorial question by hand first. Use the calculator only to check. In the exam, there is no calculator for this!<\/p>\n  <\/div>\n  <div class=\"try\"><h3>Try it here: one number, four bases<\/h3>\n    <div class=\"row\"><input type=\"text\" id=\"cIn\" class=\"mono\" value=\"200\" aria-label=\"Number\" size=\"12\"><label>written in base <select id=\"cBase\"><option>10<\/option><option>2<\/option><option>8<\/option><option>16<\/option><\/select><\/label><\/div>\n    <table class=\"t\" id=\"cOut\"><\/table>\n    <p class=\"note\">Whole numbers only here. The Windows calculator also works with whole numbers only in Programmer mode: fractions (Q3, Q4) must be done by hand.<\/p>\n  <\/div>\n<\/section>\n\n<!-- 2 Colours -->\n<section class=\"st\" id=\"s2\" hidden data-t=\"2 \u00b7 Colours\" data-s=\"Hex colour codes\">\n  <div class=\"left\">\n    <h2>Every colour on screen is 3 hex numbers<\/h2>\n    <p class=\"where\">A colour like <code>#E8590C<\/code> is three bytes: Red, Green, Blue. Each pair of hex digits is a number from 0 to 255.<\/p>\n    <span class=\"tag\">Q4 \u00b7 hex \u2192 decimal<\/span><span class=\"tag\">Q6 \u00b7 hex \u2192 binary<\/span>\n    <div class=\"box\"><h3>Do it on your computer<\/h3>\n      <div class=\"os\" data-os=\"col\"><button class=\"on\" data-v=\"w\">Windows<\/button><button data-v=\"m\">Mac<\/button><\/div>\n      <ol data-for=\"col\" data-v=\"w\"><li>Open <b>Paint<\/b> \u2192 <b>Edit colours<\/b> (or Word \u2192 Font colour \u2192 More colours \u2192 Custom).<\/li><li>Pick any colour: read the <b>Red, Green, Blue<\/b> values (decimal) and the <b>Hex<\/b> code.<\/li><li>Check one pair by hand: <code>E8<\/code> = 14 \u00d7 16 + 8 = ?<\/li><\/ol>\n      <ol data-for=\"col\" data-v=\"m\" hidden><li>Open <b>Digital Color Meter<\/b> (Applications \u2192 Utilities).<\/li><li>Choose <b>Display in sRGB<\/b>, then View \u2192 Display Values \u2192 <b>as Hexadecimal<\/b>.<\/li><li>Move the mouse over any colour on screen and read the values.<\/li><\/ol>\n    <\/div>\n    <p class=\"think\"><strong>Think:<\/strong> why do colour codes use exactly 2 hex digits per colour? How many bits is that?<\/p>\n  <\/div>\n  <div class=\"try\"><h3>Try it here: pick a colour<\/h3>\n    <div class=\"row\"><input type=\"color\" id=\"colIn\" value=\"#e8590c\" aria-label=\"Colour\"> <span class=\"out\" id=\"colHex\"><\/span><\/div>\n    <div class=\"sw\" id=\"colSw\"><\/div>\n    <table class=\"t\" id=\"colOut\"><\/table>\n  <\/div>\n<\/section>\n\n<!-- 3 Text -->\n<section class=\"st\" id=\"s3\" hidden data-t=\"3 \u00b7 Text\" data-s=\"Letters are numbers\">\n  <div class=\"left\">\n    <h2>Every letter you type is a number<\/h2>\n    <p class=\"where\">The computer stores each character as a code. In ASCII, <code>A<\/code> is 65, which is <code>41<\/code> in hex and <code>01000001<\/code> in binary.<\/p>\n    <span class=\"tag\">Q3 \u00b7 decimal \u2192 binary<\/span><span class=\"tag\">Q6 \u00b7 hex<\/span>\n    <div class=\"box\"><h3>Do it on your computer<\/h3>\n      <div class=\"os\" data-os=\"txt\"><button class=\"on\" data-v=\"w\">Windows<\/button><button data-v=\"m\">Mac<\/button><\/div>\n      <ol data-for=\"txt\" data-v=\"w\"><li>Open <b>Notepad<\/b>.<\/li><li>Hold <kbd>Alt<\/kbd> and type <code>65<\/code> on the <b>numeric keypad<\/b>, then release <kbd>Alt<\/kbd>: a letter appears!<\/li><li>Try <code>Alt + 97<\/code>, <code>Alt + 64<\/code>. Which characters are they?<\/li><\/ol>\n      <ol data-for=\"txt\" data-v=\"m\" hidden><li>Open <b>Terminal<\/b>.<\/li><li>Type the command below: it shows each letter of \"Hi\" as hex bytes.<\/li><\/ol>\n      <div class=\"term\"><button class=\"copy\">Copy<\/button><span class=\"c\"># Mac / Linux terminal<\/span>\nprintf 'Hi' | xxd\n<span class=\"c\"># Windows PowerShell<\/span>\n[System.Text.Encoding]::ASCII.GetBytes('Hi') | % { '{0:X2}' -f $_ }<\/div>\n    <\/div>\n    <p class=\"think\"><strong>Think:<\/strong> capital <code>A<\/code> is 65 and small <code>a<\/code> is 97. Look at their binary codes: which single bit changes?<\/p>\n  <\/div>\n  <div class=\"try\"><h3>Try it here: type a word<\/h3>\n    <div class=\"row\"><input type=\"text\" id=\"txIn\" value=\"USM\" maxlength=\"12\" aria-label=\"Text\"><\/div>\n    <table class=\"t\" id=\"txOut\"><\/table>\n  <\/div>\n<\/section>\n\n<!-- 4 Files -->\n<section class=\"st\" id=\"s4\" hidden data-t=\"4 \u00b7 Files\" data-s=\"Files in hex\">\n  <div class=\"left\">\n    <h2>Every file starts with a hex \"signature\"<\/h2>\n    <p class=\"where\">Open any file as raw bytes and you see hexadecimal. The first bytes tell what kind of file it is, whatever its name.<\/p>\n    <span class=\"tag\">Q6 \u00b7 hex \u2194 binary<\/span>\n    <div class=\"box\"><h3>Do it on your computer<\/h3>\n      <div class=\"os\" data-os=\"file\"><button class=\"on\" data-v=\"w\">Windows<\/button><button data-v=\"m\">Mac<\/button><\/div>\n      <ol data-for=\"file\" data-v=\"w\"><li>Open <b>PowerShell<\/b> in a folder with a picture or a PDF.<\/li><li>Run the command below (change the file name).<\/li><li>Compare the first bytes with the table on the right.<\/li><\/ol>\n      <ol data-for=\"file\" data-v=\"m\" hidden><li>Open <b>Terminal<\/b> in a folder with a picture or a PDF.<\/li><li>Run the command below (change the file name).<\/li><\/ol>\n      <div class=\"term\"><button class=\"copy\">Copy<\/button><span class=\"c\"># Windows PowerShell<\/span>\nFormat-Hex .\\photo.png | Select-Object -First 2\n<span class=\"c\"># Mac / Linux<\/span>\nxxd photo.png | head -2<\/div>\n    <\/div>\n    <table class=\"t\"><tr><th>file type<\/th><th>first bytes (hex)<\/th><th>as text<\/th><\/tr>\n      <tr><td>PNG image<\/td><td class=\"n b16\">89 50 4E 47<\/td><td class=\"n\">.PNG<\/td><\/tr>\n      <tr><td>PDF<\/td><td class=\"n b16\">25 50 44 46<\/td><td class=\"n\">%PDF<\/td><\/tr>\n      <tr><td>JPEG photo<\/td><td class=\"n b16\">FF D8 FF<\/td><td class=\"n\">\u2026<\/td><\/tr>\n      <tr><td>ZIP, DOCX, XLSX<\/td><td class=\"n b16\">50 4B 03 04<\/td><td class=\"n\">PK..<\/td><\/tr><\/table>\n  <\/div>\n  <div class=\"try\"><h3>Try it here: drop a file<\/h3>\n    <label class=\"drop\" id=\"drop\" for=\"fIn\">Choose or drop any file (it stays on your computer)<br><input type=\"file\" id=\"fIn\" style=\"margin-top:8px\"><\/label>\n    <div id=\"fOut\"><\/div>\n    <p class=\"note\">Why does a .docx file start with \"PK\"? Rename a copy to .zip and open it: a Word file is a ZIP folder!<\/p>\n  <\/div>\n<\/section>\n\n<!-- 5 Network -->\n<section class=\"st\" id=\"s5\" hidden data-t=\"5 \u00b7 Network\" data-s=\"IP and MAC addresses\">\n  <div class=\"left\">\n    <h2>Your network address is binary<\/h2>\n    <p class=\"where\">An IPv4 address like <code>192.168.1.10<\/code> is 4 bytes written in decimal. Your network card's MAC address is 6 bytes written in hex.<\/p>\n    <span class=\"tag\">Q3 \u00b7 decimal \u2192 binary<\/span><span class=\"tag\">Q6 \u00b7 hex<\/span>\n    <div class=\"box\"><h3>Do it on your computer<\/h3>\n      <div class=\"os\" data-os=\"net\"><button class=\"on\" data-v=\"w\">Windows<\/button><button data-v=\"m\">Mac<\/button><\/div>\n      <ol data-for=\"net\" data-v=\"w\"><li>Open <b>Command Prompt<\/b> and run the command below.<\/li><li>Find your <b>IPv4 Address<\/b> and <b>Subnet Mask<\/b> (decimal) and your <b>Physical Address<\/b> (hex).<\/li><li>Type your IP and mask in the tool on the right.<\/li><\/ol>\n      <ol data-for=\"net\" data-v=\"m\" hidden><li>Open <b>Terminal<\/b> and run the command below.<\/li><li>Look for <code>inet<\/code> (IP), <code>netmask<\/code> (written in hex!) and <code>ether<\/code> (MAC, hex).<\/li><\/ol>\n      <div class=\"term\"><button class=\"copy\">Copy<\/button><span class=\"c\"># Windows<\/span>\nipconfig /all\n<span class=\"c\"># Mac<\/span>\nifconfig en0<\/div>\n    <\/div>\n    <p class=\"think\"><strong>Think:<\/strong> why does the mask 255.255.255.0 start with 24 ones in binary? On Mac it shows as <code>0xffffff00<\/code>: is that the same number?<\/p>\n  <\/div>\n  <div class=\"try\"><h3>Try it here: IP address in binary<\/h3>\n    <div class=\"row\"><label>IP <input type=\"text\" id=\"ipIn\" class=\"mono\" value=\"192.168.1.10\" size=\"15\"><\/label><label>Mask <input type=\"text\" id=\"mkIn\" class=\"mono\" value=\"255.255.255.0\" size=\"15\"><\/label><\/div>\n    <table class=\"t\" id=\"ipOut\"><\/table>\n  <\/div>\n<\/section>\n\n<!-- 6 Permissions -->\n<section class=\"st\" id=\"s6\" hidden data-t=\"6 \u00b7 Permissions\" data-s=\"Octal in chmod\">\n  <div class=\"left\">\n    <h2>File permissions are octal<\/h2>\n    <p class=\"where\">On Linux and Mac, <code>chmod 755<\/code> sets who can read, write and run a file. Each octal digit is exactly 3 bits: read, write, execute.<\/p>\n    <span class=\"tag\">Q5 \u00b7 1 octal digit = 3 bits<\/span>\n    <div class=\"box\"><h3>Do it on your computer (Mac, Linux, or WSL on Windows)<\/h3>\n      <div class=\"term\"><button class=\"copy\">Copy<\/button>touch test.txt\nls -l test.txt        <span class=\"c\"># -rw-r--r--<\/span>\nchmod 750 test.txt\nls -l test.txt        <span class=\"c\"># what changed?<\/span>\nstat -f \"%Lp\" test.txt  <span class=\"c\"># Mac: show the octal value<\/span><\/div>\n      <p class=\"note\">On Windows without WSL, look at a file's Properties \u2192 Security: the same idea (read, write, execute) without octal.<\/p>\n    <\/div>\n    <p class=\"think\"><strong>Think:<\/strong> why does octal fit permissions perfectly? What would a hex digit (4 bits) give?<\/p>\n  <\/div>\n  <div class=\"try\"><h3>Try it here: tick the permissions<\/h3>\n    <table class=\"perm\" id=\"perm\"><\/table>\n    <div class=\"big\" id=\"permOut\"><\/div>\n    <p class=\"note\" id=\"permTxt\"><\/p>\n  <\/div>\n<\/section>\n\n<!-- 7 Fractions -->\n<section class=\"st\" id=\"s7\" hidden data-t=\"7 \u00b7 0.1 + 0.2\" data-s=\"Fractions in binary\">\n  <div class=\"left\">\n    <h2>Why 0.1 + 0.2 is not 0.3<\/h2>\n    <p class=\"where\">Your computer stores fractions in binary. Some decimal fractions, like 0.625, are exact in binary. Others, like 0.1, never end, so the computer rounds them.<\/p>\n    <span class=\"tag\">Q3 \u00b7 fractions \u00d7 2<\/span><span class=\"tag\">Q4 \u00b7 hex fractions<\/span>\n    <div class=\"box\"><h3>Do it on your computer<\/h3>\n      <ol><li>In any browser, press <kbd>F12<\/kbd> (Mac: <kbd>\u2318<\/kbd> <kbd>\u2325<\/kbd> <kbd>I<\/kbd>) and open <b>Console<\/b>.<\/li><li>Type the lines below one by one.<\/li><\/ol>\n      <div class=\"term\"><button class=\"copy\">Copy<\/button>0.1 + 0.2\n0.5 + 0.125\n(0.625).toString(2)\n(0.1).toString(2)<\/div>\n    <\/div>\n    <p class=\"think\"><strong>Think:<\/strong> use the \"multiply by 2\" method from Q3 on 0.1. When does it stop? Why does 0.625 stop after 3 steps?<\/p>\n  <\/div>\n  <div class=\"try\"><h3>Try it here: is it exact in binary?<\/h3>\n    <div class=\"row\"><label>Fraction 0.<input type=\"text\" id=\"frIn\" class=\"mono\" value=\"1\" size=\"6\"><\/label><button class=\"btn\" id=\"frGo\">Multiply by 2, step by step<\/button><\/div>\n    <table class=\"t\" id=\"frOut\"><\/table>\n    <div class=\"out\" id=\"frRes\"><\/div>\n    <div class=\"row\" style=\"margin-top:12px\"><button class=\"btn ghost\" id=\"addGo\">Run 0.1 + 0.2 in this browser<\/button><span class=\"out\" id=\"addOut\"><\/span><\/div>\n  <\/div>\n<\/section>\n\n<!-- 8 Storage -->\n<section class=\"st\" id=\"s8\" hidden data-t=\"8 \u00b7 Storage\" data-s=\"Where did my GB go?\">\n  <div class=\"left\">\n    <h2>Where did my gigabytes go?<\/h2>\n    <p class=\"where\">A disk sold as 512 GB shows less in Windows. Makers count 1 GB = 1000\u00b3 bytes (decimal). Windows counts 1 GB = 1024\u00b3 bytes (powers of 2).<\/p>\n    <span class=\"tag\">Powers of 2<\/span><span class=\"tag\">OS Tutorial 2 \u00b7 Q1 (1K = 1024)<\/span>\n    <div class=\"box\"><h3>Do it on your computer<\/h3>\n      <div class=\"os\" data-os=\"sto\"><button class=\"on\" data-v=\"w\">Windows<\/button><button data-v=\"m\">Mac<\/button><\/div>\n      <ol data-for=\"sto\" data-v=\"w\"><li>Open <b>File Explorer<\/b> \u2192 This PC \u2192 right-click <b>C:<\/b> \u2192 <b>Properties<\/b>.<\/li><li>Read the <b>Capacity<\/b>: it shows bytes AND GB. Divide the bytes by 1024 three times.<\/li><\/ol>\n      <ol data-for=\"sto\" data-v=\"m\" hidden><li>Apple menu \u2192 About This Mac \u2192 <b>Storage<\/b> (or Disk Utility).<\/li><li>macOS counts in powers of 10, like the box! Compare with a Windows PC.<\/li><\/ol>\n    <\/div>\n    <p class=\"think\"><strong>Think:<\/strong> 2<sup>10<\/sup> = 1024 is close to 1000. Why does the gap grow bigger for GB and TB?<\/p>\n  <\/div>\n  <div class=\"try\"><h3>Try it here: advertised vs shown<\/h3>\n    <div class=\"row\"><label>Disk on the box <select id=\"stIn\"><option>128<\/option><option>256<\/option><option selected>512<\/option><option>1000<\/option><option>2000<\/option><\/select> GB<\/label><\/div>\n    <div id=\"stOut\"><\/div>\n  <\/div>\n<\/section>\n\n<!-- 9 Code -->\n<section class=\"st\" id=\"s9\" hidden data-t=\"9 \u00b7 Code\" data-s=\"Prefixes 0x 0b 0o\">\n  <div class=\"left\">\n    <h2>Programmers write bases with prefixes<\/h2>\n    <p class=\"where\">In code, <code>0x<\/code> means hex, <code>0b<\/code> binary, <code>0o<\/code> octal. Windows error codes are hex too: <code>0x80070005<\/code> means \"access denied\".<\/p>\n    <span class=\"tag\">All questions<\/span>\n    <div class=\"box\"><h3>Do it on your computer (Python or browser console)<\/h3>\n      <div class=\"term\"><button class=\"copy\">Copy<\/button><span class=\"c\"># Python<\/span>\nbin(42)        <span class=\"c\"># '0b101010'<\/span>\nhex(255)       <span class=\"c\"># '0xff'<\/span>\noct(64)        <span class=\"c\"># '0o100'<\/span>\nint('2F', 16)  <span class=\"c\"># 47<\/span>\nint('101', 2)  <span class=\"c\"># 5<\/span>\n<span class=\"c\"># JavaScript (browser console)<\/span>\n(42).toString(2)\nparseInt('2F', 16)\n(44).toString(5)   <span class=\"c\"># any base from 2 to 36!<\/span><\/div>\n    <\/div>\n    <p class=\"think\"><strong>Think:<\/strong> <code>toString(5)<\/code> converts to base 5. Which method from the tutorial is the computer using inside?<\/p>\n  <\/div>\n  <div class=\"try\"><h3>Try it here: read a prefixed number<\/h3>\n    <div class=\"row\"><input type=\"text\" id=\"pxIn\" class=\"mono\" value=\"0x80070005\" size=\"16\" aria-label=\"Prefixed number\"><\/div>\n    <table class=\"t\" id=\"pxOut\"><\/table>\n    <p class=\"note\">Try <code>0b1111<\/code>, <code>0o777<\/code>, <code>0xFF<\/code>, <code>0xC0FFEE<\/code>.<\/p>\n  <\/div>\n<\/section>\n\n<footer>Practical companion for CCA102 / CST131 Tutorial 2. Solve by hand first; use the computer to check and to see where these numbers live.<\/footer>\n<\/div>\n\n<script>\nconst $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];\nconst ST=$$('.st');\n$('#nav').innerHTML=ST.map((s,i)=>`<button role=\"tab\" aria-selected=\"${i===0}\" data-i=\"${i}\"><b>${s.dataset.t}<\/b><span>${s.dataset.s}<\/span><\/button>`).join('');\nfunction show(i,scroll){ ST.forEach((s,k)=>s.hidden=k!==i); $$('[data-i]').forEach(b=>b.setAttribute('aria-selected',+b.dataset.i===i));\n  $('#pager').innerHTML=(i>0?`<button class=\"btn ghost\" id=\"pv\">Previous: ${ST[i-1].dataset.t}<\/button>`:'<span><\/span>')+(i<ST.length-1?`<button class=\"btn\" id=\"nx\">Next: ${ST[i+1].dataset.t}<\/button>`:'');\n  if(i>0) $('#pv').onclick=()=>show(i-1,true); if(i<ST.length-1) $('#nx').onclick=()=>show(i+1,true);\n  if(scroll){const top=$('#pager').getBoundingClientRect().top+scrollY-$('nav').offsetHeight-10; if(scrollY>top) scrollTo({top});} }\n$$('[data-i]').forEach(b=>b.onclick=()=>show(+b.dataset.i,true)); show(0,false);\n// OS toggles\n$$('[data-os]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));\n  $$(`[data-for=\"${g.dataset.os}\"]`).forEach(o=>o.hidden=o.dataset.v!==b.dataset.v); }));\n// copy buttons\n$$('.copy').forEach(b=>b.onclick=()=>{ const t=b.parentElement.innerText.replace(/^Copy\\n?/,'').replace(/\\s+#.*$/gm,'').trim(); navigator.clipboard?.writeText(t).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200);}).catch(()=>{}); });\nconst pad=(s,n)=>s.padStart(n,'0');\nconst grp=(s,n)=>s.replace(new RegExp(`\\\\B(?=(\\\\d{${n}})+(?!\\\\d))`,'g'),' ');\n\n// 1 calculator\nfunction calc(){ const b=+$('#cBase').value, s=$('#cIn').value.trim().toUpperCase(); const ok=s&&[...s].every(c=>{const d=parseInt(c,36);return !isNaN(d)&&d<b;});\n  if(!ok){ $('#cOut').innerHTML=`<tr><td style=\"color:var(--bad)\">\"${s}\" is not a valid base-${b} number. Allowed digits: ${'0123456789ABCDEF'.slice(0,b).split('').join(' ')}<\/td><\/tr>`; return; }\n  const v=BigInt(parseInt(s,b)); const r=[['HEX',16,'b16'],['DEC',10,'b10'],['OCT',8,'b8'],['BIN',2,'b2']];\n  $('#cOut').innerHTML=r.map(([n,base,c])=>`<tr><th>${n}<\/th><td class=\"n ${c}\">${base===2?grp(v.toString(2),4):v.toString(base).toUpperCase()}<\/td><\/tr>`).join(''); }\n$('#cIn').oninput=calc; $('#cBase').onchange=calc; calc();\n\n// 2 colours\nfunction col(){ const h=$('#colIn').value.toUpperCase(); $('#colHex').textContent=h; $('#colSw').style.background=h;\n  const parts=[['Red',h.slice(1,3)],['Green',h.slice(3,5)],['Blue',h.slice(5,7)]];\n  $('#colOut').innerHTML='<tr><th>channel<\/th><th>hex<\/th><th>calculation<\/th><th>decimal<\/th><th>binary<\/th><\/tr>'+parts.map(([n,x])=>{const a=parseInt(x[0],16),b=parseInt(x[1],16);return `<tr><td>${n}<\/td><td class=\"n b16\">${x}<\/td><td class=\"n\">${a} \u00d7 16 + ${b}<\/td><td class=\"n b10\">${a*16+b}<\/td><td class=\"n b2\">${pad(a.toString(2),4)} ${pad(b.toString(2),4)}<\/td><\/tr>`;}).join(''); }\n$('#colIn').oninput=col; col();\n\n// 3 text\nfunction txt(){ const s=$('#txIn').value; $('#txOut').innerHTML='<tr><th>char<\/th><th>decimal<\/th><th>hex<\/th><th>binary<\/th><\/tr>'+[...s].map(c=>{const v=c.codePointAt(0);return `<tr><td class=\"n\">${c===' '?'(space)':c}<\/td><td class=\"n b10\">${v}<\/td><td class=\"n b16\">${v.toString(16).toUpperCase()}<\/td><td class=\"n b2\">${v<256?grp(pad(v.toString(2),8),4):grp(v.toString(2),4)}<\/td><\/tr>`;}).join(''); }\n$('#txIn').oninput=txt; txt();\n\n// 4 files\nconst SIG=[['89504E47','PNG image'],['25504446','PDF document'],['FFD8FF','JPEG image'],['504B0304','ZIP archive (also DOCX, XLSX, PPTX)'],['47494638','GIF image'],['4D5A','Windows program (EXE)'],['7F454C46','Linux program (ELF)']];\nfunction readFile(f){ if(!f) return; f.slice(0,16).arrayBuffer().then(buf=>{ const b=[...new Uint8Array(buf)]; const hex=b.map(x=>pad(x.toString(16).toUpperCase(),2));\n  const kind=(SIG.find(([s])=>hex.join('').startsWith(s))||[0,'not in our list'])[1];\n  $('#fOut').innerHTML=`<p><b>${f.name}<\/b> \u00b7 ${f.size.toLocaleString()} bytes \u00b7 type from bytes: <b>${kind}<\/b><\/p><div class=\"bytes\">${b.map((x,k)=>`<span class=\"b16\">${hex[k]}<small>${x>31&&x<127?String.fromCharCode(x):'\u00b7'} \u00b7 ${x}<\/small><\/span>`).join('')}<\/div><p class=\"note\">Each box: hex byte, then the character and the decimal value.<\/p>`; }); }\n$('#fIn').onchange=e=>readFile(e.target.files[0]);\nconst dr=$('#drop'); dr.ondragover=e=>{e.preventDefault();dr.style.borderColor='var(--b2)';}; dr.ondragleave=()=>dr.style.borderColor=''; dr.ondrop=e=>{e.preventDefault();dr.style.borderColor='';readFile(e.dataTransfer.files[0]);};\n\n// 5 network\nfunction ip(){ const p=s=>s.trim().split('.').map(Number); const a=p($('#ipIn').value), m=p($('#mkIn').value);\n  const ok=x=>x.length===4&&x.every(n=>Number.isInteger(n)&&n>=0&&n<=255);\n  if(!ok(a)||!ok(m)){ $('#ipOut').innerHTML='<tr><td style=\"color:var(--bad)\">Write 4 numbers from 0 to 255, separated by dots.<\/td><\/tr>'; return; }\n  const ones=m.map(n=>pad(n.toString(2),8)).join('').split('').filter(x=>x==='1').length;\n  $('#ipOut').innerHTML='<tr><th>byte<\/th><th>IP (dec)<\/th><th>IP (binary)<\/th><th>mask (binary)<\/th><\/tr>'+a.map((n,k)=>`<tr><td>${k+1}<\/td><td class=\"n b10\">${n}<\/td><td class=\"n b2\">${pad(n.toString(2),8)}<\/td><td class=\"n\">${pad(m[k].toString(2),8)}<\/td><\/tr>`).join('')+\n   `<tr><th colspan=\"4\">Mask = ${ones} ones \u2192 written /${ones} \u00b7 in hex 0x${m.map(n=>pad(n.toString(16),2)).join('')}<\/th><\/tr>`; }\n$('#ipIn').oninput=ip; $('#mkIn').oninput=ip; ip();\n\n// 6 permissions\nconst WHO=['Owner','Group','Others'], RWX=['read (4)','write (2)','execute (1)'];\nlet P=[[1,1,1],[1,0,1],[1,0,1]];\nfunction perm(){ $('#perm').innerHTML='<tr><th><\/th>'+RWX.map(r=>`<th>${r}<\/th>`).join('')+'<th>bits<\/th><th>octal<\/th><\/tr>'+WHO.map((w,i)=>`<tr><th>${w}<\/th>${P[i].map((v,j)=>`<td><input type=\"checkbox\" aria-label=\"${w} ${RWX[j]}\" data-p=\"${i}${j}\" ${v?'checked':''}><\/td>`).join('')}<td class=\"n b2\">${P[i].join('')}<\/td><td class=\"n b8\">${P[i][0]*4+P[i][1]*2+P[i][2]}<\/td><\/tr>`).join('');\n  $$('[data-p]').forEach(c=>c.onchange=()=>{P[+c.dataset.p[0]][+c.dataset.p[1]]=c.checked?1:0;perm();});\n  const oct=P.map(r=>r[0]*4+r[1]*2+r[2]).join('');\n  $('#permOut').innerHTML=`chmod <span class=\"b8\">${oct}<\/span> &nbsp; <span class=\"b2\" style=\"font-size:1.1rem\">${P.map(r=>r.join('')).join(' ')}<\/span>`;\n  $('#permTxt').textContent='ls -l shows: -'+P.map(r=>(r[0]?'r':'-')+(r[1]?'w':'-')+(r[2]?'x':'-')).join(''); }\nperm();\n\n// 7 fractions\n$('#frGo').onclick=()=>{ const s=$('#frIn').value.trim(); if(!/^\\d{1,6}$/.test(s)){ $('#frRes').textContent='Type the digits after \"0.\" (e.g. 625).'; return; }\n  let num=BigInt(s), den=10n**BigInt(s.length); const rows=[], seen=new Map(); let bits='', loop=-1;\n  for(let k=0;k<24&&num;k++){ if(seen.has(num.toString())){loop=seen.get(num.toString());break;} seen.set(num.toString(),k);\n    const m=num*2n, d=m>=den?1:0; rows.push([num,m,d]); bits+=d; num=m-BigInt(d)*den; }\n  const f=x=>{ let s=(x*10n**12n/den).toString().padStart(12,'0').replace(/0+$/,''); return '0.'+(s||'0'); };\n  $('#frOut').innerHTML='<tr><th>fraction<\/th><th>\u00d7 2<\/th><th>bit<\/th><\/tr>'+rows.slice(0,12).map(r=>`<tr><td class=\"n\">${f(r[0])}<\/td><td class=\"n\">${r[1]>=den?'1'+f(r[1]-den).slice(1):f(r[1])}<\/td><td class=\"n b2\">${r[2]}<\/td><\/tr>`).join('')+(rows.length>12?'<tr><td colspan=\"3\">\u2026<\/td><\/tr>':'');\n  $('#frRes').innerHTML=num===0n?`0.${s} = <span class=\"b2\">0.${bits}<\/span>\u2082 \u2014 exact, it stops!`:(loop>=0?`0.${s} = <span class=\"b2\">0.${bits.slice(0,loop)}(${bits.slice(loop)})\u2026<\/span>\u2082 \u2014 it repeats forever, so the computer must round it.`:`0.${s} = <span class=\"b2\">0.${bits}\u2026<\/span>\u2082 \u2014 still going\u2026`); };\n$('#frGo').click();\n$('#addGo').onclick=()=>{ $('#addOut').textContent='0.1 + 0.2 = '+(0.1+0.2); };\n\n// 8 storage\nfunction sto(){ const g=+$('#stIn').value, bytes=g*1e9, win=bytes/1024**3, lost=g-win;\n  $('#stOut').innerHTML=`<p>On the box: <b>${g} GB<\/b> = ${g} \u00d7 1000\u00b3 = <span class=\"n b10\">${bytes.toLocaleString()}<\/span> bytes<\/p><p>Windows divides by 1024\u00b3 = <span class=\"n\">1,073,741,824<\/span>:<\/p><p class=\"big b2\">${win.toFixed(1)} GB<\/p><div class=\"bar\" aria-hidden=\"true\"><i style=\"width:${win/g*100}%;background:var(--b2)\"><\/i><i style=\"width:${lost/g*100}%;background:var(--bad)\"><\/i><\/div><p class=\"note\">Nothing is missing: ${lost.toFixed(1)} \"GB\" are the same bytes counted with a different unit (${(lost/g*100).toFixed(1)}%).<\/p>`; }\n$('#stIn').onchange=sto; sto();\n\n// 9 prefixes\nfunction px(){ const s=$('#pxIn').value.trim().toLowerCase(); const m=s.match(/^0([xbo])([0-9a-f]+)$/); const B={x:16,b:2,o:8}; let v=null;\n  if(m){ const b=B[m[1]]; if([...m[2]].every(c=>parseInt(c,16)<b)) v=BigInt(parseInt(m[2],b)); }\n  if(v===null){ $('#pxOut').innerHTML='<tr><td style=\"color:var(--bad)\">Start with 0x (hex), 0b (binary) or 0o (octal), then valid digits.<\/td><\/tr>'; return; }\n  const extra=s==='0x80070005'?'<tr><th>meaning<\/th><td>Windows error \"E_ACCESSDENIED\": the 5 at the end is error 5 = access denied.<\/td><\/tr>':'';\n  $('#pxOut').innerHTML=`<tr><th>base<\/th><td>${{x:'hexadecimal (16)',b:'binary (2)',o:'octal (8)'}[m[1]]}<\/td><\/tr><tr><th>decimal<\/th><td class=\"n b10\">${v.toLocaleString()}<\/td><\/tr><tr><th>hex<\/th><td class=\"n b16\">0x${v.toString(16).toUpperCase()}<\/td><\/tr><tr><th>octal<\/th><td class=\"n b8\">0o${v.toString(8)}<\/td><\/tr><tr><th>binary<\/th><td class=\"n b2\">${grp(v.toString(2),4)}<\/td><\/tr>`+extra; }\n$('#pxIn').oninput=px; px();\n<\/script>\n<\/body>\n<\/html>\n\n<\/body><\/html>"}, {"fname": "3.Add-Shift Bit Train.html", "title": "3. Add-Shift Bit Train", "desc": "Tutorial 3 \u00b7 Add-shift & Booth multiplication bit-by-bit", "html": "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<title>Add-Shift Bit Train<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@600;700&family=JetBrains+Mono:wght@600;800&display=swap\">\n<style>\n/* Layout: one big \"train\" of bit boxes in the middle (add-shift: C | A | Q, Booth: A | Q | Q\u22121); the narration and the \"shift in 4 actions\" box under it; recipe, letters and history below. Purple = A, amber = Q, grey = the extra box. */\n:root{\n  --bg:#F2F1EC; --panel:#FFFFFF; --ink:#1C2230; --muted:#5D6474; --line:#D5D3CB; --soft:#E9E7E0;\n  --a:#6A4BC4; --a-soft:#ECE6FB; --q:#C46A0E; --q-soft:#FBEBDC; --c:#56606F; --hl:#FFE9A8; --ok:#1E7B52; --neg:#B4372B;\n  --display:\"Familjen Grotesk\",\"Segoe UI\",system-ui,sans-serif;\n  --body:\"Atkinson Hyperlegible\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-t
